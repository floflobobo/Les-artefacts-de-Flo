<title>Métabo Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,500;1,8..60,600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : carte métabolique sur papier millimétré — accueil (mondes + classement) puis plateau vertical + bac à pièces collant en bas */
:root{
  --paper:#edf2f0; --grid:#d5dfdc; --card:#ffffff; --ink:#13232a; --muted:#56696e; --line:#9db1b0;
  --glu:#0d6a87; --glu-soft:#d3ebf2; --lip:#9a5700; --lip-soft:#f5e3c6;
  --nrj:#5d6b12; --nrj-soft:#e8ecc9; --azo:#3d47b5; --azo-soft:#dfe1fa; --heme:#a3214f; --heme-soft:#f6d9e3; --lp:#7b3fa0; --lp-soft:#ecdcf5;
  --ok:#1b7a4b; --ok-soft:#d5efdf; --bad:#b2261d; --bad-soft:#f8dbd7; --sel:#5a3cc6; --sel-soft:#e7e1fb;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-enz:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d161a; --grid:#17242a; --card:#132027; --ink:#e2ebe9; --muted:#8ea2a5; --line:#3a5259;
  --glu:#5ec4e2; --glu-soft:#11323e; --lip:#f2a744; --lip-soft:#382811;
  --nrj:#bccd5c; --nrj-soft:#272c0c; --azo:#a3abff; --azo-soft:#1c2050; --heme:#ff86ad; --heme-soft:#3d1222; --lp:#d6a2f7; --lp-soft:#2e1a3c;
  --ok:#5fd393; --ok-soft:#113224; --bad:#ff8b81; --bad-soft:#3a1613; --sel:#ab98ff; --sel-soft:#25204a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d161a; --grid:#17242a; --card:#132027; --ink:#e2ebe9; --muted:#8ea2a5; --line:#3a5259;
  --glu:#5ec4e2; --glu-soft:#11323e; --lip:#f2a744; --lip-soft:#382811;
  --nrj:#bccd5c; --nrj-soft:#272c0c; --azo:#a3abff; --azo-soft:#1c2050; --heme:#ff86ad; --heme-soft:#3d1222; --lp:#d6a2f7; --lp-soft:#2e1a3c;
  --ok:#5fd393; --ok-soft:#113224; --bad:#ff8b81; --bad-soft:#3a1613; --sel:#ab98ff; --sel-soft:#25204a; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- accueil ---------- */
.hero{display:grid;gap:14px;padding-block:8px 22px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.hero h1{font-size:clamp(46px,9vw,92px);font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.hero h1 .arrow{color:var(--glu)}
.hero p{margin:0;max-width:60ch;color:var(--muted);font-size:16px}
.home{display:grid;gap:28px}
@media(min-width:1000px){.home{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.setup{display:grid;gap:16px;background:var(--card);border:1.5px solid var(--ink);padding:16px}
.setup label{display:grid;gap:6px;font-weight:600}
.setup input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);max-width:320px;width:100%}
.hint{font-size:13px;color:var(--muted);margin:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.mode{text-align:left;padding:10px 12px;border:1.5px solid var(--line);background:var(--paper);display:grid;gap:2px}
.mode b{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.mode span{font-size:13px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft);box-shadow:inset 4px 0 0 var(--sel)}
.world{display:grid;gap:12px}
.world-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:6px}
.world-head h2{font-size:34px;text-transform:uppercase;color:var(--w)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lvl{text-align:left;background:var(--card);border:1.5px solid var(--line);padding:12px;display:grid;gap:8px;align-content:start;min-width:0;transition:transform .12s,border-color .12s}
.lvl:hover{border-color:var(--w);transform:translateY(-2px)}
.lvl h3{font-size:22px;text-transform:uppercase;letter-spacing:.01em}
.lvl .sub{font-size:13px;color:var(--muted);margin:0}
.lvl .num{font-family:var(--f-mono);font-size:11px;color:var(--w);letter-spacing:.08em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border:1px solid var(--line);color:var(--muted)}
.pill.done{border-color:var(--w);color:var(--w);font-weight:700}
.locked{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.lockcard{border:1.5px dashed var(--line);padding:10px;color:var(--muted);display:grid;gap:2px}
.lockcard b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;color:var(--ink)}
.board-aside{display:grid;gap:12px;background:var(--card);border:1.5px solid var(--ink);padding:16px}
@media(min-width:1000px){.board-aside{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}}
.board-aside h2{font-size:30px;text-transform:uppercase}
.lb{list-style:none;margin:0;padding:0;display:grid}
.lb li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--grid)}
.lb li .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb li.me{background:var(--sel-soft);padding-inline:6px;margin-inline:-6px}
.lb .rk{font-family:var(--f-mono);color:var(--muted)}
.lb .pts{font-family:var(--f-mono);font-weight:700}
.mytotal{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:8px}
.mytotal .big{font-family:var(--f-display);font-size:34px;font-weight:800}
.note{font-size:13px;color:var(--muted);margin:0}
.note.warn{color:var(--bad)}

/* ---------- plateau ---------- */
.playbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);padding-top:env(safe-area-inset-top,0px)}
.playbar .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.playbar h1{font-size:clamp(20px,6vw,26px);text-transform:uppercase;flex:1 1 150px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--w)}
.back{border:1.5px solid var(--ink);background:var(--card);padding:6px 10px;font-weight:600}
.badge{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:1.5px solid var(--sel);color:var(--sel);font-weight:700}
.timer{font-family:var(--f-mono);font-weight:700;font-size:15px}
.play{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:18px 24px;display:grid;gap:26px}
.intro{margin:0;color:var(--muted)}
.chain{display:grid;justify-items:start;gap:0;min-width:0}
.clabel{font-family:var(--f-display);font-size:20px;text-transform:uppercase;margin-bottom:8px;color:var(--w)}
.mol{font-weight:700;padding:8px 14px;border:2px solid var(--w);background:var(--card);border-radius:999px;max-width:100%}
.mol.fx{background:var(--wsoft)}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);min-height:56px;margin-left:22px;width:calc(100% - 22px)}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:12px;top:0;bottom:8px;border-left:2.5px solid var(--w)}
.rail::after{content:"";position:absolute;left:6.5px;bottom:0;border:7px solid transparent;border-top:9px solid var(--w);border-bottom:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:10px;min-width:0}
.enz{font-family:var(--f-enz);font-style:italic;font-weight:600;font-size:16px}
.tag{font-family:var(--f-mono);font-size:12px;padding:2px 7px;border:1px solid var(--line);background:var(--card)}
.slot{min-height:38px;min-width:120px;max-width:100%;padding:6px 12px;border:2px dashed var(--line);background:var(--card);text-align:left;color:var(--muted);overflow-wrap:anywhere}
.slot.enz{color:var(--ink)}
.slot.filled{border-style:solid;border-color:var(--ink);color:var(--ink)}
.slot.mol{border-radius:999px}
.slot.want{border-color:var(--sel);background:var(--sel-soft);color:var(--sel)}
.slot.ok{border:2px solid var(--ok);background:var(--ok-soft);color:var(--ink)}
.slot.bad{border:2px solid var(--bad);background:var(--bad-soft);color:var(--ink)}
.slot .fix{display:block;font-family:var(--f-body);font-style:normal;font-weight:700;color:var(--ok);font-size:13px}
.slot .was{text-decoration:line-through;opacity:.75}
.ph{font-family:var(--f-mono);font-size:12px;font-style:normal;letter-spacing:.06em;text-transform:uppercase}
.gridwrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;background:var(--card);border:1.5px solid var(--ink)}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:8px;border-bottom:1.5px solid var(--ink);color:var(--muted);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
td:first-child{font-weight:600}
td .slot{min-width:110px;width:100%}
.tray{position:sticky;bottom:0;z-index:5;background:var(--card);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.tray .in{max-width:900px;margin:0 auto;padding:10px 16px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:min(34vh,260px);overflow-y:auto}
.chip{padding:6px 10px;border:1.5px solid var(--ink);background:var(--paper);font-weight:600;font-size:14px;text-align:left}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--card)}
.trayfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta{background:var(--ink);color:var(--paper);border:0;padding:10px 18px;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.cta.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.result{background:var(--card);border:2px solid var(--ink);padding:16px;display:grid;gap:12px}
.result .score{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1}
.result ul{margin:0;padding-left:18px;display:grid;gap:6px}
.result .acts{display:flex;gap:8px;flex-wrap:wrap}
.tip{border-left:4px solid var(--w);padding-left:10px;margin:0}
.typer{display:grid;gap:8px}
.typectx{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.typectx b{color:var(--ink)}
.sugs{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;max-height:min(22vh,150px);overflow-y:auto}
.sug{padding:6px 10px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;text-align:left}
.sug[aria-selected="true"]{border-color:var(--sel);background:var(--sel-soft);color:var(--ink)}
.sug mark{background:transparent;color:var(--sel);font-weight:800}
.typerow{display:flex;gap:8px;min-width:0}
.typerow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink)}
.typerow button{border:2px solid var(--ink);background:var(--card);font-weight:700;padding:8px 12px;white-space:nowrap}
.overview{position:relative;width:100%;max-width:560px;height:400px;margin-inline:auto;background:var(--card);border:1.5px solid var(--ink)}
.overview svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.overview path{fill:none;stroke:var(--line);stroke-width:2.5;vector-effect:non-scaling-stroke}
.onode{position:absolute;transform:translate(-50%,-50%);max-width:44%;padding:6px 10px;border:2px solid var(--h);background:var(--card);border-radius:999px;font-weight:700;font-size:13px;line-height:1.2;text-align:center;color:var(--ink)}
.onode:hover{background:var(--hsoft)}
.ocap{margin:-12px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.hubs{display:grid;gap:18px}
.hub{background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--h);padding:14px;display:grid;gap:10px;scroll-margin-top:90px;min-width:0}
.hubname{font-size:28px;text-transform:uppercase;color:var(--h)}
.hubsub{margin:-6px 0 0;color:var(--muted);font-size:13px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-block:6px;border-top:1px solid var(--grid);min-width:0}
.route .dir{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.route .dir.go{color:var(--h)}
.route.from{color:var(--muted);font-size:13px}
.hublink{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px}
.hublink:hover{background:var(--sel-soft)}
.slot.voie,.tag.voie{font-family:var(--f-mono);font-size:12px}
.bossworld .world-head h2{color:var(--ink)}
.lvl.bosscard{border:2.5px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 var(--ink)}
.lvl.bosscard:hover{border-color:var(--ink)}
.lvl.bosscard h3{font-size:30px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = s => String(s).trim();
const GREEK = {"α":" alpha ","β":" beta ","γ":" gamma ","δ":" delta ","Δ":" delta "};
const SUPS = {"⁺":"+","⁻":"-","¹":"1","²":"2","³":"3","ᵉ":"e","ʳ":"r"};
const nrm = t => String(t)
  .replace(/[αβγδΔ]/g, c => GREEK[c])
  .replace(/[₀-₉]/g, c => String(c.charCodeAt(0)-0x2080))
  .replace(/[⁺⁻¹²³ᵉʳ]/g, c => SUPS[c])
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
  .replace(/[^a-z0-9+]+/g," ").trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n]; }
let BANK = null, BANKN = null;
function bank(){
  if (BANK) return BANK;
  const set = new Set();
  LEVELS.forEach(L => { const b = build(L,"m"); b.chips.forEach(c=>set.add(c.t)); b.slots.forEach(x=>set.add(x.ans)); });
  COFS.concat(LOCS).forEach(t=>set.add(t));
  BANK = [...set].sort((a,b)=>a.localeCompare(b,"fr")); BANKN = BANK.map(nrm);
  return BANK;
}
function suggest(q){
  bank(); const nq = nrm(q); if (!nq) return [];
  const out = [];
  BANK.forEach((t,i) => {
    const nt = BANKN[i]; let sc = -1;
    if (nt.startsWith(nq)) sc = 0;
    else if (nt.includes(" "+nq)) sc = 1;
    else if (nt.includes(nq)) sc = 2;
    else if (nq.length >= 4){
      const words = nt.split(" ");
      for (let k=0;k<words.length && sc<0;k++){
        const tail = words.slice(k).join(" ");
        if (lev(nq, tail.slice(0,nq.length))<=1 || lev(nq, tail.slice(0,nq.length+1))<=1 || (nq.length>=7 && lev(nq, tail.slice(0,nq.length))<=2)) sc = 3;
      }
    }
    if (sc>=0) out.push([sc, t.length, t]);
  });
  return out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,6).map(x=>x[2]);
}

function levelBest(id){ const b=S.best[id]||{}; let mx=0; for(const k in b) mx=Math.max(mx,b[k]||0); return mx; }
function total(){ return LEVELS.reduce((t,l)=>t+levelBest(l.id),0); }
function doneCount(){ return LEVELS.filter(l=>levelBest(l.id)>0).length; }

/* ============ CONSTRUCTION D'UN PUZZLE ============ */
function build(level, mode){
  const slots=[], parts=[];
  const mk = (ans, kind, blank, why, ctx) => blank ? (slots.push({id:slots.length, ans:norm(ans), kind, val:null, why, ctx}), slots[slots.length-1]) : {fixed:true, ans, kind};
  level.chains.forEach(ch => {
    const steps = ch.steps.map((st,i) => {
      const ctx = (ch.label ? ch.label+", " : "") + "étape " + (i+1);
      const blankE = !!st.e;
      const blankM = mode==="a" ? (!st.e && i%2===0) : true;
      return {
        e: st.e ? mk(st.e,"enz",blankE,st.w,ctx) : null,
        c: st.c ? mk(st.c,"cof",mode==="m",st.w,ctx) : null,
        l: st.l ? mk(st.l,"loc",mode==="m",st.w,ctx) : null,
        m: mk(st.m,"mol",blankM,st.w,ctx)
      };
    });
    parts.push({type:"chain", label:ch.label, start:ch.start, steps});
  });
  if (level.map){
    const M = level.map, hubIds = new Set(M.hubs.map(h=>h.id));
    const name = id => hubIds.has(id) ? M.hubs.find(h=>h.id===id).t : M.leaves[id];
    const rows = {}; M.hubs.forEach(h=>rows[h.id]=[]);
    M.edges.forEach(ed => {
      const fromHub = hubIds.has(ed.from);
      let home, partner, dir;
      if (ed.both){ home = fromHub?ed.from:ed.to; partner = fromHub?ed.to:ed.from; dir="both"; }
      else if (fromHub){ home=ed.from; partner=ed.to; dir="out"; }
      else { home=ed.to; partner=ed.from; dir="in"; }
      const ctx = name(home)+(dir==="in"?" ← ":dir==="both"?" ⇄ ":" → ")+name(partner);
      const pHub = hubIds.has(partner);
      rows[home].push({dir,
        p: pHub ? {hub:partner, t:name(partner)} : mk(name(partner),"mol",mode!=="a",ed.w,ctx),
        e: mk(ed.e,"enz",true,ed.w,ctx),
        v: mk(ed.v,"voie",mode==="m",ed.w,ctx)});
      if (dir==="out" && pHub) rows[partner].push({dir:"from", hub:home, t:name(home)});
    });
    parts.push({type:"map", hubs:M.hubs, edges:M.edges, hubIds, rows});
  }
  level.grids.forEach(g => {
    const rows = g.rows.map((r,ri) => r.map((cell,ci) => {
      if (ci===0) return {fixed:true, ans:cell};
      const blank = mode==="a" ? ci===r.length-1 : true;
      return mk(cell,"cell",blank,(g.whys||[])[ri],norm(r[0]));
    }));
    parts.push({type:"grid", cols:g.cols, rows});
  });
  let pool = slots.map(s=>s.ans);
  const nTrap = mode==="a" ? 4 : mode==="i" ? 6 : 99;
  const traps = shuffle(level.traps.slice()).slice(0,nTrap).filter(t=>!pool.includes(norm(t)));
  let extra = [];
  if (mode==="m"){
    extra = shuffle(COFS.filter(c=>!pool.includes(c))).slice(0,2);
    if (slots.some(s=>s.kind==="loc")) extra = extra.concat(LOCS.filter(c=>!pool.includes(c)));
    if (level.map) extra = (level.map.voieTraps||[]).filter(c=>!pool.includes(c));
  }
  const chips = shuffle(pool.concat(traps.map(norm), extra)).map((t,i)=>({id:i, t, used:false}));
  return {level, mode, slots, parts, chips, selChip:null, selSlot:null, checked:false, t0:Date.now(), secs:0,
    typing: S.input==="clavier", cur:null, sugs:[], sugIdx:-1};
}

/* ============ RENDU ============ */
const app = document.getElementById("app");
const PH = {enz:"enzyme", mol:"molécule", cof:"cofacteur", loc:"compartiment", voie:"voie", cell:"?"};

function slotText(x){ return P.typing ? (x.txt||null) : (x.val!==null ? P.chips[x.val].t : null); }
/* Quantités : "2" vaut "2 ATP" et inversement, si l'unité ajoutée est celle attendue ou celle de la ligne */
function qty(t){
  const m = nrm(t).match(/^(\d+(?: \d+)?)(?: (.+))?$/); if (!m) return null;
  const u = m[2] ? m[2].split(" ").map(w=>w.replace(/s$/,"")) : [];
  if (u.some(w=>/^\d+$/.test(w))) return null;
  return {n:m[1], u};
}
function qtyMatch(t, x){
  const a = qty(x.ans), b = qty(t); if (!a || !b || a.n!==b.n) return false;
  const ok = new Set(a.u.concat(nrm(x.ctx||"").split(" ").map(w=>w.replace(/s$/,""))));
  return b.u.every(w=>ok.has(w));
}
function isRight(x){ const t = slotText(x); if (t===null) return false; return P.typing ? (nrm(t)===nrm(x.ans) || qtyMatch(t,x)) : norm(t)===x.ans; }

function cell(x, extra=""){
  if (!x) return "";
  if (x.fixed){
    if (x.kind==="enz") return `<span class="enz">${esc(x.ans)}</span>`;
    if (x.kind==="cof"||x.kind==="loc"||x.kind==="voie") return `<span class="tag ${x.kind}">${esc(x.ans)}</span>`;
    if (x.kind==="mol") return `<span class="mol fx">${esc(x.ans)}</span>`;
    return esc(norm(x.ans));
  }
  const txt = slotText(x);
  const filled = txt!==null;
  let cls = "slot "+x.kind+" "+extra;
  let inner;
  if (P.checked){
    const ok = isRight(x);
    cls += ok ? " ok" : " bad";
    inner = ok ? esc(txt)
      : (filled ? `<span class="was">${esc(txt)}</span>` : `<span class="ph">vide</span>`) + `<span class="fix">${esc(x.ans)}</span>`;
  } else {
    if (filled) cls += " filled";
    if ((P.typing ? P.cur : P.selSlot)===x.id) cls += " want";
    inner = filled ? esc(txt) : `<span class="ph">${PH[x.kind]}</span>`;
  }
  return `<button class="${cls}" data-s="${x.id}" ${P.checked?"disabled":""} aria-label="${filled?esc(txt):"Case vide : "+PH[x.kind]}">${inner}</button>`;
}

function renderBoard(){
  const L = P.level, W = WORLDS[L.w];
  let h = "";
  P.parts.forEach(p => {
    if (p.type==="chain"){
      h += `<div class="chain">${p.label?`<div class="clabel">${esc(p.label)}</div>`:""}<span class="mol fx">${esc(p.start)}</span>`;
      p.steps.forEach(st => {
        const tags = [cell(st.e), cell(st.c), cell(st.l)].filter(Boolean).join("");
        h += `<div class="step"><div class="rail"></div><div class="tags">${tags}</div></div>${cell(st.m)}`;
      });
      h += `</div>`;
    } else if (p.type==="map"){
      h += renderMap(p);
    } else {
      h += `<div class="gridwrap"><table><thead><tr>${p.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
      p.rows.forEach(r => { h += `<tr>${r.map(c=>`<td>${cell(c)}</td>`).join("")}</tr>`; });
      h += `</tbody></table></div>`;
    }
  });
  document.getElementById("board").innerHTML = h;
}

const hubColor = h => `--h:${WORLDS[h.w].c};--hsoft:${WORLDS[h.w].s}`;
const hubLink = (id,t) => `<button class="hublink" data-hub="${id}">${esc(t)} ↗</button>`;
function renderMap(p){
  const pos = {}; p.hubs.forEach(h=>pos[h.id]=h);
  const seen = new Set(); let paths = "";
  p.edges.forEach(ed => {
    if (!p.hubIds.has(ed.from) || !p.hubIds.has(ed.to)) return;
    const k = [ed.from,ed.to].sort().join("-"); if (seen.has(k)) return; seen.add(k);
    const a = pos[ed.from], b = pos[ed.to];
    const bend = (ed.from==="oaa" && ed.to==="tri") ? ` Q 4 32 ${b.x} ${b.y}` : ` L ${b.x} ${b.y}`;
    paths += `<path d="M ${a.x} ${a.y}${bend}"/>`;
  });
  let h = `<div class="overview" aria-label="Carte des carrefours"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${paths}</svg>
    ${p.hubs.map(hb=>`<button class="onode" data-hub="${hb.id}" style="left:${hb.x}%;top:${hb.y}%;${hubColor(hb)}">${esc(hb.t)}</button>`).join("")}
    </div><p class="ocap">Touche un carrefour pour sauter à sa fiche.</p><div class="hubs">`;
  p.hubs.forEach(hb => {
    h += `<section class="hub" id="hub-${hb.id}" style="${hubColor(hb)}"><h3 class="hubname">${esc(hb.t)}</h3><p class="hubsub">${esc(hb.s)}</p>`;
    p.rows[hb.id].forEach(r => {
      if (r.dir==="from"){ h += `<div class="route from"><span class="dir">← arrive de</span>${hubLink(r.hub,r.t)}</div>`; return; }
      const lead = r.dir==="out" ? "→ part vers" : r.dir==="in" ? "← arrive de" : "⇄ échange avec";
      const partner = r.p.hub ? hubLink(r.p.hub, r.p.t) : cell(r.p);
      h += `<div class="route"><span class="dir go">${lead}</span>${partner}<span class="dir">par</span>${cell(r.e)}${cell(r.v)}</div>`;
    });
    h += `</section>`;
  });
  return h + `</div>`;
}

function domOrder(){
  const d = [...document.querySelectorAll("#board [data-s]")].map(b=>+b.dataset.s);
  return d.length ? d : P.slots.map(s=>s.id);
}
function nextEmpty(from){
  const ids = domOrder(), i = from==null ? -1 : ids.indexOf(from);
  const after = ids.slice(i+1).concat(ids.slice(0, i+1));
  const id = after.find(k => !P.slots[k].txt);
  return id===undefined ? null : id;
}
function sugHTML(){
  const q = nrm((document.getElementById("ans")||{}).value||"");
  if (!P.sugs.length) return q ? `<span class="hint">Aucun terme du jeu ne ressemble à ça. Tu peux quand même valider ta réponse.</span>` : `<span class="hint">Commence à écrire : les suggestions viennent de tous les termes du jeu, pièges compris.</span>`;
  return P.sugs.map((t,i)=>`<button class="sug" data-sug="${i}" aria-selected="${i===P.sugIdx}">${esc(t)}</button>`).join("");
}
function renderTyper(){
  const tray = document.getElementById("trayin");
  const left = P.slots.filter(s=>!s.txt).length;
  const x = P.cur!==null ? P.slots[P.cur] : null;
  P.sugs = []; P.sugIdx = -1;
  tray.innerHTML = `<div class="typer">
    ${x ? `<p class="typectx">Case : <b>${PH[x.kind]}</b>${x.ctx?" · "+esc(x.ctx):""}</p>
    <div class="sugs" id="sugs">${sugHTML()}</div>
    <div class="typerow"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écris ta réponse" aria-label="Réponse pour la case sélectionnée" value="${esc(x.txt||"")}"><button id="commit">OK</button></div>`
    : `<p class="typectx">Toutes les cases sont remplies. Touche une case pour la modifier, ou vérifie.</p>`}
    <div class="trayfoot"><span class="hint">${left ? left+" case"+(left>1?"s":"")+" vide"+(left>1?"s":"") : "Tout est rempli."}</span>
    <button class="cta" id="check">Vérifier</button></div></div>`;
  if (x && x.txt) refreshSugs();
}
function refreshSugs(){
  const inp = document.getElementById("ans"); if (!inp) return;
  P.sugs = suggest(inp.value); P.sugIdx = -1;
  const box = document.getElementById("sugs"); if (box) box.innerHTML = sugHTML();
}
function commit(text){
  if (P.cur===null) return;
  const t = String(text||"").trim();
  P.slots[P.cur].txt = t || null;
  const was = P.cur;
  P.cur = t ? nextEmpty(was) : was;
  renderBoard(); renderTyper();
  const inp = document.getElementById("ans"); if (inp) inp.focus({preventScroll:true});
  const el = P.cur!==null && document.querySelector(`#board [data-s="${P.cur}"]`);
  if (el && el.scrollIntoView) el.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}

function renderTray(){
  const tray = document.getElementById("trayin");
  if (P.checked){ tray.parentElement.hidden = true; return; }
  if (P.typing) return renderTyper();
  const left = P.slots.filter(s=>s.val===null).length;
  tray.innerHTML = `<div class="eyebrow">Pièces · touche une pièce puis une case</div>
  <div class="chips">${P.chips.filter(c=>!c.used).map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${P.selChip===c.id}">${esc(c.t)}</button>`).join("")}</div>
  <div class="trayfoot"><span class="hint">${left ? left+" case"+(left>1?"s":"")+" vide"+(left>1?"s":"") : "Tout est placé."}</span>
  <button class="cta" id="check">Vérifier</button></div>`;
}

function renderPlay(){
  const L = P.level, W = WORLDS[L.w];
  const idx = LEVELS.indexOf(L);
  app.innerHTML = `<div style="--w:${W.c};--wsoft:${W.s}">
  <div class="playbar"><div class="in">
    <button class="back" id="home">← Niveaux</button>
    <h1>${esc(L.t)}</h1>
    <span class="badge">${MODES[P.mode].n} ×${MODES[P.mode].x}</span>${P.typing?`<span class="badge">Clavier ×1,5</span>`:""}
    ${P.mode==="m"?`<span class="timer" id="timer">0:00</span>`:""}
  </div></div>
  <main class="play">
    <p class="intro"><span class="eyebrow">${esc(W.name)} · niveau ${idx+1}</span><br>${esc(L.s)}</p>
    <div id="board" style="display:grid;gap:26px"></div>
    <section id="result" hidden></section>
  </main>
  <div class="tray"><div class="in" id="trayin"></div></div>
  </div>`;
  renderBoard();
  if (P.typing){ P.cur = nextEmpty(null); renderBoard(); }
  renderTray();
  clearInterval(timerId);
  if (P.mode==="m"){
    timerId = setInterval(()=>{
      if (P.checked) return;
      P.secs = Math.floor((Date.now()-P.t0)/1000);
      const el = document.getElementById("timer");
      if (el) el.textContent = Math.floor(P.secs/60)+":"+String(P.secs%60).padStart(2,"0");
    }, 500);
  }
  window.scrollTo(0,0);
}

function place(chipId, slotId){
  const s = P.slots[slotId];
  if (s.val!==null) P.chips[s.val].used = false;
  s.val = chipId; P.chips[chipId].used = true;
  P.selChip = null; P.selSlot = null;
}

function onPlayClick(e){
  const b = e.target.closest("button"); if (!b) return;
  if (b.id==="home"){ goHome(); return; }
  if (b.id==="check"){ check(); return; }
  if (b.dataset.act){ return resultAct(b.dataset.act); }
  if (b.dataset.hub){ const t=document.getElementById("hub-"+b.dataset.hub); if (t) t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}); return; }
  if (P.checked) return;
  if (P.typing){
    if (b.id==="commit"){ const inp=document.getElementById("ans"); commit(P.sugIdx>=0 ? P.sugs[P.sugIdx] : inp.value); return; }
    if (b.dataset.sug!==undefined){ commit(P.sugs[+b.dataset.sug]); return; }
    if (b.dataset.s!==undefined){
      P.cur = +b.dataset.s; renderBoard(); renderTyper();
      const inp=document.getElementById("ans"); if (inp){ inp.focus({preventScroll:true}); inp.select(); }
    }
    return;
  }
  if (b.dataset.c!==undefined){
    const c = +b.dataset.c;
    if (P.selSlot!==null){ place(c, P.selSlot); }
    else P.selChip = P.selChip===c ? null : c;
  } else if (b.dataset.s!==undefined){
    const s = P.slots[+b.dataset.s];
    if (P.selChip!==null){ place(P.selChip, s.id); }
    else if (s.val!==null){ P.chips[s.val].used=false; s.val=null; P.selSlot=null; }
    else P.selSlot = P.selSlot===s.id ? null : s.id;
  } else return;
  renderBoard(); renderTray();
}

function check(){
  P.checked = true;
  P.secs = Math.floor((Date.now()-P.t0)/1000);
  clearInterval(timerId);
  const n = P.slots.length;
  const wrong = P.slots.filter(s => !isRight(s));
  const good = n - wrong.length;
  const base = Math.round(100*good/n);
  const perfect = wrong.length===0;
  const timeBonus = P.mode==="m" && base>=50 ? Math.max(0, 30-Math.floor(P.secs/10)) : 0;
  const bossX = P.level.boss ? 2 : 1;
  const typeX = P.typing ? 1.5 : 1;
  const pts = Math.round((base + (perfect?20:0) + timeBonus) * MODES[P.mode].x * bossX * typeX);
  const id = P.level.id;
  const prev = (S.best[id]||{})[P.mode]||0;
  const record = pts > prev;
  if (record){ S.best[id] = Object.assign({}, S.best[id], {[P.mode]:pts}); LSset("best", S.best); saveRemote(); }

  const whys = []; const seen = new Set();
  wrong.forEach(s => { if (s.why && !seen.has(s.why)){ seen.add(s.why); whys.push(`<li><b>${esc(s.ctx)}</b> : ${esc(s.why)}</li>`); } });
  const idx = LEVELS.indexOf(P.level);
  let next = LEVELS[idx+1];
  if (next && next.boss && !bossUnlocked()) next = null;
  const r = document.getElementById("result");
  r.className = "result";
  r.innerHTML = `<div class="eyebrow">${good} / ${n} cases justes${P.mode==="m"?" · "+Math.floor(P.secs/60)+" min "+String(P.secs%60).padStart(2,"0")+" s":""}</div>
   <div class="score mono">${pts} pts</div>
   <p class="hint">${base} de base${perfect?" + 20 sans faute":""}${timeBonus?" + "+timeBonus+" de temps":""}, ×${MODES[P.mode].x} en ${MODES[P.mode].n}${bossX>1?", ×2 pour le boss":""}${P.typing?", ×1,5 au clavier":""}. ${record?"Nouveau record sur ce niveau.":"Ton record ici : "+prev+" pts."}</p>
   ${whys.length?`<div><div class="eyebrow">À retenir</div><ul>${whys.join("")}</ul></div>`:""}
   <p class="tip">${esc(P.level.tip)}</p>
   <div class="acts"><button class="cta" data-act="again">Rejouer</button>${next?`<button class="cta alt" data-act="next">Niveau suivant</button>`:""}<button class="cta alt" data-act="home">Tous les niveaux</button></div>`;
  r.hidden = false;
  renderBoard(); renderTray();
  r.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
}

function resultAct(a){
  const idx = LEVELS.indexOf(P.level);
  if (a==="again") startLevel(P.level.id);
  else if (a==="next") startLevel(LEVELS[idx+1].id);
  else goHome();
}

const MAIN_WORLDS = ["glu","lip","nrj","azo","heme","lp"];
function worldsStarted(){ return MAIN_WORLDS.filter(w => LEVELS.some(l=>l.w===w && levelBest(l.id)>0)).length; }
function bossUnlocked(){ return worldsStarted() >= MAIN_WORLDS.length; }
function startLevel(id){
  const L = LEVELS.find(l=>l.id===id);
  if (!L || (L.boss && !bossUnlocked())) return;
  S.screen = "play";
  P = build(L, S.mode);
  renderPlay();
}

/* ---------- accueil ---------- */

  let worlds = "";

  for (const wk in WORLDS){

      <div class="levels">${lv.map(l => { n++; const b=S.best[l.id]||{};
        return `<button class="lvl" data-l="${l.id}"><span class="num">N° ${String(n).padStart(2,"0")}</span><h3>${esc(l.t)}</h3><p class="sub">${esc(l.s)}</p>
        <div class="pills">${["a","i","m"].map(m=>`<span class="pill ${b[m]?"done":""}">${MODES[m].n.slice(0,3)} ${b[m]?b[m]:"—"}</span>`).join("")}</div></button>`; }).join("")}</div>
    </section>`;
  }
  app.innerHTML = `<div class="wrap">

   </header>
   <div class="home">
    <div style="display:grid;gap:28px;min-width:0">
     <section class="setup">
       <label for="pseudo">Ton pseudo pour le classement
         <input id="pseudo" maxlength="20" autocomplete="nickname" placeholder="ex. Enzyme_Malique" value="${esc(S.pseudo)}">
       </label>
       <p class="hint">2 à 20 caractères. Il s'affiche à côté de ton score.</p>
       <div class="eyebrow">Difficulté</div>
       <div class="modes">${Object.entries(MODES).map(([k,m])=>`<button class="mode" data-m="${k}" aria-pressed="${S.mode===k}"><b>${m.n} ×${m.x}</b><span>${m.d}</span></button>`).join("")}</div>
       <div class="eyebrow">Saisie</div>
       <div class="modes">
         <button class="mode" data-in="pieces" aria-pressed="${S.input==="pieces"}"><b>Pièces</b><span>Tu choisis parmi les pièces du niveau.</span></button>
         <button class="mode" data-in="clavier" aria-pressed="${S.input==="clavier"}"><b>Clavier ×1,5</b><span>Tu écris la réponse. Les suggestions viennent de tous les termes du jeu, pièges compris.</span></button>
       </div>
     </section>
     ${worlds}
     ${bossSection()}
    </div>

function bossSection(){
  const B = LEVELS.find(l=>l.boss), st = worldsStarted(), b = S.best[B.id]||{};
  const body = bossUnlocked()
    ? `<button class="lvl bosscard" data-l="${B.id}"><span class="num">Boss · points ×2</span><h3>${esc(B.t)}</h3><p class="sub">${esc(B.s)} : 7 carrefours, toutes leurs entrées et toutes leurs sorties.</p>

    : `<div class="lockcard"><b>${esc(B.t)}</b><span>Joue au moins un niveau dans chacun des 6 mondes pour le débloquer.</span></div>`;
  return `<section class="world bossworld"><div class="world-head"><h2>Boss final</h2><span class="eyebrow">${bossUnlocked()?"débloqué":"verrouillé · "+st+" / 6 mondes entamés"}</span></div><div class="levels">${body}</div></section>`;
}

function renderLB(){
  const box = document.getElementById("lbbox"); if (!box) return;
  let body = "";
  if (S.lbState==="loading") body = `<p class="note">Chargement du classement…</p>`;
  else if (S.lbState==="off") body = `<p class="note">Classement indisponible ici. Ouvre le jeu depuis claude.ai en étant connecté pour voir celui de la promo. Tes scores restent enregistrés sur cet appareil.</p>`;
  else if (!S.lb || !S.lb.length) body = `<p class="note">Personne n'a encore de score. Choisis un pseudo et termine un niveau pour ouvrir le classement.</p>`;
  else body = `<ol class="lb">${S.lb.map((r,i)=>`<li class="${r.id===S.uid?"me":""}"><span class="rk">${i+1}</span><span class="who" data-who="${i}"></span><span class="pts">${r.total}</span></li>`).join("")}</ol>`;
  box.innerHTML = `<h2>Classement</h2><span class="eyebrow">points cumulés · meilleur score par niveau</span>${body}
   ${S.readOnly?`<p class="note warn">Tu peux voir le classement mais pas y publier ton score avec ton niveau d'accès actuel. Tes points restent sur cet appareil.</p>`:""}
   ${!S.pseudo && S.lbState==="on"?`<p class="note">Ajoute un pseudo pour apparaître dans le classement.</p>`:""}
   <div class="mytotal"><span>Ton total</span><span class="big mono">${total()}</span></div>
   <p class="note">${doneCount()} niveau${doneCount()>1?"x":""} joué${doneCount()>1?"s":""} sur ${LEVELS.length}. Maximum en Major sans faute : 450 pts par niveau, 900 pour le boss, et ×1,5 au clavier.</p>`;
  if (S.lb) box.querySelectorAll("[data-who]").forEach(el => { el.textContent = S.lb[+el.dataset.who].pseudo || "Anonyme"; });
}

function goHome(){ S.screen="home"; P=null; renderHome(); }

app.addEventListener("click", e => {
  if (S.screen==="play") return onPlayClick(e);
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.l) startLevel(b.dataset.l);
  else if (b.dataset.m){ S.mode=b.dataset.m; LSset("mode",S.mode); document.querySelectorAll(".mode[data-m]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.m===S.mode)); }
  else if (b.dataset.in){ S.input=b.dataset.in; LSset("input",S.input); document.querySelectorAll(".mode[data-in]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.in===S.input)); }
});
app.addEventListener("input", e => { if (e.target.id==="ans" && P && P.typing) refreshSugs(); });
app.addEventListener("keydown", e => {
  if (e.target.id!=="ans" || !P || !P.typing) return;
  const box = document.getElementById("sugs");
  if (e.key==="ArrowDown" || e.key==="ArrowUp"){
    if (!P.sugs.length) return; e.preventDefault();
    const n = P.sugs.length;
    P.sugIdx = e.key==="ArrowDown" ? (P.sugIdx+1)%n : (P.sugIdx<=0 ? n-1 : P.sugIdx-1);
    if (box) box.innerHTML = sugHTML();
  } else if (e.key==="Enter"){
    e.preventDefault(); commit(P.sugIdx>=0 ? P.sugs[P.sugIdx] : e.target.value);
  } else if (e.key==="Escape"){ e.target.value=""; refreshSugs(); }
});
let pseudoTimer=null;
app.addEventListener("input", e => {
  if (e.target.id!=="pseudo") return;
  const v = e.target.value.trim();
  clearTimeout(pseudoTimer);
  pseudoTimer = setTimeout(()=>{
    if (v.length>=2 && v.length<=20 && v!==S.pseudo){ S.pseudo=v; LSset("pseudo",v); if (total()>0) saveRemote(); renderLB(); }
  }, 800);
});

/* ============ CLASSEMENT PARTAGÉ (db) ============ */
let saving = Promise.resolve();
function saveRemote(){
  if (!db || !S.uid || !S.pseudo || S.readOnly) return;
  const body = {pseudo:S.pseudo, total:total(), levels:doneCount(), best:S.best, updatedAt:Date.now()};
  saving = saving.then(()=>db.doc("scores/"+S.uid).set(body)).catch(err => {
    if (err && err.code==="invalid_argument"){ S.readOnly = true; if (S.screen==="home") renderLB(); }
  });
}

(async () => {
  try {
    if (!window.claude || !window.claude.use){ S.lbState="off"; if (S.screen==="home") renderLB(); return; }
    const [u, d] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (!d){ S.lbState="off"; if (S.screen==="home") renderLB(); return; }
    db = d;
    S.uid = u ? await u.id() : null;
    if (u){ const can = await u.can("data.write"); if (can===false) S.readOnly = true; }
    if (!S.uid) S.readOnly = true;
    if (S.uid){
      try {
        const mine = await db.doc("scores/"+S.uid).get();
        if (mine.exists){
          const m = mine.data();
          if (!S.pseudo && m.pseudo){ S.pseudo = m.pseudo; LSset("pseudo", S.pseudo); const inp=document.getElementById("pseudo"); if (inp) inp.value=S.pseudo; }
          const rb = m.best || {};
          for (const id in rb) for (const k in rb[id]) {
            const cur = (S.best[id]||{})[k]||0;
            if (rb[id][k] > cur) S.best[id] = Object.assign({}, S.best[id], {[k]: rb[id][k]});
          }
          LSset("best", S.best);
          if (S.screen==="home") renderHome();
        }
      } catch(e){}
    }
    db.collection("scores").orderBy("total","desc").limit(30).onSnapshot(snap => {
      S.lb = snap.docs.map(x => ({id:x.id, pseudo:String(x.data().pseudo||"").slice(0,20), total:Math.round(+x.data().total||0)}));
      S.lbState = "on";
      if (S.screen==="home") renderLB();
    }, () => { S.lbState="off"; if (S.screen==="home") renderLB(); });
  } catch(e){ S.lbState="off"; if (S.screen==="home") renderLB(); }
})();

renderHome();
</script>
