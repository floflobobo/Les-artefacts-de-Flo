<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Paillasse Orga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : étagère de réactifs à gauche, paillasse (ballon + conditions) puis paillasse de résultats à droite. Papier quadrillé de cahier de labo. */
:root{
  --paper:#edf1ec; --grid:#dbe3dc; --card:#f9fbf8; --ink:#14221f; --muted:#5a6a65; --line:#c7d2cb;
  --accent:#1c4fd0; --accent-ink:#fff; --arrow:#d23a2a;
  --sn1:#c8661a; --sn2:#1c4fd0; --e1:#b02f78; --e2:#2a8740; --ae:#6d4fc9; --ox:#8a6a12;
  --x:#b5481c; --nu:#1c4fd0; --h:#2a8740;
  --glass:#bccbc4; --liquid:#9fc4e8; --ok:#2a8740; --warn:#b5481c;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f1716; --grid:#18232120; --card:#152220; --ink:#e4ede9; --muted:#93a59f; --line:#2b3c38;
  --accent:#7aa2ff; --accent-ink:#0b1430; --arrow:#ff7462;
  --sn1:#f0974f; --sn2:#7aa2ff; --e1:#ee7bb8; --e2:#6fd08a; --ae:#a993f5; --ox:#e0bf5c;
  --x:#f0874f; --nu:#7aa2ff; --h:#6fd08a; --glass:#4c5f59; --liquid:#3d6c9a; --ok:#6fd08a; --warn:#f0874f;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1716; --grid:#18232120; --card:#152220; --ink:#e4ede9; --muted:#93a59f; --line:#2b3c38;
  --accent:#7aa2ff; --accent-ink:#0b1430; --arrow:#ff7462;
  --sn1:#f0974f; --sn2:#7aa2ff; --e1:#ee7bb8; --e2:#6fd08a; --ae:#a993f5; --ox:#e0bf5c;
  --x:#f0874f; --nu:#7aa2ff; --h:#6fd08a; --glass:#4c5f59; --liquid:#3d6c9a; --ok:#6fd08a; --warn:#f0874f;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px; color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:18px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1;margin:0;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.modes{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
.modes button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(260px,310px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.app{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Étagère */
.shelf{padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:max(12px, env(safe-area-inset-top, 0px))}
@media (max-width:880px){.shelf{position:static}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabs button{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 4px;border-radius:7px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shelf-list{display:flex;flex-direction:column;gap:6px;max-height:min(68vh,640px);overflow:auto;padding-right:2px}
@media (max-width:880px){.shelf-list{max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.group-h{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0;grid-column:1/-1}
.chip{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:grab;user-select:none;touch-action:none;text-align:left;font:inherit;color:inherit;width:100%}
.chip:hover{border-color:var(--ink)}
.chip.in{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.chip .fx{font-family:var(--f-mono);font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.chip .nm{grid-column:1/2;font-size:12px;color:var(--muted)}
.chip .tg{grid-row:1/3;grid-column:2;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);background:var(--card);border:1px solid var(--ink);border-radius:8px;padding:6px 10px;font-family:var(--f-mono);font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18)}

/* Paillasse */
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.goal{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-style:dashed;border-width:2px}
.goal b{font-family:var(--f-display);font-size:18px}
.goal .gtxt{min-width:0;flex:1 1 280px}
.goal .gtxt p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.goal-nav{display:flex;gap:6px;align-items:center}
.bench{padding:14px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:620px){.bench{grid-template-columns:minmax(0,1fr)}}
.flask-zone{position:relative;border-radius:12px;transition:background .2s}
.flask-zone.hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.flask-zone svg{display:block;width:100%;max-width:230px;margin:0 auto;height:auto}
.drop-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
.slots{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{display:grid;grid-template-columns:86px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border:1.5px dashed var(--line);border-radius:9px;min-height:50px}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--paper)}
.slot.hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.slot .sv{min-width:0}
.slot .sv .fx{font-family:var(--f-mono);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.slot .sv .nm{font-size:12.5px;color:var(--muted)}
.slot .empty{font-size:13px;color:var(--muted)}
.slot .x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px}
.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.temps button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 4px;border-radius:8px;cursor:pointer;line-height:1.2}
.temps button small{display:block;color:var(--muted);font-size:11px}
.temps button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.temps button[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 16px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1 1 auto;font-family:var(--f-display);font-size:17px;letter-spacing:.01em}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Résultat */
.result{padding:16px;display:flex;flex-direction:column;gap:16px}
.verdict{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mbadge{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;padding:10px 14px;border-radius:10px;color:#fff;background:var(--mc,var(--ink));min-width:84px;text-align:center}
:root[data-theme="dark"] .mbadge{color:#0f1716}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mbadge{color:#0f1716}}
.verdict h2{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.15;text-wrap:balance}
.verdict .eq{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:38px minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:13px}
.bar b{font-family:var(--f-mono)}
.track{height:12px;border-radius:6px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.factors{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.factors li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.factors li:first-child{border-top:0}
.factors .k{font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;color:#fff;margin-left:4px;vertical-align:1px}
:root[data-theme="dark"] .pill{color:#0f1716}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#0f1716}}
.products{display:flex;flex-direction:column;gap:8px}
.prod{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:10px;border-radius:9px;background:var(--paper);border:1px solid var(--line)}
.prod .role{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid var(--ink);margin-top:2px}
.prod.mino .role{border-color:var(--line);color:var(--muted)}
.prod .fx{font-family:var(--f-mono);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.prod .nm{font-size:13.5px}
.prod .st{grid-column:2;font-size:12.5px;color:var(--muted)}
.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.nothing{display:flex;flex-direction:column;gap:6px}
.nothing h2{margin:0;font-family:var(--f-display);font-size:22px}
.nothing p{margin:0;max-width:65ch}

/* Mécanisme */
.mech{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mech-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stage{background:var(--paper);overflow-x:auto}
.stage svg{display:block;width:100%;min-width:520px;height:auto}
.mech-foot{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.caption{flex:1 1 260px;min-width:0;font-size:14.5px}
.caption b{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:6px}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
svg .atom{font-family:var(--f-mono);font-weight:600;font-size:17px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round}
svg .atom.x{fill:var(--x)} svg .atom.nu{fill:var(--nu)} svg .atom.h{fill:var(--h)} svg .atom.g{font-weight:400;font-size:15px}
svg .chg{font-family:var(--f-mono);font-weight:700;font-size:15px;fill:var(--arrow)}
svg .bond{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;fill:none}
svg .wedge{fill:var(--ink)}
svg .arw{stroke:var(--arrow);stroke-width:2.2;fill:none}
svg .arwg{animation:arwIn .5s ease-out both}
svg .arwg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes arwIn{from{opacity:0}to{opacity:1}}
svg .extra{font-family:var(--f-display);font-weight:600;fill:var(--muted)}
svg .ah{fill:var(--arrow)}

/* Défis & carnet */
.side2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.side2{grid-template-columns:minmax(0,1fr)}}
.list{padding:14px;display:flex;flex-direction:column;gap:8px}
.list h3{margin:0;font-family:var(--f-display);font-size:18px}
.dlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.dlist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.dlist li:hover{border-color:var(--line)}
.dlist li.cur{border-color:var(--ink)}
.dlist .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;margin-top:2px}
.dlist .ck.done{background:var(--ok);border-color:var(--ok);color:#fff}
.log{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;max-height:300px;overflow:auto}
.log li{font-size:13px;padding:6px 8px;border-left:3px solid var(--mc,var(--line));background:var(--paper);border-radius:0 6px 6px 0}
.log li .fx{font-family:var(--f-mono);font-size:12.5px}
.log .empty{color:var(--muted);border:0;background:transparent;padding:0}
.toast{position:fixed;left:50%;bottom:max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px));transform:translate(-50%,20px);opacity:0;background:var(--ok);color:#fff;font-weight:700;padding:10px 18px;border-radius:10px;transition:.35s;z-index:60;max-width:calc(100% - 32px);text-align:center}
:root[data-theme="dark"] .toast{color:#0f1716}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{color:#0f1716}}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes swirl{0%{transform:rotate(0)}50%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.swirl{animation:swirl .5s ease-in-out 2;transform-origin:115px 200px}
@keyframes bub{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-60px);opacity:0}}
.bubble{animation:bub 1.4s ease-in infinite}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Paillasse <span>Orga</span></h1>
      <p>UE 3.2 · DFGSP2 · simulateur de mécanismes</p>
    </div>
    <div class="modes" role="group" aria-label="Mode de jeu">
      <button id="mLabo" aria-pressed="true">Labo libre</button>
      <button id="mDefis" aria-pressed="false">Défis <span id="defiCount"></span></button>
    </div>
  </header>

  <div class="app">
    <aside class="panel shelf" aria-label="Étagère">
      <div class="label">Étagère · glisse vers le ballon ou touche pour ajouter</div>
      <div class="tabs" role="group">
        <button data-tab="sub" aria-pressed="true">Substrats</button>
        <button data-tab="rea" aria-pressed="false">Réactifs</button>
        <button data-tab="sol" aria-pressed="false">Solvants</button>
      </div>
      <div class="shelf-list" id="shelf"></div>
    </aside>

    <main class="main">
      <section class="panel goal" id="goal" hidden></section>

      <section class="panel bench" aria-label="Paillasse">
        <div class="flask-zone" id="flaskZone">
          <svg viewBox="0 0 230 270" id="flask" aria-hidden="true"></svg>
          <div class="drop-hint">dépose ici</div>
        </div>
        <div class="slots">
          <div class="slot" data-slot="sub"><span class="label">Substrat</span><div class="sv"></div><button class="x" title="Retirer" aria-label="Retirer le substrat">×</button></div>
          <div class="slot" data-slot="rea"><span class="label">Réactif</span><div class="sv"></div><button class="x" title="Retirer" aria-label="Retirer le réactif">×</button></div>
          <div class="slot" data-slot="sol"><span class="label">Solvant</span><div class="sv"></div><button class="x" title="Retirer" aria-label="Retirer le solvant">×</button></div>
          <div class="temps" role="group" aria-label="Température">
            <button data-t="froid">❄ Bain de glace<small>0 °C · à froid</small></button>
            <button data-t="amb">Ambiante<small>25 °C</small></button>
            <button data-t="chaud">Chauffage<small>reflux · Δ</small></button>
          </div>
          <div class="actions">
            <button class="btn primary" id="run">Lancer la réaction</button>
            <button class="btn" id="clear">Vider</button>
          </div>
        </div>
      </section>

      <section class="panel result" id="result" aria-live="polite"></section>

      <div class="side2">
        <section class="panel list">
          <h3>Défis</h3>
          <ul class="dlist" id="dlist"></ul>
        </section>
        <section class="panel list">
          <h3>Carnet de labo</h3>
          <ul class="log" id="log"></ul>
        </section>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= DONNÉES (tirées du poly UE 3.2) ================= */
const SUBSTRATES = [
  {id:'mebr', fam:'halo', n:'bromométhane', f:'CH₃–Br', X:'Br', cls:'méthyle', cplus:'instable', enc:0, betaH:false, chiral:false, g:['H','H','H'],
   sub:{OH:['CH₃–OH','méthanol'], CN:['CH₃–C≡N','éthanenitrile'], OtBu:['CH₃–O–C(CH₃)₃','2-méthoxy-2-méthylpropane']}},
  {id:'bub', fam:'halo', n:'1-bromobutane', f:'CH₃(CH₂)₃–Br', X:'Br', cls:'primaire', cplus:'instable', enc:1, betaH:true, chiral:false, g:['H','H','C₃H₇'],
   sub:{OH:['CH₃(CH₂)₃–OH','butan-1-ol'], CN:['CH₃(CH₂)₃–C≡N','pentanenitrile'], OtBu:['CH₃(CH₂)₃–O–C(CH₃)₃','1-tert-butoxybutane']},
   elim:{alpha:['H','H'], beta:['C₂H₅','H'], prods:[{f:'CH₂=CH–CH₂–CH₃', n:'but-1-ène', r:'unique', st:'Un seul H en β possible côté chaîne : pas de régio à discuter'}]}},
  {id:'2bub', fam:'halo', n:'(R)-2-bromobutane', f:'CH₃–CHBr–CH₂–CH₃', X:'Br', cls:'secondaire', cplus:'moyen', enc:2, betaH:true, chiral:true, g:['H','CH₃','C₂H₅'],

/* ================= MOTEUR : dérivés halogénés ================= */
const NEG = -99;
function scoreHalo(s, r, sol, T){
  const sc = {SN1:0, SN2:0, E1:0, E2:0}; const F = [];
  // Substrat
  if(s.cplus==='stable'){ sc.SN1+=3; sc.E1+=3; }
  if(s.cplus==='instable'){ sc.SN1=NEG; sc.E1=NEG; }
  if(s.enc===0) sc.SN2+=3; else if(s.enc===1){ sc.SN2+=2; sc.E2+=1; } else if(s.enc===2){ sc.E2+=.5; } else { sc.SN2=NEG; }
  if(!s.betaH){ sc.E1=NEG; sc.E2=NEG; }
  let sTxt = `${s.cls[0].toUpperCase()+s.cls.slice(1)} : carbocation ${s.cplus==='stable'?(s.cls.includes('benzyl')?'stabilisé par mésomérie':'tertiaire, stable'):s.cplus==='moyen'?'secondaire, moyennement stable':'trop instable'}.`;
  let sFav = s.cplus==='stable' ? ['SN1','E1'] : s.cplus==='instable' ? ['SN2','E2'] : [];
  if(s.enc===3) sTxt += ' C trop encombré : SN2 impossible.';
  if(s.cplus==='moyen') sTxt += ' Cas ambigu : c’est le solvant qui tranche.';
  if(!s.betaH) sTxt += ' Aucun H en β : élimination impossible.';
  F.push({k:'Substrat', t:sTxt, fav:sFav});
  // Réactif
  const k = r.kind;
  if(k==='nuc'){ sc.SN2+=2; sc.E2-=.5; sc.E1-=1; F.push({k:'Réactif', t:`${r.f} : nucléophile chargé, peu encombré, dilué.`, fav:['SN2']}); }
  if(k==='base'){ sc.E2+=2.5; sc.E1+=1.5; sc.SN2+=.5; sc.SN1-=1; F.push({k:'Réactif', t:`${r.f} : base forte et concentrée.`, fav:['E1','E2']}); }
  if(k==='bulky'){ sc.E2+=3.5; sc.E1+=1; sc.SN2-=3; sc.SN1-=2; F.push({k:'Réactif', t:'tBuO⁻ : base forte, encombrée donc peu nucléophile.', fav:['E2']}); }
  if(k==='weak'){ sc.SN1+=1; sc.E1+=.5; sc.SN2-=2; sc.E2-=3; F.push({k:'Réactif', t:'H₂O : nucléophile neutre et faible. Il attend qu’un C⁺ se forme.', fav:['SN1']}); }
  // Solvant
  if(!sol){ F.push({k:'Solvant', t:'Pas de solvant choisi.', fav:[]}); }
  else if(sol.type==='protique'){ sc.SN1+=2; sc.E1+=2; sc.SN2-=1; sc.E2-=1; F.push({k:'Solvant', t:`${sol.n} : polaire protique, stabilise le C⁺ et se lie à X⁻ par liaisons H.`, fav:['SN1','E1']}); }
  else if(sol.type==='aprotique'){ sc.SN2+=2; sc.E2+=2; sc.SN1-=2; sc.E1-=2; F.push({k:'Solvant', t:`${sol.n} : polaire aprotique, ne solvate pas le Nu, qui reste réactif.`, fav:['SN2','E2']}); }
  else { sc.SN1-=3; sc.E1-=3; sc.SN2-=1; sc.E2-=1; F.push({k:'Solvant', t:`${sol.n} : apolaire, les ions sont mal stabilisés. Tout est lent.`, fav:[]}); }
  // Température
  if(T==='froid'){ sc.SN1+=1; sc.SN2+=1; sc.E1-=1.5; sc.E2-=1.5; F.push({k:'Température', t:'À froid : les substitutions l’emportent.', fav:['SN1','SN2']}); }
  else if(T==='chaud'){ sc.E1+=2; sc.E2+=2; sc.SN1-=1; sc.SN2-=1; F.push({k:'Température', t:'À chaud : les éliminations l’emportent.', fav:['E1','E2']}); }
  else F.push({k:'Température', t:'Ambiante : ne tranche pas.', fav:[]});
  // Nucléofuge
  F.push({k:'Nucléofuge', t: s.X==='Cl' ? 'Cl⁻ : moins bon groupe partant (I > Br > Cl ≫ F), réaction plus lente.' : 'Br⁻ : bon groupe partant (I > Br > Cl ≫ F).', fav:[]});
  if(s.X==='Cl'){ for(const m in sc) if(sc[m]>NEG) sc[m]-=.5; }
  return {sc, F};
}
function probs(sc){
  const e = {}; let tot=0;
  for(const m in sc){ e[m] = sc[m]<=NEG/2 ? 0 : Math.exp(sc[m]/1.3); tot+=e[m]; }
  for(const m in e) e[m] = tot ? e[m]/tot : 0;
  return e;
}
function subProduct(s, r, mech, role){
  const nu = r.nu; const [f,n] = s.sub[nu];
  let name=n, st='';
  if(s.chiral){
    if(mech==='SN2'){ name = '(S)-'+n; st='Inversion de Walden : le (R) donne le (S), produit optiquement actif'; }
    else { name = n+' racémique'; st='Carbocation plan attaqué des deux faces : 50 % R + 50 % S, optiquement inactif'; }
  } else st = 'Pas de carbone asymétrique : rien à suivre côté stéréo';
  if(r.kind==='weak') st += ' · H₂O s’est fixé puis a perdu un H⁺';
  return {f, n:name, r:role, st};
}
function runHalo(s, r, sol, T){
  if(!['nuc','base','bulky','weak'].includes(r.kind))
    return nothing(`${s.n} + ${r.f} : rien ne se passe`, `Un dérivé halogéné a un carbone δ+ (électrophile). Il réagit avec un nucléophile ou une base. ${r.f} est ${r.kind==='hbr'||r.kind==='br2'||r.kind==='h3o'||r.kind==='h2so4'||r.kind==='hbrp'?'un électrophile / un acide':'un oxydant'} : il n’a rien à attaquer ici.`, 'Essaie NaOH, NaCN, H₂O, KOH ou tBuOK.');
  if(!sol) return nothing('Il manque un solvant', 'Pour un dérivé halogéné, le solvant est souvent ce qui fait basculer entre SN1/E1 (protique) et SN2/E2 (aprotique). Ajoute-en un.', 'Onglet Solvants de l’étagère.');
  const {sc, F} = scoreHalo(s, r, sol, T);
  const p = probs(sc);
  const order = Object.keys(p).sort((a,b)=>p[b]-p[a]);
  const win = order[0];
  const res = {kind:'halo', mech:win, scores:p, factors:F, products:[], notes:[], sub:s, rea:r, sol, T};
  if(p[win]===0) return nothing('Aucun mécanisme possible', 'Toutes les voies sont bloquées avec ces conditions.', '');
  const slow = sc[win] < .8;
  if(win.startsWith('SN')) res.products.push(subProduct(s, r, win, 'majo'));
  else res.products = s.elim.prods.map(x=>({...x, st: x.st + (win==='E1' && s.id==='2bub' && x.r==='majo' ? ' · E1 : mélange Z/E, E majoritaire (plus stable)' : '') + (win==='E2' && s.id==='2bub' && x.r==='majo' ? ' · E2 stéréospécifique : chaque conformation anti donne un seul isomère, le E est majoritaire' : '')}));
  // produit minoritaire de la voie concurrente
  const second = order.find(m => (m.startsWith('SN') !== win.startsWith('SN')) && p[m] >= .16);
  if(second){
    if(second.startsWith('SN')) res.products.push({...subProduct(s, r, second, 'mino'), st:`Voie ${second} concurrente (${Math.round(p[second]*100)} %)`});
    else { const e=s.elim.prods[0]; res.products.push({f:e.f, n:e.n, r:'mino', st:`Voie ${second} concurrente (${Math.round(p[second]*100)} %)`}); }
  }
  if(slow) res.notes.push('Score faible : dans ces conditions la réaction est très lente. Change un paramètre pour l’accélérer.');
  if(win==='SN1' && sol.type==='aprotique') res.notes.push('Le substrat impose la SN1, mais un solvant aprotique ne stabilise pas le C⁺ : c’est lent.');
  if(win==='E2') res.notes.push('Condition indispensable : H et X coplanaires et en anti (trans-élimination).');
  if(win==='E1'||win==='E2') res.notes.push('Régiosélectivité de Zaïtsev : l’alcène le plus substitué est majoritaire.');
  if(win==='SN1'||win==='E1') res.notes.push('Étape lente = départ de X⁻ (cinétiquement déterminante).');
  res.frames = framesHalo(s, r, win);
  return res;
}

               : [mk('CH₃–CH(OH)–CH(OH)–CH₃','(2R,3R) + (2S,3S)-butane-2,3-diol','unique','Alcène E + cis-addition → racémique (thréo)')],
      kmnoc:[mk('2 CH₃–COOH','acide acétique (×2)','unique','Coupure + oxydation complète des aldéhydes')],
      o3:[mk('2 CH₃–CHO','éthanal (×2)','unique','Coupure, aldéhydes protégés par Zn/H⁺')]});
  P.zbut = but(true); P.ebut = but(false);
  let key = k;
  const notes=[];
  if(k==='kmnod' && T==='chaud'){ key='kmnoc'; notes.push('Attention : KMnO₄ à chaud coupe la double liaison. L’hydroxylation se fait dilué ET à froid.'); }
  if(k==='kmnoc' && T==='froid') notes.push('Le poly fait la coupure à chaud (Δ). On l’accepte ici, mais en vrai, chauffe.');
  const prods = P[id][key];
  const mech = {hbr:'AE', h3o:'AE', hbrp:'AR', br2:'AX2', b2h6:'HB', kmnod:'OX', kmnoc:'OX', o3:'OX'}[key];
  if(key==='hbr') notes.push('Règle de Markovnikov : H⁺ se fixe pour former le carbocation le plus stable. Non stéréospécifique.');
  if(key==='hbrp') notes.push('En présence de peroxyde : initiation, propagation, arrêt. Régiosélective mais anti-Markovnikov.');
  if(key==='h3o') notes.push('H₂SO₄ est catalyseur : il protone la C=C, puis H₂O attaque, puis perte de H⁺.');
  if(key==='b2h6') notes.push('Hydratation par hydroboration = alcool le moins substitué ; hydratation acide = alcool le plus substitué.');
  if(key==='br2') notes.push('Le Br⁺ ponte les deux carbones (charge répartie, pas de vrai C⁺). Br⁻ attaque par le côté opposé.');
  if(key==='kmnod') notes.push('KMnO₄ dilué et à froid : α-diol par cis-addition, stéréospécifique.');
  if(key==='kmnoc') notes.push('Oxydation forte : coupure de C=C. Un aldéhyde formé s’oxyde toujours en acide ; un =CH₂ part en CO₂.');
  if(key==='o3') notes.push('Molozonide → ozonide → hydrolyse. Sans Zn, H₂O₂ oxyderait les aldéhydes en acides.');
  if(sol && sol.type==='protique' && key==='br2') notes.push('Dans un solvant nucléophile (eau), le solvant pourrait concurrencer Br⁻. On travaille plutôt dans CCl₄.');
  const MECHK = {kmnod:'Hydroxylation · cis-addition', kmnoc:'Coupure oxydante (oxydation forte)', o3:'Ozonolyse réductrice'};
  const res = R(mech, prods, notes, framesEne(s, key));
  if(MECHK[key]) res.title = MECHK[key];
  return res;
}

/* ================= MOTEUR : alcools ================= */
function runAlc(s, r, sol, T){
  const k=r.kind; const mk=(f,n,role,st)=>({f,n,r:role,st});
  const R=(mech, products, notes, frames, title)=>({kind:'alc', mech, products, notes, frames, title, sub:s, rea:r, sol, T});
  if(['nuc','base','weak'].includes(k)) return nothing(`${s.n} + ${r.f} : pas de substitution`, 'OH⁻ est un très mauvais groupe partant : on ne peut pas le remplacer directement. Il faut d’abord le protoner (H⁺) pour en faire OH₂⁺, qui part sous forme d’eau.', 'Essaie HBr ou H₂SO₄ conc. à chaud.');
  if(k==='bulky') return nothing('Simple réaction acide-base', 'Une base forte arrache le H de O–H : on forme un alcoolate. Pratique pour une synthèse de Williamson ensuite, mais pas de nouveau squelette ici.', '');
  if(['br2','b2h6','kmnod','o3','hbrp','h3o'].includes(k)) return nothing(`${r.f} n’a rien à faire ici`, 'Ces réactifs attaquent une double liaison C=C. Un alcool n’en a pas.', 'Déshydrate d’abord l’alcool (H₂SO₄ conc., Δ), puis travaille sur l’alcène.');
  const c = s.cls;
  if(k==='h2so4'){
    if(T!=='chaud') return nothing('Il faut chauffer', 'La déshydratation des alcools par H₂SO₄ se fait à chaud. À froid, il ne se passe rien d’utile ici.', 'Passe la température sur Chauffage.');
    if(c==='primaire') return R('E2',[mk('CH₂=CH–CH₂–CH₃','but-1-ène','unique','Seul alcène possible')],['OH est protoné en OH₂⁺ (bon groupe partant), puis HSO₄⁻ arrache un H en α dans la même étape.','H₂SO₄ est régénéré : c’est un catalyseur.'], framesHaloLike(c,'E2'), 'Déshydratation · élimination');
    if(c==='secondaire') return R('E1',[mk('CH₃–CH=CH–CH₃','but-2-ène (E majo + Z)','majo','Zaïtsev'),mk('CH₂=CH–CH₂–CH₃','but-1-ène','mino','')],['Protonation de OH, départ de H₂O, C⁺ secondaire, puis perte de H⁺.','Régiosélective selon Zaïtsev.'], framesHaloLike(c,'E1'), 'Déshydratation · élimination');
    return R('E1',[mk('CH₂=C(CH₃)₂','2-méthylpropène','unique','')],['C⁺ tertiaire très stable : E1 rapide.','Les alcools tertiaires se déshydratent le plus facilement.'], framesHaloLike(c,'E1'), 'Déshydratation · élimination');
  }
  if(k==='hbr'){
    if(c==='tertiaire') return R('SN1',[mk('(CH₃)₃C–Br','2-bromo-2-méthylpropane','unique','Pas de C* : rien à suivre')],['H⁺ protone O, H₂O part, C⁺ tertiaire, Br⁻ attaque.'], framesHaloLike(c,'SN1'), 'Formation d’un halogénure d’alkyle');
    if(c==='secondaire') return R('SN1',[mk('CH₃–CHBr–CH₂–CH₃','2-bromobutane racémique','unique','C⁺ plan : 50 % R + 50 % S')],['Après protonation, l’eau part : C⁺ secondaire en milieu acide protique.'], framesHaloLike(c,'SN1'), 'Formation d’un halogénure d’alkyle');
    return R('SN2',[mk('CH₃(CH₂)₃–Br','1-bromobutane','unique','')],['C⁺ primaire trop instable : Br⁻ attaque en même temps que l’eau part.'], framesHaloLike(c,'SN2'), 'Formation d’un halogénure d’alkyle');
  }
  if(k==='k2cr' || k==='kmnoc'){
    if(c==='primaire') return R('OX',[mk('CH₃(CH₂)₂–COOH','acide butanoïque','unique','L’aldéhyde intermédiaire (butanal) s’oxyde aussitôt en acide')],['Oxydation forte d’un alcool primaire : aldéhyde puis acide carboxylique.'], framesOxAlc(c,true), 'Oxydation forte');
    if(c==='secondaire') return R('OX',[mk('CH₃–CO–CH₂–CH₃','butanone','unique','Une cétone ne s’oxyde pas davantage')],['Alcool secondaire → cétone.'], framesOxAlc(c,true), 'Oxydation forte');
    return nothing('Pas d’oxydation sur un alcool tertiaire', 'Le carbone fonctionnel ne porte aucun H à enlever. Le poly signale qu’une déshydratation peut se produire, puis l’alcène formé est coupé.', 'Compare avec le butan-2-ol.');
  }
  if(k==='cu'){
    if(c==='primaire') return R('OX',[mk('CH₃(CH₂)₂–CHO','butanal','unique','Ménagée : l’aldéhyde ne s’oxyde pas en acide')],['Déshydrogénation sur cuivre à 300 °C : on enlève H₂.'], framesOxAlc(c,false), 'Oxydation ménagée');
    if(c==='secondaire') return R('OX',[mk('CH₃–CO–CH₂–CH₃','butanone','unique','')],['Déshydrogénation sur cuivre : alcool secondaire → cétone.'], framesOxAlc(c,false), 'Oxydation ménagée');
    return nothing('Pas de réaction', 'Oxydation ménagée impossible sur un alcool tertiaire : pas de H sur le carbone fonctionnel.', '');
  }
  if(k==='kmnod') return nothing('Rien d’utile', 'KMnO₄ dilué à froid est fait pour hydroxyler un alcène.', '');
  return nothing('Rien ne se passe', '', '');
}
function nothing(title, why, tip){ return {kind:'none', title, why, tip}; }

function simulate(){
  const s=byId(SUBSTRATES,S.sub), r=byId(REAGENTS,S.rea), sol=byId(SOLVENTS,S.sol);
  if(!s || !r) return nothing('Le ballon n’est pas prêt', 'Il faut au moins un substrat et un réactif.', 'Glisse-les depuis l’étagère.');
  if(s.fam==='halo') return runHalo(s,r,sol,S.T);
  if(s.fam==='ene') return runEne(s,r,sol,S.T);
  return runAlc(s,r,sol,S.T);
}

/* ================= RENDU SVG DES SCÈNES ================= */
const stageState = {frames:[], i:0, from:null, t:1, raf:0};
function labelR(t){ return t ? {rx: Math.max(9, t.length*5.2+3), ry: 11} : {rx:2, ry:2}; }
function shrink(p, q){
  const dx=q.x-p.x, dy=q.y-p.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
  const {rx,ry}=labelR(p.t); const d = 1/Math.sqrt((ux/rx)**2+(uy/ry)**2);
  return {x:p.x+ux*d, y:p.y+uy*d};
}
function bondSVG(a, b, type, op){
  const p=shrink(a,b), q=shrink(b,a); const dx=q.x-p.x, dy=q.y-p.y, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
  const o=`opacity="${op.toFixed(3)}"`;
  if(type==='d') return `<g ${o}><line class="bond" x1="${p.x+nx*3.6}" y1="${p.y+ny*3.6}" x2="${q.x+nx*3.6}" y2="${q.y+ny*3.6}"/><line class="bond" x1="${p.x-nx*3.6}" y1="${p.y-ny*3.6}" x2="${q.x-nx*3.6}" y2="${q.y-ny*3.6}"/></g>`;
  if(type==='dash') return `<line class="bond" ${o} stroke-dasharray="5 5" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>`;
  if(type==='wedge') return `<polygon class="wedge" ${o} points="${p.x},${p.y} ${q.x+nx*5},${q.y+ny*5} ${q.x-nx*5},${q.y-ny*5}"/>`;
  if(type==='hash'){ let s=''; for(let k=1;k<=6;k++){ const t=k/6, w=5*t, cx=p.x+dx*t, cy=p.y+dy*t; s+=`<line class="bond" stroke-width="1.6" x1="${cx+nx*w}" y1="${cy+ny*w}" x2="${cx-nx*w}" y2="${cy-ny*w}"/>`; } return `<g ${o}>${s}</g>`; }
  return `<line class="bond" ${o} x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>`;
}
function ptOf(ref, atoms){
  const [k,v]=ref.split(':');
  if(k==='a'){ const a=atoms[v]; return a ? {x:a.x,y:a.y,atom:true} : null; }
  const [x,y]=v.split('-'); const A1=atoms[x], B1=atoms[y]; if(!A1||!B1) return null;
  return {x:(A1.x+B1.x)/2, y:(A1.y+B1.y)/2, atom:false};
}
function arrowSVG(ar, atoms){
  const s=ptOf(ar.f,atoms), e=ptOf(ar.t,atoms); if(!s||!e) return '';
  let dx=e.x-s.x, dy=e.y-s.y, L=Math.hypot(dx,dy)||1; const ux=dx/L, uy=dy/L;
  const S0={x:s.x+ux*(s.atom?16:4), y:s.y+uy*(s.atom?16:4)}, E0={x:e.x-ux*(e.atom?18:6), y:e.y-uy*(e.atom?18:6)};
  const mx=(S0.x+E0.x)/2, my=(S0.y+E0.y)/2, nx=-uy, ny=ux, b=ar.b||25;
  return `<g class="arwg"><path class="arw" pathLength="1" d="M${S0.x},${S0.y} Q${mx+nx*b},${my+ny*b} ${E0.x},${E0.y}" marker-end="url(#${ar.half?'hh':'ah'})"/></g>`;
}
function ease(t){ return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function drawStage(){
  const svg=document.getElementById('scene'); if(!svg) return;
  const F=stageState.frames[stageState.i]; if(!F) return;
  const P=stageState.from, t=ease(stageState.t);
  const amap={}; const list=[];
  const prevA={}; if(P) P.atoms.forEach(a=>prevA[a.id]=a);
  F.atoms.forEach(a=>{ const pa=prevA[a.id]; const x = pa ? pa.x+(a.x-pa.x)*t : a.x, y = pa ? pa.y+(a.y-pa.y)*t : a.y;
    const lab = pa && t<.5 ? pa.t : a.t; const ch = pa && t<.5 ? (pa.ch||'') : (a.ch||'');
    const op = pa ? 1 : t; amap[a.id]={x,y,t:lab}; list.push({...a,x,y,t:lab,ch,op}); });
  if(P) P.atoms.forEach(a=>{ if(!F.atoms.find(b=>b.id===a.id)){ amap[a.id]=amap[a.id]||{x:a.x,y:a.y,t:a.t}; list.push({...a,op:1-t}); }});
  const key=b=>b[0]+'|'+b[1]+'|'+b[2];
  const cur=new Set(F.bonds.map(key)), old=P?new Set(P.bonds.map(key)):new Set();
  let bs='';
  F.bonds.forEach(b=>{ if(amap[b[0]]&&amap[b[1]]) bs+=bondSVG(amap[b[0]],amap[b[1]],b[2], old.has(key(b))||!P?1:t); });
  if(P) P.bonds.forEach(b=>{ if(!cur.has(key(b))&&amap[b[0]]&&amap[b[1]]) bs+=bondSVG(amap[b[0]],amap[b[1]],b[2],1-t); });
  let as=''; list.forEach(a=>{ if(!a.t) return; const cls='atom '+(a.r||''); as+=`<g opacity="${a.op.toFixed(3)}"><text class="${cls}" x="${a.x}" y="${a.y}" text-anchor="middle" dominant-baseline="central">${a.t}</text>${a.ch?`<text class="chg" x="${a.x+labelR(a.t).rx+3}" y="${a.y-12}" text-anchor="middle">${a.ch}</text>`:''}</g>`; });
  let ex=''; (F.extras||[]).forEach(e=>{ ex+=`<text class="extra" opacity="${t.toFixed(3)}" x="${e.x}" y="${e.y}" text-anchor="middle" dominant-baseline="central" font-size="${e.s||18}">${e.t}</text>`; });
  let ar=''; if(stageState.t>=1) (F.arrows||[]).forEach(a=>{ ar+=arrowSVG(a, amap); });
  svg.querySelector('#layer').innerHTML = bs+as+ex+ar;
}
function goFrame(i){
  const fr=stageState.frames; if(!fr.length) return;
  i=Math.max(0,Math.min(fr.length-1,i));
  stageState.from = i===stageState.i ? null : fr[stageState.i];
  stageState.i=i; stageState.t = (stageState.from && !matchMedia('(prefers-reduced-motion: reduce)').matches) ? 0 : 1;
  cancelAnimationFrame(stageState.raf);
  const t0=performance.now();
  const step=now=>{ if(stageState.t<1){ stageState.t=Math.min(1,(now-t0)/750); drawStage(); stageState.raf=requestAnimationFrame(step);} else drawStage(); };
  stageState.raf=requestAnimationFrame(step); drawStage();
  const cap=document.getElementById('cap'); if(cap) cap.innerHTML=`<b>${i+1}/${fr.length}</b>${fr[i].cap}`;
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i));
  const pv=document.getElementById('prev'), nx=document.getElementById('next');
  if(pv) pv.disabled = i===0; if(nx) nx.textContent = i===fr.length-1 ? 'Rejouer' : 'Étape suivante';
}

  {t:'Anti-Markovnikov', d:'Fais du 1-bromopropane à partir du propène.', ok:r=>r.sub?.id==='propene' && main(r).includes('1-bromopropane')},
  {t:'Le bore malin', d:'Fais du propan-1-ol à partir du propène.', ok:r=>r.sub?.id==='propene' && main(r).includes('propan-1-ol')},
  {t:'Méso', d:'Obtiens le butane-2,3-diol méso.', ok:r=>main(r).includes('butane-2,3-diol méso')},
  {t:'Dibromé méso', d:'Obtiens le 2,3-dibromobutane méso.', ok:r=>main(r).includes('dibromobutane méso')},
  {t:'Stop à l’aldéhyde', d:'Fais du butanal à partir du butan-1-ol.', ok:r=>main(r).includes('butanal')},
  {t:'Déshydratation', d:'Fais du 2-méthylpropène à partir d’un alcool.', ok:r=>r.kind==='alc' && main(r).includes('2-méthylpropène')},
];
function main(r){ return (r.products||[]).filter(p=>p.r!=='mino').map(p=>p.n).join(' | '); }
function renderDefis(){
  const n=Object.keys(S.done).length;
  $('#defiCount').textContent=`${n}/${DEFIS.length}`;
  $('#dlist').innerHTML = DEFIS.map((d,i)=>`<li data-i="${i}" class="${S.mode==='defis'&&S.defi===i?'cur':''}"><span class="ck ${S.done[i]?'done':''}">${S.done[i]?'✓':''}</span><span><b>${esc(d.t)}</b> · ${esc(d.d)}</span></li>`).join('');
  const g=$('#goal');
  if(S.mode==='defis'){ const d=DEFIS[S.defi]; g.hidden=false;
    g.innerHTML=`<div class="gtxt"><span class="label">Défi ${S.defi+1} / ${DEFIS.length}${S.done[S.defi]?' · réussi':''}</span><div><b>${esc(d.t)}</b></div><p>${esc(d.d)}</p></div><div class="goal-nav"><button class="btn small" id="gp">←</button><button class="btn small" id="gn">→</button></div>`;
    $('#gp').onclick=()=>{S.defi=(S.defi+DEFIS.length-1)%DEFIS.length; renderDefis();};
    $('#gn').onclick=()=>{S.defi=(S.defi+1)%DEFIS.length; renderDefis();};
  } else g.hidden=true;
}
function renderLog(){
  $('#log').innerHTML = S.log.length ? S.log.map(l=>`<li style="--mc:${MECH[l.m]?.c||'var(--line)'}"><span class="fx">${esc(l.a)}</span> → <b>${esc(l.p)}</b> <span style="color:var(--muted)">(${esc(l.m)})</span></li>`).join('') : '<li class="empty">Tes réactions s’afficheront ici.</li>';
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

/* ================= ACTIONS ================= */
function put(slot,id){ S[slot] = S[slot]===id && slot!=='sub' && slot!=='rea' ? null : id; renderSlots(); renderShelf(); }
function run(record=true){
  const res=simulate(); renderResult(res); renderFlask(true);
  if(record && res.kind!=='none'){
    const p = res.products.find(x=>x.r!=='mino');
    S.log.unshift({a:`${res.sub.n} + ${res.rea.f}`, p:p?p.n:'', m:res.mech}); S.log=S.log.slice(0,30);
    let hit=-1; DEFIS.forEach((d,i)=>{ if(!S.done[i] && d.ok(res)){ S.done[i]=true; if(hit<0) hit=i; }});
    if(hit>=0) toast(`Défi réussi : ${DEFIS[hit].t}`);
    save(); renderLog(); renderDefis();
  }
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab; renderShelf();});
document.querySelectorAll('.temps button').forEach(b=>b.onclick=()=>{S.T=b.dataset.t; renderSlots();});
document.querySelectorAll('.slot .x').forEach(b=>b.onclick=()=>{S[b.parentElement.dataset.slot]=null; renderSlots(); renderShelf();});
$('#run').onclick=()=>run(true);
$('#clear').onclick=()=>{S.sub=S.rea=S.sol=null; renderSlots(); renderShelf();};
$('#mLabo').onclick=()=>{S.mode='labo'; $('#mLabo').setAttribute('aria-pressed',true); $('#mDefis').setAttribute('aria-pressed',false); renderDefis();};
$('#mDefis').onclick=()=>{S.mode='defis'; $('#mDefis').setAttribute('aria-pressed',true); $('#mLabo').setAttribute('aria-pressed',false); const f=DEFIS.findIndex((d,i)=>!S.done[i]); S.defi=f<0?0:f; renderDefis(); window.scrollTo({top:0,behavior:'smooth'});};
$('#dlist').onclick=e=>{ const li=e.target.closest('li'); if(!li) return; S.mode='defis'; S.defi=+li.dataset.i; $('#mDefis').setAttribute('aria-pressed',true); $('#mLabo').setAttribute('aria-pressed',false); renderDefis(); window.scrollTo({top:0,behavior:'smooth'}); };

/* Glisser-déposer (souris + tactile) */
let drag=null;
$('#shelf').addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  drag={c, x:e.clientX, y:e.clientY, moved:false, ghost:null, id:e.pointerId};
  c.setPointerCapture(e.pointerId);
});
$('#shelf').addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.moved=true; const g=document.createElement('div'); g.className='ghost'; g.textContent=drag.c.querySelector('.fx').textContent; document.body.appendChild(g); drag.ghost=g;
  }
  if(drag.moved){ drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
    const tgt=dropTarget(e.clientX,e.clientY);
    $('#flaskZone').classList.toggle('hover', !!tgt);
    document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('hover', tgt && s.dataset.slot===drag.c.dataset.slot));
  }
});
function dropTarget(x,y){ const el=document.elementFromPoint(x,y); return el && (el.closest('#flaskZone')||el.closest('.slot')||el.closest('.bench')); }
function endDrag(e){
  if(!drag) return;
  const {c,moved,ghost}=drag;
  if(!moved) put(c.dataset.slot,c.dataset.id);
  else { if(dropTarget(e.clientX,e.clientY)) put(c.dataset.slot,c.dataset.id); ghost.remove(); }
  $('#flaskZone').classList.remove('hover'); document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hover'));
  drag=null;
}
$('#shelf').addEventListener('pointerup',endDrag);
$('#shelf').addEventListener('pointercancel',e=>{ if(drag&&drag.ghost) drag.ghost.remove(); drag=null; });
$('#shelf').addEventListener('keydown',e=>{ const c=e.target.closest('.chip'); if(c&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); put(c.dataset.slot,c.dataset.id);} });

renderShelf(); renderSlots(); renderDefis(); renderLog(); run(false);
</script>

</body></html>
