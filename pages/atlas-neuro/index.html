function profil(body){
  body.innerHTML=`<div class="ctrl">
   <div class="slider in"><label for="invDist">Distance de l'objet</label><input id="invDist" type="range" min="0" max="100" value="80"><output id="invDistO"></output></div>
   <div class="seg" role="group" aria-label="Réglage du cristallin"><button data-m="auto" class="on">Réflexe d'accommodation actif</button><button data-m="man">Cristallin bloqué (je règle)</button></div>
   <div class="slider in" id="invPWrap" hidden><label for="invP">Cristallin</label><input id="invP" type="range" min="0" max="100" value="20"><output id="invPO"></output></div></div>
  <div class="dgbox"><svg viewBox="0 0 700 330" role="img" aria-label="Œil vu de profil : rayons lumineux, cristallin et image sur la rétine">${DEFS}
   <line class="mid" x1="10" y1="165" x2="690" y2="165"/>
   <circle class="b eye" cx="520" cy="165" r="125"/>
   <path class="ret" d="M 600 69 A 125 125 0 0 1 600 261"/>
   <text class="sm" x="650" y="60" text-anchor="middle">rétine</text>
   <text class="sm" x="520" y="312" text-anchor="middle">œil vu de profil</text>
   <g id="invMus"></g><g id="invObj"></g><g id="invRays"></g><g id="invImg"></g>
   <text class="sm mut" x="16" y="320">distances non à l'échelle</text>
  </svg></div>
  <div class="verdict" id="invV" aria-live="polite"></div>
  <div class="model sec"><h3 style="font-size:17px">Comprendre en 4 points</h3><ol class="chain" style="margin:0">
   <li><b>Pourquoi l'image est inversée.</b> Les rayons partis du haut de l'objet passent par le <b>cristallin</b> (lentille biconvexe) et se croisent : ils arrivent en <b>bas</b> de la rétine, et ceux du bas arrivent en haut. Même chose pour gauche et droite. Ce n'est donc pas la rétine qui inverse, c'est le cristallin ; la rétine reçoit l'image déjà retournée.</li>
   <li><b>Ce que « régler » veut dire.</b> L'inversion ne se règle pas : elle a toujours lieu. Ce qui se règle, c'est la <b>netteté</b>, c'est-à-dire l'endroit où les rayons se rejoignent. Il faut qu'ils se rejoignent pile sur la rétine. Joue avec le mode « cristallin bloqué » pour voir l'image devenir floue.</li>
   <li><b>Le réglage = l'accommodation</b>, sous contrôle du <b>SNA</b>. De <b>près</b>, le <b>parasympathique</b> contracte le <b>muscle ciliaire</b> : l'anneau se resserre, les <b>fibres zonulaires</b> se détendent, le cristallin élastique se <b>bombe</b> et dévie plus les rayons. De <b>loin</b>, le <b>sympathique</b> relâche le muscle ciliaire : l'anneau s'élargit, tend les zonules et <b>aplatit</b> le cristallin. C'est un <b>réflexe</b> géré par un noyau du tronc cérébral, à partir du <b>contraste</b> de l'image (comme l'autofocus d'un appareil photo).</li>
   <li><b>Et l'image à l'envers ?</b> Le cerveau ne la « remet » pas à l'endroit comme une photo qu'on retourne. Chaque point de la rétine correspond à une direction de l'espace, et cette carte est projetée point par point sur le cortex (<b>projection topique</b>). Le cortex l'interprète telle quelle. <span class="note">Ce dernier point est une précision pour comprendre, il n'est pas développé dans la ronéo.</span></li>
  </ol></div>`;
  const Lx=440, Cy=165, D=200, H=50, UMIN=110, UMAX=400;
  const Pfar=1/UMAX+1/D, Pnear=1/UMIN+1/D;
  let mode="auto";
  const $i=s=>body.querySelector(s);
  function cm(u){return 10*Math.pow(60,(u-UMIN)/(UMAX-UMIN));}
  function fmtD(u){const c=cm(u);return c<100?"≈ "+Math.round(c/5)*5+" cm":"≈ "+(c/100).toFixed(c<300?1:0).replace(".",",")+" m";}
  function draw(){
    const t=+$i('#invDist').value/100, u=UMIN+t*(UMAX-UMIN);
    $i('#invDistO').textContent=fmtD(u)+(t<.35?" · près":(t>.7?" · loin":""));
    let P = mode==="auto" ? 1/u+1/D : Pfar+(+$i('#invP').value/100)*(Pnear-Pfar);
    const k=(P-Pfar)/(Pnear-Pfar);   // 0 = aplati, 1 = bombé
    $i('#invPO').textContent = k<.3?"aplati (vision de loin)":(k>.7?"bombé (vision de près)":"intermédiaire");
    const x0=Lx-u, tipY=Cy-H;
    // objet
    $i('#invObj').innerHTML=`<path class="objA" d="M${x0} ${Cy} V ${tipY+8}"/><path class="objH" d="M${x0-9} ${tipY+12} L ${x0} ${tipY} L ${x0+9} ${tipY+12} Z"/><circle class="objDot" cx="${x0}" cy="${tipY}" r="5"/><text class="sm" x="${x0}" y="${Cy+22}" text-anchor="middle">objet</text>`;
    // cristallin, muscle ciliaire, zonules
    const rx=7+k*15, ry=58, my=ry+20+(1-k)*12, mr=8+k*6;
    const zon = y0=>{const y1=Cy+(y0>0?1:-1)*ry*0.92;const ym=Cy+y0;return k>.5?`M${Lx} ${ym} q ${6} ${(y1-ym)/3} 0 ${(y1-ym)/1.5} q ${-6} ${(y1-ym)/6} 0 ${(y1-ym)/3}`:`M${Lx} ${ym} L ${Lx} ${y1}`;};
    $i('#invMus').innerHTML=`<path class="zon" d="${zon(-my+mr)}"/><path class="zon" d="${zon(my-mr)}"/>
     <ellipse class="mus2" cx="${Lx}" cy="${Cy-my}" rx="${mr}" ry="${mr}"/><ellipse class="mus2" cx="${Lx}" cy="${Cy+my}" rx="${mr}" ry="${mr}"/>
     <ellipse class="lens" cx="${Lx}" cy="${Cy}" rx="${rx}" ry="${ry}"/>
     <text class="sm" x="${Lx}" y="${Cy-my-mr-8}" text-anchor="middle">muscle ciliaire</text>
     <text class="sm" x="${Lx-rx-6}" y="${Cy+4}" text-anchor="end">cristallin</text>
     <text class="sm" x="${Lx+16}" y="${Cy+my-mr-4}">zonules</text>`;
    // rayons depuis la pointe de l'objet
    const v=1/(P-1/u), Ix=Lx+v, Iy=Cy+H*v/u, R=Lx+D;
    const hits=[];let rays="";
    [-0.4,0,0.75].forEach(f=>{
      const yl = f===-0.4 ? tipY : (f===0 ? Cy : Cy+ry*0.6);
      const slope=(Iy-yl)/(Ix-Lx), yR=yl+slope*(R-Lx);
      hits.push(yR);
      rays+=`<path class="ray" d="M${x0} ${tipY} L ${Lx} ${yl} L ${R} ${yR}"/>`;
    });
    if(v<D-6) rays+=`<circle class="cross" cx="${Ix}" cy="${Iy}" r="4"/>`;
    if(v>D) rays+=`<path class="ray ghost" d="M${R} ${hits[0]} L ${Math.min(Ix,690)} ${Cy+H*Math.min(v,(690-Lx))/u}"/><path class="ray ghost" d="M${R} ${hits[2]} L ${Math.min(Ix,690)} ${Cy+H*Math.min(v,(690-Lx))/u}"/>`;
    $i('#invRays').innerHTML=rays;
    const spread=Math.abs(Math.max(...hits)-Math.min(...hits)), net=spread<6;
    const imgH=H*D/u;
    $i('#invImg').innerHTML = net
      ? `<path class="imgA" d="M${R} ${Cy} V ${Cy+imgH-8}"/><path class="imgH" d="M${R-8} ${Cy+imgH-12} L ${R} ${Cy+imgH} L ${R+8} ${Cy+imgH-12} Z"/><circle class="objDot" cx="${R}" cy="${Cy+imgH}" r="5"/><text class="tx acc-t" x="${R-10}" y="${Cy+imgH+22}" text-anchor="end">image nette, à l'envers</text>`
      : `<rect class="blur" x="${R-6}" y="${Math.min(...hits)}" width="12" height="${spread}" rx="6"/><text class="tx bad-t" x="${R-12}" y="${Math.max(...hits)+22}" text-anchor="end">tache floue</text>`;
    const where = net ? "pile sur la rétine : <b>image nette</b>" : (v<D ? "<b>devant</b> la rétine : image <b>floue</b> (le cristallin est trop bombé pour cette distance)" : "<b>derrière</b> la rétine : image <b>floue</b> (le cristallin est trop plat pour cette distance)");
    const sna = k>.5 ? `<span class="pill" style="background:var(--para)">Parasympathique</span> muscle ciliaire <b>contracté</b> → zonules <b>détendues</b> → cristallin <b>bombé</b>` : `<span class="pill" style="background:var(--sym)">Sympathique</span> muscle ciliaire <b>relâché</b> → zonules <b>tendues</b> → cristallin <b>aplati</b>`;
    $i('#invV').innerHTML=`<div>Les rayons partis de la pointe de l'objet se rejoignent ${where}.</div><div>${sna}</div><p class="note">${mode==="auto"?"Le réflexe ajuste le cristallin à chaque distance : l'image reste nette, et toujours inversée (la pointe en haut de l'objet arrive en bas de la rétine).":"Le cristallin ne bouge plus : rapproche ou éloigne l'objet et regarde où les rayons se croisent. C'est ce que corrige le réflexe d'accommodation."}</p>`;
  }
  $i('#invDist').oninput=draw; $i('#invP').oninput=draw;
  body.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;body.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));
    if(mode==="man"){const t=+$i('#invDist').value/100,u=UMIN+t*(UMAX-UMIN);$i('#invP').value=Math.round(((1/u+1/D)-Pfar)/(Pnear-Pfar)*100);}
    $i('#invPWrap').hidden=mode!=="man";draw();});
  draw();
}

function dessus(body){
  body.innerHTML=`<div class="ctrl"><div class="seg" role="group" aria-label="Position de l'objet"><button data-o="L" class="on">Objet dans le champ gauche</button><button data-o="R">Objet dans le champ droit</button></div></div>
  <div class="dgbox"><svg viewBox="0 0 700 440" role="img" aria-label="Les deux yeux vus de dessus, chiasma et hémisphères">${DEFS}
   <line class="mid" x1="350" y1="10" x2="350" y2="430"/>
   <text class="sm mut" x="340" y="22" text-anchor="end">champ visuel gauche</text><text class="sm mut" x="360" y="22">champ visuel droit</text>
   <g id="dObj"></g>
   <g id="dEyes"></g><g id="dRays"></g><g id="dFib"></g>
   <ellipse class="b" cx="350" cy="268" rx="26" ry="11"/><text class="sm" x="384" y="272">chiasma</text>
   <ellipse class="b" cx="276" cy="338" rx="30" ry="14"/><ellipse class="b" cx="424" cy="338" rx="30" ry="14"/><text class="sm" x="350" y="342" text-anchor="middle">thalamus</text>
   <rect class="b" x="186" y="392" width="150" height="34" rx="9"/><rect class="b" x="364" y="392" width="150" height="34" rx="9"/>
   <text class="sm" x="261" y="414" text-anchor="middle">cortex occipital G</text><text class="sm" x="439" y="414" text-anchor="middle">cortex occipital D</text>
  </svg></div>
  <div class="legend"><span><i class="sw" style="background:var(--tact)"></i>rétine nasale (côté nez) : ses fibres croisent</span><span><i class="sw" style="background:var(--para)"></i>rétine temporale (côté tempe) : ses fibres restent du même côté</span></div>
  <div class="verdict" id="dV" aria-live="polite"></div>`;
  const E=[{x:270,n:1},{x:430,n:-1}], Ey=165, r=48;   // n : direction du nez (+1 = vers la droite)
  let side="L";
  const $i=s=>body.querySelector(s);
  function hit(lx,ly,dx,dy,cx,cy){const fx=lx-cx,fy=ly-cy,a=dx*dx+dy*dy,b=2*(fx*dx+fy*dy),c=fx*fx+fy*fy-r*r,t=(-b+Math.sqrt(b*b-4*a*c))/(2*a);return [lx+t*dx,ly+t*dy];}
  function draw(){
    const ox = side==="L"?190:510, oy=34;
    $i('#dObj').innerHTML=`<circle class="dobj ${side}" cx="${ox}" cy="${oy}" r="17"/><text class="tx" x="${ox}" y="${oy+5}" text-anchor="middle" style="fill:#fff">A</text>`;
    let eyes="",rays="";
    E.forEach((e,i)=>{
      // hémirétines : nasale (côté nez) et temporale
      const nasX=e.x+e.n*r, temX=e.x-e.n*r;
      eyes+=`<circle class="b eye" cx="${e.x}" cy="${Ey}" r="${r}"/>
       <path class="hemi nas" d="M ${e.x} ${Ey+r} A ${r} ${r} 0 0 ${e.n>0?0:1} ${e.x+e.n*r*0.82} ${Ey-r*0.57}"/>
       <path class="hemi tem" d="M ${e.x} ${Ey+r} A ${r} ${r} 0 0 ${e.n>0?1:0} ${e.x-e.n*r*0.82} ${Ey-r*0.57}"/>
       <ellipse class="lens" cx="${e.x}" cy="${Ey-r+10}" rx="16" ry="6"/>
       <text class="sm" x="${e.x}" y="${Ey-r-8}" text-anchor="middle">${i?"œil droit":"œil gauche"}</text>
       <text class="sm halo" x="${e.x+e.n*38}" y="${Ey+r+20}" text-anchor="middle">nasale</text>
       <text class="sm" x="${temX-e.n*8}" y="${Ey+18}" text-anchor="${e.n>0?"end":"start"}">temporale</text>`;
      const lx=e.x, ly=Ey-r+10, dx=lx-ox, dy=ly-oy, p=hit(lx,ly,dx,dy,e.x,Ey);
      rays+=`<path class="ray" d="M${ox} ${oy} L ${lx} ${ly} L ${p[0]} ${p[1]}"/><circle class="objDot" cx="${p[0]}" cy="${p[1]}" r="5"/>`;
    });
    $i('#dEyes').innerHTML=eyes; $i('#dRays').innerHTML=rays;
    // fibres : LN, LT, RN, RT
    const F={LT:"M 246 206 C 250 240, 300 250, 336 266 L 284 326", LN:"M 294 206 C 310 236, 330 250, 350 268 L 416 326",
             RN:"M 406 206 C 390 236, 370 250, 350 268 L 284 326", RT:"M 454 206 C 450 240, 400 250, 364 266 L 416 326"};
    const act = side==="L"?["LN","RT"]:["LT","RN"];
    let f="";
    Object.entries(F).forEach(([k,d])=>{const on=act.includes(k);f+=`<path class="fib ${k[1]==="N"?"nas":"tem"} ${on?"on":""}" d="${d}"/>`;});
    f+=`<path class="fib tem ${side==="R"?"on":""}" d="M 276 352 L 266 390"/><path class="fib tem ${side==="L"?"on":""}" d="M 424 352 L 434 390"/>`;
    $i('#dFib').innerHTML=f;
    $i('#dV').innerHTML = side==="L"
     ? `<div>L'objet est à <b>gauche</b>. Les rayons traversent le cristallin et se croisent : ils arrivent sur la moitié <b>droite</b> de chaque rétine, c'est-à-dire la rétine <b>nasale de l'œil gauche</b> et la rétine <b>temporale de l'œil droit</b>.</div><div>Au <b>chiasma</b>, seules les fibres <b>nasales croisent</b>. Les deux images du même objet se retrouvent donc dans le même hémisphère : le <b>droit</b>. Champ visuel gauche → cortex occipital droit.</div>`
     : `<div>L'objet est à <b>droite</b>. Les rayons arrivent sur la moitié <b>gauche</b> de chaque rétine : rétine <b>temporale de l'œil gauche</b> et rétine <b>nasale de l'œil droit</b>.</div><div>Les fibres nasales de l'œil droit croisent au chiasma, les temporales de l'œil gauche restent à gauche : tout arrive dans l'hémisphère <b>gauche</b>. Champ visuel droit → cortex occipital gauche.</div>`;
  }
  body.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{side=b.dataset.o;body.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('on',x===b));draw();});
  draw();
}

function hautbas(body){
  body.innerHTML=`<div class="ctrl"><div class="seg" role="group" aria-label="Position de l'objet"><button data-o="H" class="on">Objet en haut du champ</button><button data-o="B">Objet en bas du champ</button></div>
   <label class="sel">Lésion <select id="hbLes"><option value="">Aucune</option><option value="sup">Radiations supérieures (pariétal)</option><option value="inf">Radiations inférieures (temporal)</option></select></label></div>

   <ellipse class="lobe" cx="470" cy="78" rx="150" ry="58"/><text class="sm mut" x="470" y="40" text-anchor="middle">lobe pariétal</text>

   <ellipse class="lens" cx="124" cy="165" rx="7" ry="26"/>
   <text class="sm" x="236" y="122">rétine sup.</text><text class="sm" x="236" y="216">rétine inf.</text>
   <text class="sm" x="170" y="245" text-anchor="middle">œil (de profil)</text>

   <ellipse class="b" cx="318" cy="165" rx="20" ry="10"/><text class="sm" x="318" y="146" text-anchor="middle">chiasma</text>

    $i('#hbObj').innerHTML=`<path class="objA" d="M${ox} 165 V ${oy+(pos==="H"?8:-8)}"/><path class="objH" d="M${ox-8} ${oy+(pos==="H"?12:-12)} L ${ox} ${oy} L ${ox+8} ${oy+(pos==="H"?12:-12)} Z"/><text class="sm" x="${ox+12}" y="${oy+4}">objet ${pos==="H"?"en haut":"en bas"}</text>
      <path class="ray" d="M${ox} ${oy} L ${lx} ${ly} L ${hx} ${hy}"/><circle class="objDot" cx="${hx}" cy="${hy}" r="5"/>`;
    const sup = pos==="B";   // objet en bas -> rétine supérieure

    $i('#hbFib').innerHTML=f;
    $i('#hbX').innerHTML = les ? `<g class="xmark"><path d="M${les==="sup"?509:459} ${les==="sup"?59:279} l 22 22 M ${les==="sup"?531:481} ${les==="sup"?59:279} l -22 22"/></g>`:"";
    // champ visuel perdu : radiations sup = rétine sup = bas du champ
    const lostHalf = les==="sup"?"bas":(les==="inf"?"haut":null);
    $i('#hbF').innerHTML=`<path class="fq ${lostHalf==="haut"?"lost":""}" d="M8 50 A42 42 0 0 1 92 50 Z"/><path class="fq ${lostHalf==="bas"?"lost":""}" d="M8 50 A42 42 0 0 0 92 50 Z"/><line class="mid" x1="6" y1="50" x2="94" y2="50"/><text class="sm" x="50" y="34" text-anchor="middle">haut</text><text class="sm" x="50" y="74" text-anchor="middle">bas</text>`;
    const blocked = (les==="sup"&&sup)||(les==="inf"&&!sup);
    $i('#hbV').innerHTML=`<div>L'objet est en <b>${pos==="H"?"haut":"bas"}</b> du champ. Les rayons se croisent dans le cristallin et arrivent sur la rétine <b>${sup?"supérieure":"inférieure"}</b>.</div>
      <div>Les fibres de cette rétine passent le chiasma (qui ne croise que <b>gauche/droite</b>) puis le thalamus, et partent dans les radiations <b>${sup?"supérieures, par le lobe pariétal":"inférieures, par le lobe temporal"}</b> jusqu'au cortex strié.</div>
      ${les?`<div><b>${blocked?"Le message est bloqué":"Ce message passe"}</b> : une lésion des radiations ${les==="sup"?"supérieures (pariétal)":"inférieures (temporal)"} fait perdre le <b>${lostHalf}</b> du champ visuel.</div>`:""}
      <p class="note">Règle : haut du champ → rétine inférieure → radiations inférieures (temporal). Bas du champ → rétine supérieure → radiations supérieures (pariétal).</p>`;

function trace(){
  let d="M0 46";const W=1000;
  for(let x=0;x<=W;x+=4){let y=46;const ph=x%250;
    if(ph>60&&ph<70)y=46-(ph-60)*1.2; else if(ph>=70&&ph<78)y=34-(ph-70)*4; else if(ph>=78&&ph<92)y=2+(ph-78)*4.6; else if(ph>=92&&ph<110)y=66-(ph-92)*1.4; else if(ph>=110&&ph<140)y=41+(ph-110)*0.17;
    d+=` L ${x} ${y.toFixed(1)}`;}
  return `<svg class="trace" viewBox="0 0 1000 70" preserveAspectRatio="none" aria-hidden="true"><path class="base" d="M0 46 H1000"/><path d="${d}"/></svg>`;
}

// ---- montage des composants ----
function mount(M){
  $$("table.t",M).forEach(t=>{if(t.parentElement.classList.contains("tblwrap"))return;const w=document.createElement("div");w.className="tblwrap";t.before(w);w.appendChild(t);});
  $$("[data-dg]",M).forEach(el=>mountDiag(el,DIAG[el.dataset.dg]));
  $$("[data-fc]",M).forEach(mountFC);
  const et=$("#examT",M); if(et) startTimer(et,30);
}
function mountDiag(el,D){
  const box=document.createElement("div");el.appendChild(box);
  if(D.kind==="custom"){D.render(box);return;}
  el.classList.add("st");
  box.innerHTML=`<div class="dgbox">${D.svg}</div><div class="steps"><div class="stepnow" aria-live="polite"></div><div class="row"><button class="btn sm" data-s="-1">← Précédent</button><div class="dots">${D.steps.map((s,i)=>`<button data-i="${i}" aria-label="Étape ${i+1}">${i+1}</button>`).join("")}</div><button class="btn sm" data-s="1">Suivant →</button><button class="btn sm" data-s="all">Tout afficher</button></div></div>`;
  if(D.after)D.after(box);
  let i=0;
  function show(){
    if(i<0){el.classList.remove("st");$$("[data-k]",box).forEach(n=>n.classList.remove("on"));$(".stepnow",box).innerHTML=`<span class="lbl">Vue d'ensemble</span><b>${D.title}</b>Clique une étape pour la rejouer.`;$$(".dots button",box).forEach(b=>b.className="");return;}
    el.classList.add("st");const s=D.steps[i];
    $$("[data-k]",box).forEach(n=>n.classList.toggle("on",s.on.includes(n.dataset.k)));
    $(".stepnow",box).innerHTML=`<span class="lbl">Étape ${i+1} / ${D.steps.length}</span><b>${s.t}</b>${s.d}`;
    $$(".dots button",box).forEach((b,j)=>b.className=j===i?"on":(j<i?"done":""));
  }
  box.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.i!==undefined)i=+b.dataset.i;
    else if(b.dataset.s==="all")i=-1;
    else if(b.dataset.s){i=Math.min(D.steps.length-1,Math.max(0,(i<0?0:i)+ +b.dataset.s));}
    else return; show();});
  show();
}

// ---- flashcards ----
function mountFC(el){
  const key=el.dataset.fc;
  let pool=key==="__all"?ALLCARDS:CHI[key].cards;
  const order=key==="__all"?[...CH].sort((a,b)=>(b.hot?1:0)-(a.hot?1:0)).map(c=>c.id):null;
  let q=dueCards(pool);
  if(order)q.sort((a,b)=>order.indexOf(a.ch)-order.indexOf(b.ch));
  if(key==="__all")q=q.slice(0,40);
  let mode="due", done=0, again=new Set(), flip=false;
  function counts(){const b=[0,0,0,0,0,0];pool.forEach(c=>b[Math.min(cardLevel(c.id),5)]++);return b;}
  function draw(){
    const b=counts(),mx=Math.max(...b,1);
    const boxes=`<div class="lbl">Répartition des cartes par niveau</div><div class="boxes">${b.map((n,i)=>`<div style="height:${8+n/mx*48}px" title="${n} cartes"><i>N${i} · ${n}</i></div>`).join("")}</div><div style="height:14px"></div>`;
    if(!q.length){el.innerHTML=boxes+`<div class="fc"><p class="empty">${done?`Séance terminée : ${done} cartes revues.`:"Aucune carte due pour l'instant."}</p><div class="row" style="justify-content:center"><button class="btn" data-x="allc">Revoir toutes les cartes${key==="__all"?"":" du chapitre"}</button></div></div>`;return;}
    const c=q[0];
    el.innerHTML=boxes+`<div class="fc"><div class="fcmeta"><span>${CHI[c.ch].short} · niveau ${cardLevel(c.id)}</span><span>${q.length} restante${q.length>1?"s":""}</span></div><div class="q">${c.q}</div>${flip?`<div class="a">${c.a}</div>`:""}
    <div class="row">${flip?`<button class="btn" data-r="0">Raté</button><button class="btn" data-r="1">Hésité</button><button class="btn pri" data-r="2">Su</button>`:`<button class="btn pri" data-x="flip">Voir la réponse</button>`}</div></div>`;
  }
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.x==="flip"){flip=true;draw();return;}
    if(b.dataset.x==="allc"){q=[...pool].sort(()=>Math.random()-.5);if(key==="__all")q=q.slice(0,40);flip=false;draw();return;}
    if(b.dataset.r!==undefined){const c=q.shift(),r=+b.dataset.r,o=S.cards[c.id]||{l:0,d:0},n=Date.now();
      if(r===0){o.l=0;o.d=n;if(!again.has(c.id)){again.add(c.id);q.push(c);}}
      else if(r===1){o.l=Math.max(1,o.l);o.d=n+IV[o.l]*DAY;}
      else{o.l=Math.min(5,o.l+1);o.d=n+IV[o.l]*DAY;}
      S.cards[c.id]=o;done++;flip=false;save();renderRail();draw();}
  });
  document.addEventListener("keydown",function k(e){if(!document.body.contains(el)){document.removeEventListener("keydown",k);return;}
    if(e.target.matches("textarea,input,select"))return;
    if(e.key===" "&&!flip&&q.length){e.preventDefault();flip=true;draw();}
    else if(flip&&["1","2","3"].includes(e.key)){const b=el.querySelector(`[data-r="${+e.key-1}"]`);if(b)b.click();}});
  draw();
}

// ---- interactions globales ----
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="menuBtn"){openRail();return;}
  if(b.dataset.go&&!b.closest("#nav")){b.dataset.go==="ch"?go("ch",b.dataset.ch):go(b.dataset.go);return;}
  if(b.dataset.tab){S.view.tab=b.dataset.tab;save();render();const t=$(".tabs");if(t&&t.getBoundingClientRect().top<0)t.scrollIntoView();return;}
  if(b.dataset.exam!==undefined){S.view.ex=+b.dataset.exam<0?null:+b.dataset.exam;save();render();window.scrollTo(0,0);return;}
  if(b.dataset.zoom){openZoom(b.dataset.zoom,b.dataset.cap);return;}
  if(b.dataset.gonote){const [ch,anc]=b.dataset.gonote.split("|");go("ch",ch,"cours",anc);return;}
  const nb=b.closest("[data-note]");
  if(nb){noteAction(nb,b);return;}
  const task=b.closest(".task");if(!task)return;
  const act=b.dataset.act;
  if(task.dataset.pb){
    const s=CH.flatMap(c=>c.sections).find(x=>x.id===task.dataset.pb);
    if(act==="reveal"){const rv=$(".reveal",task);rv.hidden=false;rv.innerHTML=pbReveal(s,$("textarea",task).value);b.textContent="Mettre à jour la comparaison";}
    if(b.dataset.r!==undefined){S.pb[s.id]=+b.dataset.r;save();renderRail();$$(".rate button",task).forEach(x=>x.classList.toggle("on",x===b));
      const top=$(".top",task);const old=$(".tag",top);if(old)old.remove();top.insertAdjacentHTML("beforeend",`<span class="tag ${["bad","mid","ok"][+b.dataset.r]}">${["Raté","Partiel","Su"][+b.dataset.r]}</span>`);toast("Auto-évaluation enregistrée");}
    return;
  }
  if(task.dataset.q){
    const q=QS.find(x=>x.id===task.dataset.q);
    if(act==="timer"){startTimer($(".timer",task),q.pts*3);b.disabled=true;}
    if(act==="corr"){showBareme(task,q);}
    if(act==="ai"){aiCorrect(task,q,b);}
  }
});
document.addEventListener("input",e=>{
  if(e.target.matches(".noteEd textarea")){const id=e.target.closest("[data-note]").dataset.note;saveAns("n-"+id,e.target.value);const st=e.target.closest("[data-note]").querySelector(".nsave");if(st)st.textContent="enregistrée";renderRail();return;}
  if(e.target.id==="noteSearch"){filterNotes(e.target.value);return;}
  const t=e.target;if(t.tagName!=="TEXTAREA")return;const task=t.closest(".task");if(!task)return;
  if(task.dataset.pb)saveAns("pb-"+task.dataset.pb,t.value);
  if(task.dataset.q)saveAns("q-"+task.dataset.q,t.value);
  if(e.target.closest(".bareme"))return;
});
document.addEventListener("change",e=>{const c=e.target;if(c.type!=="checkbox")return;const task=c.closest(".task[data-q]");if(task)scoreFrom(task,QS.find(x=>x.id===task.dataset.q));});

function keywords(html){
  const d=document.createElement("div");d.innerHTML=html;const seen=new Set();
  return $$("b",d).map(b=>b.textContent.trim()).filter(k=>{const n=norm(k);if(n.length<3||seen.has(n))return false;seen.add(n);return true;});
}
function pbReveal(s,ans){
  const kw=keywords(s.html), A=norm(ans);
  const hit=kw.filter(k=>{const n=norm(k).replace(/[()]/g,"");const parts=n.split(/[\s'’,/]+/).filter(p=>p.length>3);return A.includes(n)||(parts.length>1&&parts.every(p=>A.includes(p)));});
  const r=S.pb[s.id];
  return `<div class="row"><span class="score">${hit.length} / ${kw.length}</span><span class="note">mots-clés du cours retrouvés dans ta réponse</span></div>
  <div class="row">${kw.map(k=>`<span class="tag ${hit.includes(k)?"ok":"bad"}">${k}</span>`).join("")}</div>
  <div class="model sec">${s.html}${figs(s.id)}</div>
  <div><div class="lbl" style="margin-bottom:6px">Ton auto-évaluation</div><div class="rate">${["Raté","Partiel","Su"].map((t,i)=>`<button data-r="${i}" class="${r===i?"on":""}">${t}</button>`).join("")}</div></div>
  <p class="note">Les mots-clés ne suffisent pas : vérifie que chaque étape a son mécanisme.</p>`;
}
function showBareme(task,q,ai){
  const rv=$(".reveal",task);rv.hidden=false;
  const prev=ai||null;
  rv.innerHTML=`<div class="lbl">Barème : coche ce que ta copie contient vraiment</div><div class="bareme">${q.b.map((x,i)=>{const st=prev&&prev[i]?prev[i].statut:null;return `<label class="bitem ${st&&st!=="absent"?st:""}"><input type="checkbox" data-i="${i}" ${st==="ok"?"checked":""}><span>${x[1]}</span><span class="p">${fmt(x[0])} pt</span>${prev&&prev[i]&&prev[i].commentaire?`<span class="cm">${esc(prev[i].commentaire)}</span>`:""}</label>`;}).join("")}</div>
  <div class="row"><span class="score" data-sc>0</span><span class="note">/ ${q.pts} pts</span></div>`;
  scoreFrom(task,q,prev);
}
function scoreFrom(task,q,prev){
  let s=0;$$(".bareme input",task).forEach(c=>{const i=+c.dataset.i;if(c.checked)s+=q.b[i][0];else if(prev&&prev[i]&&prev[i].statut==="partiel")s+=q.b[i][0]/2;c.closest(".bitem").classList.toggle("ok",c.checked);});
  s=Math.round(s*4)/4;$("[data-sc]",task).textContent=fmt(s);
  const o=S.q[q.id]||{};o.last=s;o.best=Math.max(o.best||0,s);S.q[q.id]=o;save();renderRail();
}
async function aiCorrect(task,q,btn){
  const ans=$("textarea",task).value.trim();
  if(ans.length<40){toast("Écris d'abord une vraie réponse");return;}
  if(!SAMPLE){toast("Correction par Claude indisponible ici");return;}
  btn.disabled=true;const old=btn.textContent;btn.textContent="Correction en cours…";
  const prompt=`Tu es correcteur de l'épreuve rédactionnelle de physiologie (UE 3.5, 2e année de pharmacie, Toulouse). Le professeur exige des mots-clés mais surtout des explications développées et paraphrasées : une affirmation sans mécanisme ne vaut pas tous les points. Corrige franchement, sans complaisance, en français.
${q.ctx?"Énoncé : "+q.ctx+"\n":""}Question (${q.pts} points) : ${q.q}
Barème (index, points, critère) :
${q.b.map((x,i)=>`${i}. [${x[0]} pt] ${x[1]}`).join("\n")}
Copie de l'étudiant :
"""${ans.slice(0,6000)}"""
Pour chaque critère, dis si la copie le remplit : "ok" (présent et expliqué), "partiel" (mentionné sans mécanisme, imprécis ou incomplet) ou "absent". Signale aussi les erreurs factuelles.
Réponds uniquement en JSON : {"items":[{"i":0,"statut":"ok|partiel|absent","commentaire":"une phrase courte"}],"erreurs":["..."],"conseil":"une ou deux phrases pour gagner les points manquants"}`;
  try{
    const r=await SAMPLE.json(prompt,{modelTier:"default"});
    const items=[];(r.items||[]).forEach(it=>{if(typeof it.i==="number")items[it.i]=it;});
    showBareme(task,q,items);
    const rv=$(".reveal",task);
    rv.insertAdjacentHTML("afterbegin",`<div class="ai"><span class="lbl">Correction de Claude</span>${(r.erreurs||[]).length?`<div><b>Erreurs :</b><ul>${r.erreurs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"<div>Pas d'erreur factuelle relevée.</div>"}${r.conseil?`<div><b>Conseil :</b> ${esc(r.conseil)}</div>`:""}<div class="note">Critère « partiel » = moitié des points. Ajuste les cases si tu n'es pas d'accord.</div></div>`);
  }catch(e){
    toast(e&&e.code==="rate_limited"?"Trop de demandes, réessaie dans un moment":(e&&e.code==="not_granted"?"Autorisation refusée":"La correction a échoué"));
    if(e&&e.code==="not_granted")$$(".aiBtn").forEach(x=>x.hidden=true);
  }
  btn.disabled=false;btn.textContent=old;
}
const timers=new WeakMap();
function startTimer(el,min){
  if(!el||timers.has(el))return;const end=Date.now()+min*60000;
  const id=setInterval(()=>{if(!document.body.contains(el)){clearInterval(id);return;}const r=Math.round((end-Date.now())/1000),a=Math.abs(r);
    el.textContent=(r<0?"dépassé de ":"")+Math.floor(a/60)+" min "+String(a%60).padStart(2,"0")+" s";el.classList.toggle("late",r<0);},500);
  timers.set(el,id);el.textContent=min+" min 00 s";
}

render();
connect();
</script>

</body></html>
