<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atlas Neuro UE 3.5</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Mise en page : rail de chapitres à gauche (tiroir sur mobile), colonne de lecture ~720px, onglets par chapitre.
   Identité : cahier d'électrophysiologie. Encre bleu nuit, tracé de PA en magenta « fluorescence », sympathique orange / parasympathique sarcelle. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#16203A; --muted:#58627A; --line:#D8DEE9; --line2:#B9C2D3;
  --accent:#C2185B; --accent-soft:#F9E1EC; --accent2:#5B4BC4;
  --sym:#D24E12; --sym-soft:#FCE8DD; --para:#0B7F79; --para-soft:#DDF3F1;
  --tact:#2563C9; --pain:#D24E12; --sens:#2563C9; --mot:#0B7F79; --inh:#8A5CD6; --ca:#B7791F; --ca-soft:#FBF0DC;
  --ok:#23824A; --ok-soft:#DFF2E6; --warn:#B7791F; --bad:#C0352B; --bad-soft:#FBE3E1;
  --f-disp:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --note-bg:#FFF8D9; --note-line:#EEDC8C; --note-ink:#8A6A00;
  --r:14px; --side:268px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121B; --surface:#161C28; --surface2:#1C2433; --ink:#E5E9F2; --muted:#9CA6BB; --line:#283246; --line2:#3A4660;
  --accent:#FF5C9A; --accent-soft:#3A1828; --accent2:#9F93FF;
  --sym:#FF8A4C; --sym-soft:#3A2216; --para:#3CC8BE; --para-soft:#12302E;
  --tact:#6EA2FF; --pain:#FF8A4C; --sens:#6EA2FF; --mot:#3CC8BE; --inh:#B79BFF; --ca:#E6B35A; --ca-soft:#33280F;
  --ok:#4CC27A; --ok-soft:#14301F; --warn:#E6B35A; --bad:#FF6B5F; --bad-soft:#3A1715; --note-bg:#2B2614; --note-line:#4A3F17; --note-ink:#E8C55A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121B; --surface:#161C28; --surface2:#1C2433; --ink:#E5E9F2; --muted:#9CA6BB; --line:#283246; --line2:#3A4660;
  --accent:#FF5C9A; --accent-soft:#3A1828; --accent2:#9F93FF;
  --sym:#FF8A4C; --sym-soft:#3A2216; --para:#3CC8BE; --para-soft:#12302E;
  --tact:#6EA2FF; --pain:#FF8A4C; --sens:#6EA2FF; --mot:#3CC8BE; --inh:#B79BFF; --ca:#E6B35A; --ca-soft:#33280F;
  --ok:#4CC27A; --ok-soft:#14301F; --warn:#E6B35A; --bad:#FF6B5F; --bad-soft:#3A1715; --note-bg:#2B2614; --note-line:#4A3F17; --note-ink:#E8C55A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-disp);line-height:1.15;text-wrap:balance;margin:0}
.lbl{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* Coque */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none}
.brand b{font:800 19px var(--f-disp);display:block;letter-spacing:-.01em}
.brand small{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:var(--accent-soft)}
.nav .nm{font-size:14.5px;min-width:0}
.nav .hot{font:500 10px var(--f-mono);color:var(--accent);letter-spacing:.06em;display:block}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.navsep{margin-top:6px}
.main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wide{max-width:1000px}
.topbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:39}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
  .main{padding-top:18px}
}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:14.5px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:5px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* Accueil */
.hero{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.trace{width:100%;height:64px;display:block}
.trace path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.trace .base{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 5}
.lede{font-size:17.5px;color:var(--muted);max-width:62ch;margin:0}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.facts b{font:800 26px var(--f-disp);font-variant-numeric:tabular-nums}
.facts span{font-size:13.5px;color:var(--muted)}
@media (max-width:560px){.facts{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:21px}
.next{border-left:4px solid var(--accent)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.chcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.chcard:hover{border-color:var(--ink)}
.chcard h3{font-size:16.5px;font-weight:700}
.chcard .meta{display:flex;justify-content:space-between;font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chcard.hot{border-color:var(--accent)}
/* Chapitre */
.chhead{display:flex;flex-direction:column;gap:8px}
.chhead h1{font-size:clamp(28px,4.6vw,40px);font-weight:800;letter-spacing:-.015em}
.why{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:15px;margin:0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
@media (max-width:860px){.tabs{top:calc(57px + env(safe-area-inset-top,0px))}}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;font-weight:700;color:var(--muted);font-size:15px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font:500 11px var(--f-mono);margin-left:4px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:22px;font-weight:700;padding-top:6px}
.sec p,.sec li{max-width:68ch}
.sec ul,.sec ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
ol.chain{list-style:none;padding:0;counter-reset:c;gap:0}
ol.chain>li{counter-increment:c;position:relative;padding:0 0 12px 40px;border-left:2px solid var(--line);margin-left:13px}
ol.chain>li:last-child{border-left-color:transparent}
ol.chain>li::before{content:counter(c);position:absolute;left:-14px;top:0;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);color:var(--accent);font:700 13px var(--f-mono);display:grid;place-items:center}
ol.chain ul{margin-top:6px}
.tblwrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.t th,.t td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.t th{font:500 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
.t tr:last-child td{border-bottom:0}
.t th.sym{color:var(--sym)} .t th.para{color:var(--para)}
.t.eff td:first-child{font-weight:700;white-space:nowrap}
@media (max-width:560px){.t.eff td:first-child{white-space:normal}}
.callout{border:1px solid var(--accent);border-radius:10px;padding:10px 14px;background:var(--surface)}
.note{color:var(--muted);font-size:14px;margin:0}
.loop{background:var(--surface2);border-radius:10px;padding:10px 14px}
.pieges{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 18px}
.pieges h3{font-size:16px;color:var(--bad);margin-bottom:6px}
.pieges ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
/* Schémas */
.dg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dg h3{font-size:18px}
.dgbox{overflow-x:auto}
.dg svg{width:100%;height:auto;display:block;min-width:460px}
.fields svg{min-width:0}
.dg .b{fill:var(--surface2);stroke:var(--line2);stroke-width:1.5}
.dg .tx{fill:var(--ink);font:700 14px var(--f-body)}
.dg .sm{fill:var(--muted);font:13px var(--f-body)}
.dg .lv{fill:var(--muted);font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.dg .mut{fill:var(--muted)}
.dg .ln{fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.dg .ahd{fill:var(--muted)}
.dg .acc{stroke:var(--accent)} .dg .acc-t{fill:var(--accent)} .dg .acc2{stroke:var(--accent2)}
.dg .sens{stroke:var(--sens)} .dg .mot{stroke:var(--mot)} .dg .inh-l{stroke:var(--inh)} .dg .inh{fill:var(--inh);stroke:var(--inh)}
.dg .dash{stroke-dasharray:7 6}
.dg .v{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.dg .nt{fill:var(--accent)}
.dg .ch{fill:var(--ca-soft);stroke:var(--ca);stroke-width:1.5} .dg .ca{stroke:var(--ca)} .dg .ca-t{fill:var(--ca)}
.dg .rc{fill:var(--para-soft);stroke:var(--para);stroke-width:1.5}
.dg .mus{fill:var(--sym-soft)} .dg .fus{fill:var(--sens);stroke:var(--sens);fill-opacity:.25}
.dg .gg{fill:var(--surface);stroke:var(--ink)} .dg .mn{fill:var(--para-soft);stroke:var(--mot)}
.dg .cord{fill:var(--surface2)} .dg .astro{fill:var(--ca-soft)}
.dg .sym-l{stroke:var(--sym)} .dg .para-l{stroke:var(--para)} .dg .sym-f{fill:var(--sym);stroke:var(--sym)}
.dg .symb rect{fill:var(--sym-soft)} .dg .parab rect{fill:var(--para-soft)}
.dg .win{fill:var(--surface);stroke:var(--accent)}
.dg .mbm{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.dg .peak{fill:none;stroke:var(--accent);stroke-width:3}
.dg .mid{stroke:var(--line2);stroke-dasharray:4 5;stroke-width:1}
.dg .vp{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.dg .vp.tact{stroke:var(--tact)} .dg .vp.pain{stroke:var(--pain)}
.dg .vp.coll{stroke-width:2;stroke-dasharray:4 4}
.dg .vp.cut{stroke-opacity:.22;stroke-dasharray:3 6}
.dg .syn{fill:var(--ink)}
.dg .skin{fill:var(--sym-soft)}
.dg .xmark path{stroke:var(--bad);stroke-width:5;stroke-linecap:round;fill:none}
.dg .spk{stroke:var(--accent);stroke-width:2}
.dg .eye{fill:var(--surface)}
.dg .fq{fill:var(--para-soft);stroke:var(--para);stroke-width:1}
.dg .fq.lost{fill:var(--bad);fill-opacity:.55;stroke:var(--bad)}
.dg.st [data-k]{transition:opacity .25s}
.dg.st [data-k]:not(.on){opacity:.16}
.dg.st g.on .b{stroke:var(--accent);stroke-width:2.6}
.dg.st path.on.ln{stroke-width:3.4}
.steps{display:flex;flex-direction:column;gap:10px}
.stepnow{background:var(--surface2);border-radius:10px;padding:12px 14px;min-height:84px}
.stepnow .lbl{color:var(--accent)}
.stepnow b{display:block;font:700 17px var(--f-disp);margin:2px 0 4px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);cursor:pointer;font:700 12px var(--f-mono);color:var(--muted)}
.dots button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.dots button.done{border-color:var(--accent);color:var(--accent)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px;background:var(--surface2)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.sel{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;flex-wrap:wrap}
.sel select{border:1px solid var(--line2);border-radius:10px;background:var(--surface);padding:7px 10px;max-width:100%}
.slider{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.slider label{font-weight:700}
.slider input{flex:1;min-width:160px;accent-color:var(--accent)}
.slider output{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:4px;border-radius:3px;display:inline-block}
.sw.tact{background:var(--tact)} .sw.pain{background:var(--pain)}
.legend .dot{width:9px;height:9px;border-radius:50%;background:var(--ink);display:inline-block}
.verdict{background:var(--surface2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.verdict p{margin:0}
.pill{display:inline-block;font:500 11.5px var(--f-mono);letter-spacing:.04em;border-radius:999px;padding:2px 9px;margin-right:6px;color:#fff}
.pill.tact{background:var(--tact)} .pill.pain{background:var(--pain)}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:start}
.fields{display:flex;flex-direction:column;gap:12px}
.fields div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.fields svg{width:110px}
@media (max-width:640px){.vgrid{grid-template-columns:minmax(0,1fr)}.fields{flex-direction:row;flex-wrap:wrap;justify-content:center}}
.omap{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.org{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:default}
.org b{font-size:14.5px}
.ef{font-size:13.5px;border-radius:8px;padding:5px 8px;display:flex;gap:8px;align-items:baseline}
.ef span{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;flex:none;width:46px}
.ef.para{background:var(--para-soft)} .ef.para span{color:var(--para)}
.ef.sym{background:var(--sym-soft)} .ef.sym span{color:var(--sym)}
.ef i{font-style:normal;font-weight:700;color:var(--muted)}
/* Page blanche, annales */
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.task h3{font-size:17.5px;font-weight:700}
.task .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.tag{font:500 11.5px var(--f-mono);letter-spacing:.04em;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.real{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.mid{background:var(--ca-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.ctx{background:var(--surface2);border-radius:10px;padding:10px 14px;font-size:15px;margin:0}
textarea{width:100%;min-height:170px;border:1px solid var(--line2);border-radius:10px;background:var(--surface2);padding:12px 14px;line-height:1.55;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.reveal{border-top:1px dashed var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.bareme{display:flex;flex-direction:column;gap:6px}
.bitem{display:grid;grid-template-columns:26px minmax(0,1fr) 54px;gap:8px;align-items:start;padding:8px 10px;border-radius:10px;background:var(--surface2);cursor:pointer}
.bitem input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok)}
.bitem .p{font:500 12.5px var(--f-mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bitem.ok{background:var(--ok-soft)} .bitem.partiel{background:var(--ca-soft)}
.bitem .cm{grid-column:2/4;font-size:13.5px;color:var(--muted)}
.score{font:800 28px var(--f-disp);font-variant-numeric:tabular-nums}
.timer{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.timer.late{color:var(--bad)}
.ai{border:1px solid var(--accent2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.ai .lbl{color:var(--accent2)}
.rate{display:flex;flex-wrap:wrap;gap:8px}

sections:[
{h:"Structure fonctionnelle du neurone", html:`
<p>Un neurone a 4 zones fonctionnelles, dans le sens de circulation du message :</p>
<ul>
<li><b>Intégration</b> : dendrites et corps cellulaire reçoivent les potentiels post-synaptiques (PPS) ; ils se somment au <b>cône d'implantation de l'axone</b> (zone gâchette), où naît le potentiel d'action (PA) si le seuil est atteint.</li>
<li><b>Conduction</b> : le PA parcourt l'axone, à intensité constante. La <b>myéline</b> accélère la conduction (conduction saltatoire).</li>
<li><b>Transmission</b> : au bouton terminal, libération du neurotransmetteur (NT).</li>
</ul>
<p>Le PA obéit à la <b>loi du tout ou rien</b> : il naît ou ne naît pas, son amplitude ne varie pas. Ce qui est modulable, c'est la synapse.</p>`},
{h:"Transmission synaptique, étape par étape", html:`
<ol class="chain">
<li>Le <b>PA</b> arrive au bouton présynaptique et le <b>dépolarise</b>.</li>
<li>La dépolarisation ouvre des <b>canaux Ca²⁺ voltage-dépendants</b> : entrée de Ca²⁺ <b>extracellulaire</b> (gradient entrant).</li>
<li>Le Ca²⁺ déclenche la <b>fusion des vésicules</b> avec la membrane plasmique (exocytose) : le NT est libéré dans la <b>fente synaptique</b>.</li>
<li>Le NT se fixe sur des <b>récepteurs-canaux</b> post-synaptiques, qui laissent passer des ions.</li>
<li>Ce passage d'ions crée un <b>PPS</b>, positif ou négatif selon le NT. C'est un <b>potentiel gradué</b> (proportionnel à la quantité de NT).</li>
<li>Le NT est <b>retiré</b> de la fente : la transmission s'arrête.</li>
</ol>
<p><b>3 voies de retrait du NT</b> (chaque NT a sa propre gestion) :</p>
<ul>
<li><b>Recapture</b> dans le neurone ;</li>
<li><b>Dégradation</b> enzymatique ;</li>
<li><b>Capture par l'astrocyte</b>, qui le transforme en métabolite <b>inactif</b> sur le récepteur, puis le rend au neurone comme <b>précurseur</b> pour re-synthétiser le NT.</li>
</ul>`},
{h:"Neurotransmetteurs et neuromodulateurs", html:`
<table class="t"><thead><tr><th></th><th>Glutamate</th><th>GABA</th></tr></thead><tbody>
<tr><td>Rôle</td><td>Excitateur principal</td><td>Inhibiteur principal</td></tr>
<tr><td>PPS</td><td><b>Dépolarisant</b> (PPS excitateur)</td><td><b>Hyperpolarisant</b> (PPS inhibiteur)</td></tr>
<tr><td>Où</td><td colspan="2">Réseaux du SNC (et réflexes médullaires) : communication fine neurone à neurone</td></tr></tbody></table>
<p>Un neurone libère <b>l'un ou l'autre</b> selon son type, pas les deux.</p>
<p><b>Neuromodulateurs</b> : dopamine, sérotonine, noradrénaline, acétylcholine, histamine. Ils ne sont <b>pas forcément libérés dans une synapse</b> fine : libération <b>diffuse</b> sur une <b>population</b> de neurones. Ils modifient le fonctionnement du réseau (vigilance, vitesse de traitement) <b>sans changer la nature de l'analyse</b>, qui reste portée par glutamate et GABA.</p>
<p>Il existe aussi de nombreux autres neuromédiateurs (neuropeptides, lipides, gaz), connus mais sans usage pharmacologique à ce jour.</p>`},
{h:"Le réflexe rotulien (myotatique) : le circuit le plus simple", html:`
<p><b>Branche extenseur : monosynaptique, 2 neurones.</b></p>
<ol class="chain">
<li><b>Stimulus</b> : la percussion du tendon rotulien <b>étire</b> le quadriceps et donc le <b>fuseau neuromusculaire</b> (fibres intrafusales).</li>
<li><b>Transduction</b> : le stimulus physique devient électrique → <b>potentiel récepteur</b> (dépolarisation graduée) → si le <b>seuil</b> est atteint, <b>PA</b>.</li>
<li>Les PA sont conduits par le <b>neurone sensitif</b> (neurone en T, corps cellulaire dans le <b>ganglion rachidien</b>), qui entre dans la moelle par la racine dorsale.</li>
<li>Dans la <b>moelle</b>, il libère du <b>glutamate</b> sur le <b>motoneurone du quadriceps</b> : PPS excitateur → PA.</li>
<li>PA du motoneurone → jonction neuromusculaire (<b>ACh</b>, récepteurs nicotiniques) → <b>contraction du quadriceps</b> → extension de la jambe.</li>
</ol>
<p><b>Branche fléchisseur : innervation réciproque.</b> Une <b>collatérale</b> du neurone sensitif libère du glutamate sur un <b>interneurone inhibiteur</b> (dans la moelle), qui libère du <b>GABA</b> sur le <b>motoneurone du fléchisseur</b> : ce motoneurone est hyperpolarisé, le fléchisseur se relâche et ne s'oppose pas à l'extension.</p>
<p>C'est un <b>rétrocontrôle par voie nerveuse</b> : la détection (étirement) et la réponse (contraction) ont lieu dans le même muscle, qui revient à sa longueur initiale. Centre intégrateur : <b>L2-L4</b> (ronéo) ; la diapo indique l'arc <b>L4 – nerf fémoral</b>.</p>`},
{h:"Les 3 niveaux d'intégration", html:`
<p>Le système nerveux détecte et agit sur le monde, avec un traitement <b>hiérarchique</b> de plus en plus élaboré. Grâce aux <b>collatérales</b>, la même information est distribuée <b>en parallèle</b> aux 3 niveaux :</p>
<table class="t"><thead><tr><th>Niveau</th><th>Réponse</th><th>Exemple (choc sur le genou)</th></tr></thead><tbody>
<tr><td><b>Moelle épinière</b></td><td>Réflexe : <b>stéréotypé, automatique</b>, une seule réponse pour un stimulus</td><td>Étirement = contraction</td></tr>
<tr><td><b>Cerveau « inférieur »</b></td><td>Réponse <b>basique, non spécifique</b> : ↑ <b>vigilance</b> via les neuromodulateurs</td><td>« Un impact inattendu »</td></tr>
<tr><td><b>Cortex</b></td><td>Traitement <b>conscient</b> : analyse, mise en contexte, stratégie de réponse</td><td>« C'était léger, je peux me détendre »</td></tr></tbody></table>
<p>La jambe part <b>avant</b> la prise de conscience : le réflexe médullaire a le circuit le plus court. Les relais synaptiques sont les points où le message peut être <b>modulé</b>. Exemple caricatural : endormi, le cerveau fonctionne mais n'est plus sensible à l'extérieur.</p>`},
{h:"Organisation de l'encéphale", html:`
<p>Vue sagittale, de haut en bas :</p>
<ul>
<li><b>Cortex</b> plissé (augmente la surface de neurones). Le <b>sillon central</b> sépare le lobe <b>frontal</b> (en avant) du lobe <b>pariétal</b> (en arrière) ; puis lobe <b>occipital</b> ; le lobe <b>temporal</b> est latéral.</li>
<li><b>Gyrus cingulaire</b>, en croissant autour du <b>corps calleux</b> (axones reliant les 2 hémisphères).</li>
<li><b>Diencéphale</b> : thalamus et hypothalamus.</li>
<li><b>Tronc cérébral</b> : mésencéphale, métencéphale (pont), myélencéphale (bulbe), en continuité avec la <b>moelle épinière</b>.</li>
<li><b>Cervelet</b>, en arrière du tronc.</li>
</ul>
<p>Le cortex a 6 couches et des aires spécialisées (aires de Brodmann), mais des fonctions complexes émergent des interactions entre modules. La phrénologie (« bosse des maths ») est une pseudo-science : à comprendre, pas à apprendre.</p>`}
],

sections:[
{h:"Le schéma général d'une sensibilité", html:`
<p>Chaque modalité se décrit avec la même grille (c'est la structure des diapos « Résumé ») :</p>
<ol class="chain">
<li><b>Stimulus physico-chimique</b> : de quelle nature ? externe ou interne ? proche ou à distance ?</li>
<li><b>Transduction</b> : conversion en signal électrique par un récepteur cellulaire ou une structure spécialisée. Notions : <b>spécificité</b>, type de réponse, <b>adaptation</b>.</li>
<li><b>Conduction / voies sensorielles</b> : vitesse de conduction, trajet, convergence, <b>relais</b>.</li>
<li><b>Traitements et intégrations</b> : réflexes, projections sous-corticales et corticales.</li>
</ol>
<p>Les <b>relais</b> synaptiques sont les points où le signal peut être <b>modulé</b>, transmis ou arrêté : il faut savoir où ils sont.</p>`},
{h:"Potentiel récepteur et codage de l'intensité", html:`
<ul>
<li>Le début de la détection est toujours un <b>potentiel récepteur</b> : modification de la polarisation de la membrane, <b>proportionnelle à l'intensité du stimulus</b>. C'est un <b>potentiel gradué</b>.</li>
<li>Expérience de mécanotransduction : on appuie sur un neurone avec une pointe fine ; plus on appuie fort, plus la membrane se déforme et plus le courant enregistré est grand.</li>
<li>Si le potentiel récepteur atteint le <b>seuil</b>, il génère des <b>PA</b>. L'intensité est codée par la <b>fréquence</b> des PA : plus le stimulus est fort, plus il y a de PA.</li>
<li>À la synapse, la quantité de NT libérée dépend du nombre de PA : la réponse redevient graduée et donc <b>modulable</b>.</li>
</ul>`},
{h:"Réponses tonique et phasique", html:`
<p>On regarde la <b>réponse</b> du récepteur (le train de PA), pas le stimulus.</p>
<table class="t"><thead><tr><th>Tonique</th><th>Phasique</th></tr></thead><tbody>
<tr><td>Des PA <b>tant que le stimulus est présent</b>. La fréquence peut diminuer (<b>adaptation</b>) mais ne s'annule pas.</td><td>Des PA seulement aux <b>transitions</b> : quand le stimulus apparaît ou disparaît. Rien si le stimulus est stable.</td></tr>
<tr><td>Ex. : la fibre décharge tant que tu tiens ton sac.</td><td>Ex. : tu ne sens plus ta montre une fois mise.</td></tr></tbody></table>`},
{h:"Vitesse de conduction et types de fibres", html:`
<p>La vitesse dépend du <b>calibre</b> de l'axone et de sa <b>myélinisation</b> (conduction par sauts). Elle diffère selon la modalité :</p>
<table class="t"><thead><tr><th>Fibre</th><th>Myéline</th><th>Modalité</th></tr></thead><tbody>
<tr><td>Ia, II (Aα)</td><td>Fortement myélinisées, gros calibre</td><td>Proprioception (fuseau)</td></tr>
<tr><td>Aβ</td><td>Myélinisées</td><td>Tact</td></tr>
<tr><td>Aδ</td><td>Faiblement myélinisées</td><td>Nociception rapide, localisée (peau)</td></tr>
<tr><td>C</td><td>Non myélinisées</td><td>Nociception (partout sauf tissu nerveux), intéroception</td></tr></tbody></table>
<p class="note">La nomenclature détaillée des axones n'est pas à connaître (ronéo) ; retiens la logique calibre/myéline/vitesse.</p>`}
],

"Le potentiel récepteur est <b>gradué</b> ; le PA est <b>tout ou rien</b>. L'intensité est codée en <b>fréquence</b> de PA."

weight:"Comparé à la nociception en annale (4 pts). Latéralité des lésions : classique.",
diagrams:["voies"],
sections:[
{h:"Récepteurs du tact", html:`
<ul>
<li>Le tact (toucher <b>épicritique</b> = fin) intègre dès le départ l'information de <b>nombreux récepteurs</b> de la peau : récepteurs du <b>follicule pileux</b> et mécanorécepteurs de l'épiderme et du derme.</li>
<li>La peau se déforme : plus un récepteur est <b>superficiel</b>, moins il faut de stimulus pour l'activer.</li>
<li>Les fibres sont <b>hautement myélinisées</b> : on a besoin de comprendre vite ce qui se passe à proximité directe.</li>
<li>Certains récepteurs cutanés servent aussi à la <b>proprioception</b> (position du corps).</li>
<li><b>Stéréognosie</b> : reconnaître un objet par le toucher seul.</li>
</ul>`},
{h:"La voie lemniscale : 3 neurones, 2 relais", html:`
<ol class="chain">
<li><b>1er neurone : neurone en T</b>, corps cellulaire dans le <b>ganglion rachidien</b> (spinal). Il reçoit l'info en périphérie, entre par la <b>racine dorsale</b> et monte <b>sans relais</b> dans les <b>colonnes dorsales</b> (substance blanche), <b>du même côté</b>.</li>
<li><b>2e neurone</b> : dans les <b>noyaux des colonnes dorsales</b>, au <b>bulbe</b>. Son axone <b>croise la ligne médiane</b> : c'est la <b>décussation</b>, au niveau du bulbe. Il monte dans le <b>lemnisque médian</b>.</li>
<li><b>3e neurone</b> : dans le <b>thalamus</b> (relais final). Il projette sur le <b>cortex somesthésique primaire</b>, lobe <b>pariétal</b>, juste <b>derrière le sillon central</b>.</li>
</ol>
<p><b>Face</b> : même principe, mais le neurone en T a son corps cellulaire dans un ganglion du <b>nerf trijumeau (V)</b> ; le reste du trajet est identique.</p>
<p>Tout ce qui est sous le thalamus est <b>inconscient</b> ; la sensation devient <b>consciente au cortex</b>.</p>
<p><b>Collatérales</b> : vers la moelle (réflexes) et vers le <b>cervelet</b>. Au relais, <b>inhibition latérale</b> (diapo) : elle renforce le contraste spatial.</p>`},
{h:"Raisonner sur une lésion", html:`
<p>La décussation du tact a lieu dans le <b>bulbe</b>. Donc :</p>
<ul>
<li>Lésion <b>sous le bulbe</b> (moelle) : perte du tact <b>du même côté</b> que la lésion.</li>
<li>Lésion <b>au-dessus du bulbe</b> (tronc, thalamus, cortex) : perte <b>du côté opposé</b>.</li>
</ul>
<p>Le schéma interactif « Voies ascendantes » te laisse placer la lésion et voir ce qui est perdu.</p>`},
{h:"Dermatomes et homoncule sensitif", html:`
<ul>
<li><b>Dermatome</b> : segment de peau innervé par un nerf rachidien précis, défini par le <b>niveau médullaire</b> auquel il est rattaché (organisation <b>métamérique</b>, mise en place pendant le développement fœtal ; visible sur un corps courbé). Frontières nettes avec des zones de recouvrement. Intérêt <b>diagnostique</b> : localiser le niveau d'une lésion.</li>
<li><b>Homoncule sensitif</b> : projection <b>somatotopique</b> sur le cortex somesthésique primaire. Les zones les plus <b>innervées</b> (tête, lèvres, langue, bout des doigts) ont la plus grande surface corticale. Une lésion corticale fait perdre la sensibilité <b>consciente</b> de la région correspondante.</li>
</ul>`},
{h:"Résumé du tact (grille)", html:`
<table class="t"><tbody>
<tr><td><b>Stimulus</b></td><td>Physique : pression, vibration, déformation</td></tr>
<tr><td><b>Transduction</b></td><td>Récepteurs variés de l'épiderme, du derme, des follicules</td></tr>
<tr><td><b>Voies</b></td><td>Neurone en T (ganglion rachidien) → colonnes dorsales → noyaux des colonnes dorsales (bulbe) → décussation → lemnisque médian → thalamus → cortex. Collatérales : moelle, cervelet</td></tr>
<tr><td><b>Intégration</b></td><td>Réflexes médullaires, inhibition latérale, projection somatotopique sur le cortex somesthésique I</td></tr></tbody></table>`}
],
pieges:[
"Le <b>3e neurone est dans le thalamus</b> ; le cortex pariétal est la <b>destination</b>, pas un neurone de la voie.",
"Toujours localiser le 1er neurone : <b>ganglion rachidien</b> (neurone en T).",
"Décussation du tact : <b>bulbe</b>. Lésion médullaire = même côté ; au-dessus du bulbe = côté opposé."
],

["Où a lieu la décussation de la voie du tact ?","Au bulbe, à la sortie des noyaux des colonnes dorsales (2e neurone)."],

["Qu'est-ce que la stéréognosie ?","La reconnaissance d'un objet par le toucher seul."],

]

{h:"Les 3 types de récepteurs proprioceptifs", html:`
<p>La proprioception rend <b>consciente</b> la position des segments de membres les uns par rapport aux autres, même assis. Elle naît de la <b>convergence</b> de nombreux récepteurs :</p>
<table class="t"><thead><tr><th>Récepteur</th><th>Disposition</th><th>Information</th></tr></thead><tbody>
<tr><td><b>Fuseau neuromusculaire</b> (fibres intrafusales)</td><td>En <b>parallèle</b> des fibres extrafusales, même orientation</td><td><b>Longueur</b> du muscle (étirement)</td></tr>
<tr><td><b>Organe tendineux</b> (de Golgi)</td><td>En <b>série</b>, dans le tendon, entre les fibres de collagène</td><td><b>Tension</b> musculaire (compression des fibres nerveuses quand le muscle tire sur le tendon)</td></tr>
<tr><td><b>Récepteurs cutanés et articulaires</b> (type Ruffini, Pacini ; fascias, ligaments)</td><td>Autour des articulations</td><td><b>Position et mouvement</b> de l'articulation (étirement de la peau au coude)</td></tr></tbody></table>
<p>Les <b>fibres extrafusales</b>, plus nombreuses, assurent la contraction et la force ; les <b>intrafusales</b> détectent la longueur. Le fuseau a un système d'ajustement connecté aux motoneurones.</p>`},
{h:"Les voies courtes : réflexes proprioceptifs", html:`
<ul>
<li><b>Réflexe myotatique</b> : un étirement brusque (marteau) étire la fibre intrafusale → réflexe de <b>correction</b> : <b>contraction</b> du muscle étiré qui rétablit sa longueur. Ex. : réflexe rotulien.</li>
<li><b>Réflexe tendineux</b> : une <b>tension excessive</b> sur le tendon active l'organe tendineux → <b>inhibition</b> réflexe → <b>relâchement</b> du muscle. Il fonctionne à l'inverse du myotatique et <b>protège</b> le muscle de la rupture.</li>
<li>3 grands types de réflexes : <b>myotatiques</b>, <b>cutanés</b> (tact) et <b>tendineux</b>.</li>
</ul>
<p><b>Intérêt clinique</b> : grâce à l'organisation <b>métamérique</b>, chaque réflexe teste un segment. Réflexe absent = défaut de la branche <b>sensitive</b>, de la branche <b>motrice</b> ou du <b>segment médullaire</b> (rotulien : L2-L4).</p>`},
{h:"Voies centrales et résumé", html:`
<ul>
<li>Même voie que le tact : neurone en T (ganglion rachidien) → <b>colonnes dorsales</b> → noyaux → <b>lemnisque médian</b> → thalamus → <b>cortex somesthésique primaire</b>.</li>
<li>En plus : des <b>collatérales vers le cervelet</b> (faisceaux <b>spinocérébelleux</b>), centre intégrateur essentiel de la <b>motricité</b> et de la coordination.</li>
<li>Fibres <b>myélinisées</b> de gros calibre (Ia, II).</li>
</ul>
<p>Pendant un mouvement, <b>le corps devient le stimulateur</b> de ses propres propriocepteurs : la contraction est elle-même source d'information (attraper une bouteille tend le tendon).</p>`}
],
pieges:[
"Fuseau = <b>longueur</b>, en <b>parallèle</b> ; organe tendineux = <b>tension</b>, en <b>série</b>.",
"Myotatique : stimulation → <b>contraction</b>. Tendineux : stimulation → <b>relâchement</b>.",
"La proprioception a une destination en plus du tact : le <b>cervelet</b>."

sections:[
{h:"Détection : des nocicepteurs polymodaux à haut seuil", html:`
<p>La nociception est la <b>détection d'un signal de lésion</b> tissulaire. Les nocicepteurs sont des <b>terminaisons libres</b> dans les tissus, directement exposées aux conditions tissulaires.</p>
<ul>
<li><b>Polymodalité</b> : une même fibre détecte plusieurs stimuli qui signent une lésion. Récepteurs : <b>canaux ioniques</b> sensibles à la chaleur, aux protons (acidose), à la <b>capsaïcine</b> ; <b>récepteurs à l'ATP</b> (libéré par les cellules lésées) ; <b>récepteurs aux protons</b> ; <b>mécanorécepteurs</b> activés par des pressions intenses (coup de marteau).</li>
<li><b>Haut seuil</b> : il faut un stimulus d'intensité <b>supérieure aux niveaux physiologiques</b> (acidité, température, ATP).</li>
<li>Activés, ils génèrent des PA transmis au SNC.</li>
</ul>`},
{h:"Nociception vs tact : la différence de réponse", html:`
<table class="t"><thead><tr><th></th><th>Tact fin</th><th>Nociception</th></tr></thead><tbody>
<tr><td>Stimulus</td><td>Faible intensité</td><td>Haute intensité (lésion)</td></tr>
<tr><td>Seuil</td><td>Bas</td><td><b>Haut</b>, mais modulable (sensibilisation)</td></tr>
<tr><td>Spécificité</td><td>Récepteurs spécialisés</td><td><b>Polymodale</b></td></tr>
<tr><td>Adaptation</td><td>Fréquence de PA qui <b>décroît</b> (on s'habitue aux vêtements)</td><td><b>Pas ou très peu d'adaptation</b> : tant qu'il y a un stimulus, il y a des PA</td></tr>
<tr><td>Fibres</td><td>Hautement myélinisées</td><td><b>Aδ</b> faiblement myélinisées, <b>C</b> non myélinisées</td></tr>
<tr><td>Rétroaction locale</td><td>Non</td><td><b>Réflexe d'axone</b> : libération de substance P</td></tr></tbody></table>`},
{h:"Fibres nociceptives", html:`
<ul>
<li><b>Aδ</b> : faiblement myélinisées, dans la <b>peau</b>, <b>rapides</b> ; douleur rapide et <b>localisée</b>, réaction immédiate face à un danger externe.</li>
<li><b>C</b> : <b>non myélinisées</b>, présentes <b>partout</b>, y compris la peau, <b>sauf le tissu nerveux central</b>. Les méninges sont innervées, pas le cerveau : on peut opérer le cerveau d'un patient conscient une fois les méninges anesthésiées.</li>
</ul>
<p><b>But</b> : déclencher une réaction de <b>retrait ou d'évitement</b> pour limiter les dommages et protéger l'organisme.</p>`},
{h:"Sensibilisation : un haut seuil qui peut devenir bas", html:`
<ul>
<li>Des récepteurs membranaires <b>RCPG et RTK</b> ne dépolarisent pas la fibre eux-mêmes, mais <b>modulent les récepteurs-canaux</b> : ils <b>abaissent leur seuil</b>.</li>
<li>Condition : présence de leurs <b>ligands</b>, qui signent l'<b>inflammation</b> (ex. <b>prostaglandines</b>).</li>
<li>Résultat : un stimulus plus faible suffit à déclencher des PA. Le nocicepteur à haut seuil devient un récepteur <b>à bas seuil</b>.</li>
<li>Exemple : <b>coup de soleil</b>. Les UV causent une inflammation ; une tape dans le dos devient douloureuse.</li>
</ul>`},
{h:"Réflexe d'axone et cercle vicieux inflammatoire", html:`
<ul>
<li>Les fibres sont très <b>ramifiées</b> dans le territoire. Un PA né dans une branche remonte vers le SNC mais peut aussi repartir <b>de façon rétrograde</b> dans les autres branches : c'est le <b>réflexe d'axone</b>.</li>
<li>Les fibres contiennent des vésicules de molécules <b>pro-inflammatoires</b>, dont la <b>substance P</b>, libérées par exocytose quand la fibre est activée.</li>
<li>La substance P cible les <b>mastocytes</b> (sentinelles des tissus), qui <b>dégranulent</b> : <b>histamine</b> (vasoactive, passage des cellules immunitaires), <b>cytokines</b> (recrutement), <b>protéases</b> (dégradation de la matrice), <b>NGF</b> (ligand de TrkA), <b>leucotriènes et prostaglandines</b>.</li>
</ul>
<p class="loop"><b>Cercle vicieux</b> : lésion → nocicepteurs activés (PA) → réflexe d'axone, libération de substance P → mastocytes → médiateurs inflammatoires → <b>sensibilisation</b> des nocicepteurs → douleur accrue.</p>
<p>Utilité : un <b>halo</b> d'activation autour de la lésion recrute les cellules immunitaires qui circonscrivent un éventuel pathogène.</p>`},
{h:"Voie courte : le réflexe de flexion et d'extension croisée", html:`
<p>Exemple : marcher sur une punaise. Les cellules lésées libèrent de l'<b>ATP</b>, détecté par le nocicepteur (branche périphérique du neurone en T, corps cellulaire dans le ganglion rachidien). L'info entre par la <b>corne postérieure</b> et diffuse à un <b>réseau d'interneurones</b>.</p>
<ul>
<li>Côté stimulé : <b>flexion</b> du membre (s'écarter du danger).</li>
<li>Côté opposé : <b>extension</b> (maintien de l'équilibre postural).</li>
</ul>
<p>Réflexe <b>polysynaptique</b>, <b>multi-étagé</b> et <b>bilatéral</b>. Automatique mais <b>modulable</b> par les contrôles centraux. Il existe aussi des réflexes végétatifs.</p>`},
{h:"Projections centrales et matrice de la douleur", html:`
<ol class="chain">
<li><b>1er neurone</b> : nocicepteur, neurone en T (ganglion rachidien ; face : nerf trijumeau).</li>
<li><b>2e neurone</b> : dans la <b>corne postérieure</b> de la moelle. Son axone <b>décusse dans la moelle</b> et monte dans le <b>quadrant antérolatéral</b> de la substance blanche.</li>
<li>Faisceaux ascendants : <b>spinothalamique</b>, spino-réticulo-thalamique, spino-ponto-amygdalien, spino-hypothalamique.</li>
<li><b>Collatérales</b> vers le tronc : <b>formation réticulée</b> (éveil cortical, vigilance) et <b>substance grise périaqueducale (PAG)</b>, centre de <b>modulation descendante</b> de la douleur.</li>
<li><b>3e neurone</b> : <b>thalamus</b>, puis projection sur plusieurs aires corticales : la <b>matrice de la douleur</b>.</li>
</ol>
<table class="t"><thead><tr><th>Aire</th><th>Rôle</th></tr></thead><tbody>
<tr><td><b>Cortex somatosensoriel</b></td><td>Analyse <b>discriminative</b>, neutre : localisation, nature (brûlure, piqûre), intensité</td></tr>
<tr><td><b>Cortex insulaire</b></td><td><b>Valence émotionnelle</b> : gênant, désagréable, insupportable</td></tr>
<tr><td><b>Cortex cingulaire</b></td><td>Dimension <b>motivationnelle et comportementale</b> : agir pour éviter, ou supporter</td></tr></tbody></table>
<p>La douleur est donc <b>sensation + émotion</b>. Rôle physiologique : induire une réaction ; rôle pathologique si elle devient chronique.</p>`},
{h:"Projections sous-corticales", html:`
<ul>
<li>La <b>formation réticulée</b> intègre l'<b>intensité</b> et la propage de façon <b>non spécifique</b> au cortex : <b>éveil cortical</b>, préparation à réagir. On gifle une personne inconsciente : la douleur active la formation réticulée qui réveille le cortex.</li>
<li>D'autres noyaux (noyau du tractus solitaire, noyau parabrachial, amygdale, hypothalamus) produisent des <b>réactions neuro-humorales et végétatives</b> (hormones, viscères). Les noms ne sont pas à retenir.</li>
<li>Hiérarchie : moelle → tronc → cortex ; à chaque étage, le message peut être <b>modulé ou inhibé</b> aux synapses.</li>
<li><b>Chirurgie</b> : supprimer la conscience ne suffit pas. Sous anesthésie, le tronc traitait encore la douleur (FC très haute, complications). D'où l'usage de molécules qui bloquent la douleur <b>en amont</b>, avant le cortex.</li>
</ul>`},
{h:"Douleurs projetées", html:`
<p>Au <b>2e neurone</b> (corne postérieure), il y a une <b>convergence</b> des afférences <b>cutanées et viscérales</b> sur un même neurone. Le cortex qui reçoit cette voie l'interprète comme une lésion <b>cutanée</b>.</p>
<p>Exemple : l'<b>infarctus du myocarde</b> donne une douleur de brûlure au <b>bras gauche</b>. Chaque organe a sa zone cutanée de projection caractéristique.</p>`},
{h:"Résumé de la nociception (grille)", html:`
<table class="t"><tbody>
<tr><td><b>Stimulus</b></td><td>Mécanique, thermique, chimique, signant une lésion</td></tr>
<tr><td><b>Transduction</b></td><td>Récepteurs mono- ou polymodaux, à haut seuil mais modulable (sensibilisation), peu d'adaptation, réflexe d'axone</td></tr>
<tr><td><b>Voies</b></td><td>Fibres Aδ et C ; neurone en T → 2e neurone de la corne postérieure → décussation médullaire → quadrant antérolatéral → tronc (FR, PAG) → thalamus</td></tr>
<tr><td><b>Intégration</b></td><td>Réflexes médullaires polysynaptiques ; projections sous-corticales (éveil, végétatif) ; matrice corticale ; systèmes de modulation</td></tr></tbody></table>`}

{h:"Intéroception : percevoir l'état interne du corps", html:`
<ul>
<li>Ressemble à la nociception, avec une différence majeure : récepteurs <b>à bas seuil</b> (nociception = haut seuil).</li>
<li>Signaux <b>thermiques</b> (activité métabolique), <b>mécaniques</b> et <b>chimiques</b>.</li>
<li>Fibres : les plus petites myélinisées et non myélinisées ; elles empruntent des <b>nerfs crâniens</b> : <b>trijumeau (V)</b>, <b>glossopharyngien (IX)</b> et surtout <b>vague (X)</b> ; et des racines dorsales.</li>
<li>Elles se terminent dans le <b>noyau du tractus solitaire</b> (bulbe), puis noyau parabrachial (pont) → <b>thalamus</b> (complexe ventropostérieur) → <b>cortex insulaire</b>.</li>
<li>Le <b>cortex insulaire</b> assure la représentation <b>consciente</b> des sensations internes. Sensation floue, qui contribue aux <b>émotions corporelles</b> (plénitude après un repas).</li>
<li>Un même organe a une sensibilité intéroceptive <b>et</b> nociceptive : une contraction intense (vomissement) active des voies nociceptives.</li>
<li>Elle alimente des <b>réflexes</b> et des coordinations <b>homéostatiques</b> (ex. baroréflexe, avec le nerf IX).</li>
</ul>`},
{h:"La barrière hémato-encéphalique (BHE)", html:`
<p>Le SNC est isolé du sang. Barrières au niveau des <b>capillaires</b> et des cellules épithéliales des <b>plexus choroïdes</b>. La BHE comprend :</p>
<ul><li><b>Cellules endothéliales</b> à <b>jonctions très serrées</b> ;</li><li>une <b>lame basale</b> ;</li><li>des <b>pieds astrocytaires</b> autour des capillaires.</li></ul>
<p>Elle empêche le passage libre des composants sanguins et protège le cerveau des variations du milieu interne.</p>`},
{h:"Les organes circumventriculaires (CVO) sensitifs", html:`
<ul>
<li>Zones <b>dépourvues de BHE</b>, autour des cavités centrales (ventricules) : <b>organe subfornical (SFO)</b>, <b>organe vasculaire de la lame terminale (OVLT)</b>, <b>area postrema</b>.</li>
<li>Endothélium <b>fenêtré</b>, pas de pieds astrocytaires : le <b>plasma touche le tissu nerveux</b>.</li>
<li>Leurs récepteurs détectent : la <b>composition du plasma</b> (osmolarité, Ca²⁺), des <b>hormones</b> (angiotensine II, ADH, hormones digestives), des <b>médiateurs inflammatoires</b> (substance P, prostaglandines, interleukines, LPS).</li>
<li>Exemple : la <b>fièvre</b>. Les prostaglandines circulantes d'une infection sont détectées par les CVO, qui déclenchent l'adaptation thermique.</li>
</ul>`}
],

{h:"Ce que mobilise un geste : l'exemple de l'écriture", html:`
<ul><li>Une activité de <b>posture inconsciente</b> (rester assis) ;</li><li>des activités <b>fines</b> dirigées vers un objectif (doigts, yeux qui suivent la ligne) ;</li><li>des mouvements <b>proximaux d'accompagnement</b> (le bras).</li></ul>
<p>Toute activité motrice naît d'une <b>intention</b> et d'un objectif.</p>`},
{h:"L'effecteur final : l'unité motrice", html:`
<ul>
<li><b>Unité motrice</b> = un <b>motoneurone</b> + les <b>fibres musculaires</b> qu'il innerve (l'axone se ramifie). Plus petite entité que le système moteur peut commander.</li>
<li>Synapse <b>cholinergique</b> : la jonction neuromusculaire libère de l'<b>acétylcholine</b>, qui se fixe sur des récepteurs <b>nicotiniques</b> (récepteurs-canaux) → <b>dépolarisation</b> de la fibre, propagée à toute la fibre → contraction.</li>
<li>Le muscle squelettique n'a <b>aucune activité de base</b> : sa contraction dépend <b>strictement</b> de la commande nerveuse.</li>
</ul>`},
{h:"Organisation dans la moelle", html:`
<ul>
<li>Motoneurones dans la <b>corne antérieure</b> (substance grise), organisation <b>somatotopique</b> : <b>médian → muscles proximaux</b> (posture, soutien) ; <b>latéral → muscles distaux</b> (gestes fins). C'est un « homoncule moteur » médullaire.</li>
<li><b>Système latéral</b> → motoneurones latéraux (distaux) : surtout le <b>faisceau corticospinal latéral</b> (et rubrospinal).</li>
<li><b>Système ventromédian</b> → motoneurones médians (proximaux, posture) : faisceaux <b>réticulospinal</b>, vestibulospinal, tectospinal et <b>corticospinal ventral</b>. À retenir surtout : réticulospinal et corticospinal.</li>
</ul>`},
{h:"Voie principale : corticospinale, dite pyramidale", html:`
<ul>
<li><b>Projection directe</b> du cortex vers la moelle.</li>
<li>Départ : <b>cortex moteur primaire</b>, lobe <b>frontal</b>, juste <b>en avant du sillon central</b>.</li>
<li>L'axone descend dans le tronc : <b>mésencéphale → pont → bulbe</b>.</li>
<li>Au bulbe, la majorité des fibres <b>croisent</b> : <b>décussation pyramidale</b> → faisceau <b>corticospinal latéral</b>. Le croisement forme un triangle sur la face antérieure du bulbe (les <b>pyramides</b>), d'où le nom.</li>
<li>Synapse sur les <b>motoneurones</b> de la moelle. Elle porte les <b>gestes fins, précis</b> (l'objectif du mouvement). Voie <b>directe croisée</b>.</li>
<li>Pour la tête : <b>voie corticobulbaire</b>, vers les noyaux des <b>nerfs crâniens</b> du tronc.</li>
</ul>
<p><b>Expérience historique</b> : section des pyramides chez le singe (voies extrapyramidales intactes). Il marche et grimpe encore, mais perd la <b>pince pouce-index</b> : il amène la nourriture à la bouche avec tout le bras. Il ne reste que les mouvements d'accompagnement.</p>`},
{h:"Voies secondaires dites extrapyramidales", html:`
<p>Connexion <b>indirecte</b> : relais dans des <b>noyaux du tronc cérébral</b>, qui projettent sur les motoneurones (système ventromédian). Elles <b>accompagnent</b> le mouvement : posture, équilibre.</p>
<ul>
<li><b>Formation réticulée → faisceau réticulospinal</b> : étendue sur les 3 étages du tronc, sans noyaux bien définis ; reçoit le cortex (pré)moteur. <b>Maintien de la posture</b> (tonus) et <b>régulation proactive</b>. Expérience : au signal sonore, tirer sur une manette ; le <b>mollet s'active avant le biceps</b> (anticipation), et en cas de déséquilibre une traction réflexe ajuste les contractions.</li>
<li><b>Noyaux vestibulaires → faisceau vestibulospinal</b> : multimodaux (vestibule, vision, moelle) ; stabilité de la tête, équilibre, posture, fixation du regard.</li>
<li><b>Colliculus supérieur (tectum) → faisceau tectospinal</b> : orientation de la tête et des yeux, alimentée par la vision (poursuite oculaire).</li>
</ul>`},
{h:"Origine des commandes : les cortex moteurs", html:`
<p>Analogie du sprinter « <b>Attention, prêt, partez !</b> », de l'avant vers l'arrière du lobe frontal :</p>
<table class="t"><thead><tr><th>Cortex</th><th>Rôle</th><th>Sprinter</th></tr></thead><tbody>
<tr><td><b>Préfrontal</b> (associatif)</td><td><b>Motivation</b> de l'action</td><td>« Attention » : envie de gagner</td></tr>
<tr><td><b>Prémoteur</b></td><td>Élaboration de la <b>stratégie</b>, séquence mentale</td><td>« Prêt » : il mentalise sa course</td></tr>
<tr><td><b>Moteur primaire</b></td><td><b>Exécution</b> du programme, projection sur les voies motrices</td><td>« Partez »</td></tr></tbody></table>
<ul>
<li>Le cortex moteur primaire a un <b>homoncule moteur</b> : la <b>main</b> et la région <b>oro-laryngée</b> (langue, bouche, larynx) sont surreprésentées. Nous sommes des êtres <b>manuels et communicants</b>.</li>
<li><b>Miroir de la sensibilité</b> : en sensibilité, le cortex primaire est la cible de la périphérie et envoie vers les autres cortex (vers l'arrière, cortex pariétal postérieur). En motricité, le cortex primaire reçoit des autres cortex (depuis l'avant) et envoie vers la périphérie.</li>
<li><b>Sensibilité au service du mouvement</b> : cortex somatosensoriel I (je touche le pupitre) → cortex <b>pariétal postérieur</b> associatif (je suis à côté du pupitre) → cortex préfrontal et prémoteur. Le cerveau doit connaître la <b>position initiale</b> pour construire le programme.</li>
<li><b>Boucles de régulation</b> : noyaux gris centraux et cervelet.</li>
</ul>`}
],

cards:[
["Qu'est-ce qu'une unité motrice ?","Un motoneurone et l'ensemble des fibres musculaires qu'il innerve."],
["NT et récepteur de la jonction neuromusculaire ?","Acétylcholine sur récepteurs nicotiniques (récepteurs-canaux) → dépolarisation de la fibre."],
["Organisation somatotopique de la corne antérieure ?","Médian = muscles proximaux (posture) ; latéral = muscles distaux (gestes fins)."],

["Zones les plus représentées sur l'homoncule moteur ?","La main et la région oro-laryngée (langue, bouche, larynx)."],
["Voie motrice de la tête ?","La voie corticobulbaire, vers les noyaux des nerfs crâniens du tronc."],

]

sections:[
{h:"Somatique vs autonome : les différences fonctionnelles", html:`
<table class="t"><thead><tr><th></th><th>Système nerveux somatique</th><th>Système nerveux autonome</th></tr></thead><tbody>
<tr><td>Cibles</td><td>Un seul type : <b>muscle strié squelettique</b></td><td><b>Muscle cardiaque, muscles lisses, glandes</b> (endocrines, exocrines), dans de nombreux organes</td></tr>
<tr><td>Activité de base de la cible</td><td><b>Aucune</b> : la contraction dépend strictement de la commande</td><td><b>Automatisme</b> propre : le SNA n'est pas indispensable au fonctionnement de base</td></tr>
<tr><td>Effet de la commande</td><td>Toujours une <b>contraction</b></td><td><b>Augmentation ou diminution</b> de l'activité existante : il <b>module</b></td></tr></tbody></table>`},
{h:"Somatique vs autonome : les différences anatomiques", html:`
<table class="t"><thead><tr><th></th><th>Somatique</th><th>Autonome</th></tr></thead><tbody>
<tr><td>Connexion</td><td><b>Directe</b> : le neurone du SNC va jusqu'à la cible</td><td><b>Indirecte</b> : <b>2 neurones</b>, relais dans un <b>ganglion</b> (pré- puis post-ganglionnaire)</td></tr>
<tr><td>Fibres</td><td>Fortement myélinisées, rapides</td><td>Moins rapides : la cible n'attend pas la commande pour fonctionner</td></tr>
<tr><td>NT final</td><td><b>ACh</b> → récepteurs <b>nicotiniques</b></td><td>Ganglion : <b>ACh → nicotiniques</b>. Cible : <b>NA → adrénergiques</b> (α1, α2, β1, β2, β3) ou <b>ACh → muscariniques</b></td></tr></tbody></table>
<p>Récepteurs adrénergiques et muscariniques = <b>RCPG</b> : pas de dépolarisation directe. Selon le récepteur en face du NT, la réponse diffère : c'est ce qui permet la <b>variété des réponses</b> des cibles.</p>
<p><b>Particularité sympathique</b> : des cellules de même origine embryonnaire deviennent soit des neurones, soit des <b>cellules endocrines</b> (médullosurrénale) ; les deux font partie du système sympathique.</p>`},
{h:"Ce qui définit sympathique et parasympathique : l'anatomie", html:`
<div class="callout">Le prof insiste : ce n'est <b>pas</b> le NT qui définit les deux branches. Le sympathique utilise <b>préférentiellement</b> la NA au niveau terminal, le parasympathique <b>préférentiellement</b> l'ACh. La <b>définition est anatomique</b>.</div>
<table class="t"><thead><tr><th></th><th class="sym">Sympathique (orthosympathique)</th><th class="para">Parasympathique</th></tr></thead><tbody>
<tr><td>Neurone central</td><td>Moelle épinière, <b>corne latérale</b>, segments <b>thoraco-lombaires T1 à L2</b></td><td><b>Cranio-sacré</b> : noyaux de certains <b>nerfs crâniens</b> (tronc cérébral) et moelle <b>sacrée</b></td></tr>
<tr><td>Ganglions</td><td><b>Paravertébraux</b> (chaîne le long de toute la colonne) et <b>prévertébraux</b> (en avant des vertèbres, de l'aorte, dans l'abdomen)</td><td><b>Au niveau ou à proximité de la viscère</b> cible</td></tr>
<tr><td>Grand nerf</td><td>—</td><td><b>Nerf vague (X)</b> : part du tronc, descend dans le thorax jusqu'à l'estomac et l'intestin</td></tr></tbody></table>`},
{h:"Trajet des fibres sympathiques", html:`
<ol class="chain">
<li>Neurone <b>pré-ganglionnaire</b> dans la <b>corne latérale</b> (T1-L2). Sa fibre sort par la <b>racine ventrale</b>, avec les fibres motrices somatiques.</li>
<li>Elle quitte la racine par un <b>rameau communicant</b> et rejoint la <b>chaîne paravertébrale</b>.</li>
<li>Trois scénarios selon la cible :
<ul>
<li><b>Cible au même étage</b> (ex. un segment cutané) : relais <b>cholinergique</b> dans le ganglion paravertébral de cet étage ; la fibre <b>post-ganglionnaire</b> rejoint la racine spinale du même niveau.</li>
<li><b>Cible à un autre étage</b> (ex. la tête) : la fibre <b>monte (ou descend) dans la chaîne</b>, fait son relais au ganglion approprié, puis repart par la racine de cet étage. La chaîne dépasse T1-L2 et couvre les régions cervicale et sacrée.</li>
<li><b>Viscères abdominaux</b> : la fibre <b>traverse</b> le ganglion paravertébral <b>sans synapse</b> et fait son relais dans un ganglion <b>prévertébral</b>, en avant de l'aorte.</li>
</ul></li>
</ol>
<p>La chaîne paravertébrale sert surtout à atteindre la <b>tête</b> et le <b>thorax</b> ; les ganglions prévertébraux, les viscères <b>abdominaux et pelviens</b>. Une interruption de la chaîne empêche le sympathique d'atteindre les cibles en aval.</p>
<p class="note">Application directe : le <b>ganglion cervical supérieur</b> est le ganglion le plus haut de cette chaîne ; c'est le relais vers la face (annale Claude Bernard-Horner).</p>`},
{h:"Cibles : partagées ou exclusives", html:`
<p>Le plus souvent, sympathique et parasympathique ont les <b>mêmes cibles</b>, avec des effets opposés. Mais :</p>
<table class="t"><thead><tr><th class="sym">Exclusivement sympathiques</th><th class="para">Particularités parasympathiques</th></tr></thead><tbody>
<tr><td>
<ul><li>La <b>majorité des vaisseaux</b> (sauf organes génitaux et glandes salivaires)</li>
<li><b>Adipocytes</b></li><li><b>Glandes sudoripares</b> et muscles <b>pilo-érecteurs</b></li>
<li><b>Myocarde contractile</b> (le tissu nodal a une double innervation)</li>
<li><b>Glandes surrénales</b></li><li>Capsule de la <b>rate</b> (réservoir de plaquettes)</li></ul></td>
<td><ul><li>Viscères : par le <b>nerf vague</b> ; tête : autres nerfs crâniens ; organes pelviens : nerfs <b>sacrés</b>.</li>
<li><b>Tube digestif</b> : il a son propre <b>système nerveux entérique</b> (autonomie). Le parasympathique agit comme <b>modulateur</b> de ce réseau.</li>
<li><b>Vaisseaux</b> : l'ACh est vasodilatatrice mais il n'y a <b>pas d'innervation parasympathique directe</b> des vaisseaux, sauf <b>organes génitaux</b> (érection, principe du Viagra) et <b>glandes salivaires</b>.</li>
<li><b>Cœur</b> : nœud sinusal et conduction seulement.</li></ul></td></tr></tbody></table>`},

{h:"Une valeur régulée, avec deux horizons", html:`
<ul>
<li>À <b>court terme</b> : la PA est régulée pour les besoins impératifs de <b>2 organes nobles</b>, le <b>cœur et le cerveau</b>. On garde une PA élevée quitte à <b>hypoperfuser</b> d'autres territoires (girafe : PA élevée parce que le cerveau est très haut au-dessus du cœur).</li>

</ul>`},
{h:"Les détecteurs", html:`
<ul>
<li><b>Barorécepteurs</b> (les plus importants) : fibres sensitives sensibles à l'<b>étirement</b> de la paroi artérielle, au <b>sinus carotidien</b> (bifurcation carotidienne, entre cœur et cerveau). Info portée par le <b>nerf IX</b> (glossopharyngien) : branche de l'<b>intéroception</b>. Zone de détection <b>50 à 200 mmHg</b>, qui inclut la PA normale (120/80) : <b>surveillance continue</b>, le message change dès qu'on s'écarte.</li>
<li><b>Volorécepteurs</b> : cellules sensibles à l'étirement dans le compartiment <b>basse pression</b> (oreillette droite). Ils renseignent sur le <b>remplissage vasculaire</b>, indépendamment de la PA.</li>
<li><b>Détection centrale</b> : le cerveau (tronc) détecte sa propre perfusion ; s'il est hypoperfusé, il augmente massivement la PA.</li>
<li><b>Chémorécepteurs</b> (crosse aortique) : sensibles à la PA et à la <b>PaO₂</b>, ils interviennent en cas d'<b>hypoxémie</b> (baisse de PaO₂ artérielle ; à distinguer de l'hypoxie tissulaire).</li>
</ul>`},
{h:"Le baroréflexe", html:`
<p>Boucle <b>réflexe végétative</b> : détection (barorécepteurs) → <b>centre cardio-régulateur du tronc cérébral</b> → réponse motrice par le SNA. Il fonctionne <b>dans les deux sens</b>.</p>
<p><b>Si la PA augmente</b> : plus de PA sur le nerf IX → le tronc :</p>
<ul>
<li><b>ralentit le cœur</b> : ↑ parasympathique (frein) et ↓ sympathique (accélérateur) ;</li>
<li><b>diminue la force</b> de contraction : ↓ sympathique → ↓ volume d'éjection ;</li>
<li><b>dilate les vaisseaux</b> : ↓ sympathique → ↓ résistances.</li>
</ul>
<p>Si la PA baisse : l'inverse. Seul le sympathique innerve le myocarde contractile et la majorité des vaisseaux.</p>`},
{h:"Tonus de base", html:`
<ul>
<li>Le tronc cérébral contient un <b>générateur de tonus</b> : à PA normale, il existe déjà une activité sympathique et parasympathique.</li>
<li><b>Cœur</b> : tonus de base <b>parasympathique</b>. FC de repos 60-80 bpm, inférieure au rythme intrinsèque du nœud sinusal. Chez le <b>transplanté</b> (cœur dénervé) : <b>~110 bpm</b>.</li>

</ul>`},
{h:"Variations normales de la PA", html:`
<ul>
<li><b>Rythme circadien</b> : plus élevée en activité, plus basse pendant le sommeil (récupération).</li>

<li><b>Exercice</b> : sang dirigé vers les muscles, le cœur et le cerveau ; puis interaction avec la <b>thermorégulation</b> qui rouvre la peau (sudation). ↑ <b>retour veineux</b> par la pompe musculaire (veines à valves comprimées) et la <b>pompe respiratoire</b> (dépression thoracique) → ↑ précharge → ↑ volume d'éjection.</li>
</ul>`},
{h:"Relais hormonal : SRAA et peptides natriurétiques", html:`
<ul>
<li><b>SRAA</b> : l'<b>appareil juxtaglomérulaire</b> du rein sécrète la <b>rénine</b> si la <b>perfusion rénale baisse</b> ou si l'<b>activité sympathique augmente</b> (β1). Rénine : angiotensinogène (foie) → angiotensine I ; <b>enzyme de conversion</b> (capillaires pulmonaires) → <b>angiotensine II</b>.</li>
<li>Effets de l'Ang II : <b>vasoconstriction</b> directe ; ↑ libération de NA ; action centrale (inhibe le centre cardio-inhibiteur, pour éviter une bradycardie réflexe) ; ↑ <b>ADH</b> (réabsorption d'eau) ; ↑ réabsorption de <b>Na⁺</b> (tube proximal) ; ↑ <b>aldostérone</b> (réabsorption de Na⁺ sur un autre segment). Na⁺ réabsorbé → l'eau suit → ↑ volémie → ↑ PA.</li>
<li>Transition : d'abord forte activation sympathique, puis la réabsorption rénale reconstitue la volémie et l'activation sympathique diminue.</li>
<li><b>Peptides natriurétiques</b> (ANP des oreillettes, BNP) : sécrétés quand le cœur est <b>distendu</b> ; ↑ <b>natriurèse</b>, inhibent le SRAA, vasodilatateurs → ↓ volémie → ↓ PA.</li>
<li><b>Hiérarchie temporelle</b> : nerveux (secondes) → hormonal → <b>rénal</b> (long terme, le plus puissant, sans limite théorique).</li>
</ul>`}

{h:"La rétine", html:`
<ul>
<li>Plusieurs couches de neurones, avec <b>1 entrée</b> (photorécepteurs) et <b>1 sortie</b> (cellules <b>ganglionnaires</b>, dont les axones convergent pour former le <b>nerf optique</b>). Réseau local de <b>prétraitement</b>.</li>

{h:"Phototransduction", html:`
<ol class="chain">
<li>Le segment externe contient des <b>disques</b> empilés portant les pigments visuels.</li>
<li>Pigment = <b>opsine</b> + <b>rétinal</b>. Un photon <b>isomérise</b> le rétinal de <b>cis en trans</b> : il s'étend et <b>déforme</b> l'opsine.</li>
<li>Cette déformation déclenche une <b>signalisation</b> (non exigible) qui change l'activité de la cellule ; le message traverse la rétine jusqu'aux cellules ganglionnaires puis le nerf optique.</li>
</ol>
<ul>
<li>Le rétinal est commun à tous ; c'est l'<b>opsine</b> qui change entre cônes et bâtonnets et règle la sensibilité aux couleurs.</li>
<li>Le rétinal dérive de la <b>vitamine A</b> : une carence peut rendre aveugle.</li>
<li>Après isomérisation, le couple n'est plus fonctionnel : les disques usagés sont <b>exocytés vers l'épithélium pigmentaire</b>, qui reconvertit le trans-rétinal en <b>cis-rétinal</b> et le rend aux photorécepteurs. Une atteinte visuelle peut donc venir du détecteur ou du <b>support</b>.</li>
</ul>`},
{h:"Voies courtes (inconscientes)", html:`
<p>Après le <b>chiasma</b>, des collatérales vont vers des noyaux qui n'analysent que l'<b>intensité lumineuse</b> ou le contraste, pas l'image :</p>

<li>Noyau du <b>tronc cérébral</b> : réflexes <b>végétatifs</b> (SNA) de la <b>pupille</b> (trop de lumière → myosis ; peu de lumière → mydriase) et de l'<b>accommodation</b> du cristallin (par le contraste, comme l'autofocus d'un appareil photo).</li>

{h:"Voie longue (consciente) vers le cortex occipital", dg:"inversion", html:`
<ol class="chain">
<li>Le <b>cristallin</b> (lentille biconvexe) <b>inverse</b> l'image : gauche ↔ droite, haut ↔ bas. Un objet du champ visuel gauche se projette sur la <b>rétine nasale gauche</b> et la <b>rétine temporale droite</b>.</li>
<li><b>Nerfs optiques</b> → <b>chiasma optique</b> : <b>croisement partiel</b>. Seules les fibres de la <b>rétine nasale</b> croisent. Ainsi, un même point de l'espace (vu par les 2 yeux) se retrouve dans <b>un seul</b> hémisphère.</li>
<li><b>Tractus optique</b> → <b>thalamus</b> (corps genouillé latéral), dernier relais.</li>
<li><b>Radiations optiques</b> : l'info se sépare puis reconverge. Rétine <b>supérieure</b> → radiations <b>supérieures</b> (passent par le cortex <b>pariétal</b>) ; rétine <b>inférieure</b> → radiations <b>inférieures</b> (cortex <b>temporal</b>).</li>
<li><b>Cortex strié</b>, lobe <b>occipital</b> : projection <b>topique</b>, « précision photographique », image analysée mais pas encore interprétée.</li>
</ol>
<p>Résultat : le champ visuel <b>gauche</b> est traité par l'hémisphère <b>droit</b>. Des lésions localisées donnent des déficits précis (AVC pariétal droit). Le simulateur de lésions (onglet Schémas) applique cette logique ; le schéma ci-dessous montre l'inversion et la mise au point.</p>
<p><strong>Faire le lien entre l'inversion haut/bas et les radiations.</strong> Le cristallin inverse aussi le haut et le bas. Un objet situé en <b>haut</b> du champ visuel arrive donc sur la rétine <b>inférieure</b>, et un objet en <b>bas</b> arrive sur la rétine <b>supérieure</b>. Le chiasma ne croise que gauche/droite : le haut et le bas ne sont pas croisés. Ils se séparent seulement après le thalamus, dans les radiations :</p>
<ul><li>bas du champ → rétine supérieure → radiations <b>supérieures</b>, par le lobe <b>pariétal</b> ;</li><li>haut du champ → rétine inférieure → radiations <b>inférieures</b>, par le lobe <b>temporal</b>.</li></ul>
<p>Conséquence : une lésion des radiations supérieures (pariétal) fait perdre le <b>bas</b> du champ ; une lésion des radiations inférieures (temporal) fait perdre le <b>haut</b>. Comme on est après le chiasma, c'est du côté <b>opposé</b> à la lésion (AVC pariétal droit : perte en bas à gauche). Vue 3 du schéma ci-dessous.</p>`},

<li>À la pointe des cils, des <b>canaux ioniques mécanosensibles</b>, reliés d'un cil à l'autre par des liens.</li>
<li>Quand les cils se plient, la <b>traction</b> du lien <b>ouvre</b> le canal.</li>
<li>Entrée de <b>K⁺</b> (gradient entrant, car l'endolymphe est plus riche en K⁺ que la cellule) → <b>dépolarisation</b>. Ici c'est le K⁺, et non le Na⁺, qui dépolarise.</li>

</ol>
<p>Le même mécanisme donne des sensations différentes (son ou mouvement) selon l'<b>environnement</b> de la cellule.</p>`},

{h:"La cochlée : audition", html:`
<ol class="chain">
<li>L'oreille transforme l'onde <b>aérienne</b> en vibration <b>mécanique</b> (tympan, osselets) puis en onde <b>liquidienne</b> (cochlée).</li>
<li>L'étrier pousse la <b>fenêtre ovale</b> (vestibulaire), à l'entrée de la <b>rampe vestibulaire</b>.</li>
<li>L'onde <b>monte</b> la rampe vestibulaire jusqu'au sommet de la spirale (<b>apex</b>), puis <b>redescend</b> par la <b>rampe tympanique</b> et se <b>dissipe</b> sur la <b>fenêtre ronde</b> (tympanique, mobile) : pas d'écho. Les rampes contiennent un liquide extracellulaire, <b>pas l'endolymphe</b>.</li>
<li>Entre les deux rampes : l'<b>organe spiral</b>, siège de la <b>transduction</b>. Les cellules ciliées sont prises entre la <b>membrane basilaire</b> (<b>mobile</b>) et la <b>membrane tectoriale</b> (<b>fixe</b>).</li>
<li>L'onde déplace la membrane basilaire, qui pousse les cils contre la tectoriale : <b>cisaillement</b> → ouverture des canaux → entrée de K⁺ → dépolarisation → message nerveux.</li>
</ol>
<p><b>Tonotopie</b> : une seule zone de la membrane basilaire vibre selon la fréquence. <b>Base</b> : sons <b>aigus</b> (hautes fréquences). <b>Apex</b> : sons <b>graves</b>. L'<b>endroit</b> qui vibre code la <b>hauteur</b> du son.</p>
<p><b>Fragilité</b> : les cils ne se renouvellent pas. Une stimulation trop intense (concerts, écouteurs) les arrache : perte <b>irréversible</b>. La fenêtre est perméable : ce qui atteint l'oreille moyenne (médicaments) peut passer dans l'oreille interne.</p>`},

<li>Conséquence diagnostique : une <b>surdité d'une seule oreille</b> est d'origine <b>périphérique</b>, pas centrale.</li>
<li>Puis relais thalamique et <b>cortex auditif primaire</b>, lobe <b>temporal</b> : analyse consciente et compréhension.</li>

DIAG.codage = {title:"Codage : intensité, tonique et phasique", kind:"custom",
render(root){
  root.innerHTML=`<div class="ctrl"><div class="seg" role="group" aria-label="Type de réponse"><button data-m="t" class="on">Tonique</button><button data-m="a">Tonique adaptante</button><button data-m="p">Phasique</button></div>
  <div class="slider in"><label for="intens">Intensité du stimulus</label><input id="intens" type="range" min="1" max="10" value="5"><output id="intO"></output></div></div>
  <div class="dgbox"><svg viewBox="0 0 640 260" role="img" aria-label="Trains de potentiels d'action"><g id="cg"></g></svg></div>
  <p class="note" id="cgN"></p>`;
  let mode="t"; const inp=root.querySelector('#intens');
  function draw(){
    const I=+inp.value; root.querySelector('#intO').textContent=I+" / 10";
    const x0=60,x1=620,on=150,off=480;
    let h=`<text class="lv" x="8" y="40">Stimulus</text><text class="lv" x="8" y="120">Pot. récepteur</text><text class="lv" x="8" y="210">PA</text>`;
    h+=`<path class="ln acc" d="M${x0} 50 H ${on} V ${50-I*2.6} H ${off} V 50 H ${x1}"/>`;
    let rp=`M${x0} 130 H ${on}`;
    for(let x=on;x<=off;x+=6){let a=I*5.5; if(mode==="a") a*=0.45+0.55*Math.exp(-(x-on)/90); if(mode==="p") a*=Math.exp(-(x-on)/22); rp+=` L ${x} ${130-a}`;}
    if(mode==="p"){for(let x=off;x<=off+60;x+=6){rp+=` L ${x} ${130-I*4*Math.exp(-(x-off)/20)}`;}}
    rp+=` L ${off+(mode==="p"?60:6)} 130 H ${x1}`;
    h+=`<path class="ln sens" d="${rp}"/><line class="mid" x1="${x0}" y1="${130-14}" x2="${x1}" y2="${130-14}"/><text class="sm" x="${x1}" y="${130-18}" text-anchor="end">seuil</text>`;
    h+=`<line class="ln" x1="${x0}" y1="226" x2="${x1}" y2="226"/>`;
    const spikes=[];
    if(mode==="p"){const n=Math.max(1,Math.round(I/2.5));for(let i=0;i<n;i++){spikes.push(on+4+i*9);spikes.push(off+4+i*9);}}
    else{let x=on+4;while(x<off){spikes.push(x);let isi=70/I*1.6; if(mode==="a") isi*= 1+ (x-on)/110; x+=Math.max(isi,6);}}
    spikes.forEach(x=>h+=`<path class="spk" d="M${x} 226 V 186"/>`);
    root.querySelector('#cg').innerHTML=h;
    root.querySelector('#cgN').textContent = mode==="p" ? "Phasique : des PA seulement quand le stimulus apparaît et disparaît. Ex. : tu ne sens plus ta montre." : (mode==="a" ? "Tonique adaptante : des PA tant que le stimulus dure, mais leur fréquence diminue. Ex. : on s'habitue aux vêtements (tact). La nociception, elle, ne s'adapte pas." : "Tonique : des PA tant que le stimulus dure. Plus le stimulus est intense, plus le potentiel récepteur (gradué) est grand et plus la fréquence de PA est élevée.");
  }
  root.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;root.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));draw();});

}};

  om.onclick=e=>{const b=e.target.closest('.org');if(!b||mode!=="quiz")return;const i=+b.dataset.i;shown.has(i)?shown.delete(i):shown.add(i);draw();};
  root.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;shown.clear();root.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));draw();});
  draw();
}};

DIAG.inversion = {title:"Inversion de l'image et mise au point", kind:"custom",
render(root){
  root.innerHTML=`<div class="ctrl"><div class="seg" role="group" aria-label="Vue"><button data-v="profil" class="on">1 · Mise au point (de profil)</button><button data-v="dessus">2 · Gauche / droite (vu de dessus)</button><button data-v="hautbas">3 · Haut / bas (radiations)</button></div></div><div class="invBody"></div>`;
