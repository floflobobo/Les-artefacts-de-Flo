<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Chinois Lù</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one app column (max 560px) — sticky stats bar, winding lesson path, fixed bottom tabs, full-screen lesson overlay */
:root{
  --paper:#f2f5f2; --surface:#ffffff; --sunk:#e7ece8; --ink:#15201b; --muted:#5a6962; --line:#d6dfd9;
  --jade:#12735a; --jade-ink:#ffffff; --jade-soft:#d9eee4; --seal:#c23f2b;
  --good:#1b874a; --good-soft:#dbf1e2; --bad:#bf3636; --bad-soft:#f8dfdc; --gold:#b9770b; --gold-soft:#f6e8cc;
  --f-han:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-brush:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  --f-ui:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1412; --surface:#17201c; --sunk:#1f2a25; --ink:#e6eee9; --muted:#93a39b; --line:#2b3732;
  --jade:#46c095; --jade-ink:#06231a; --jade-soft:#163a2d; --seal:#e0644d;
  --good:#4cc47e; --good-soft:#153826; --bad:#ef6c6c; --bad-soft:#3d1c1c; --gold:#e6ae47; --gold-soft:#3a2d12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1412; --surface:#17201c; --sunk:#1f2a25; --ink:#e6eee9; --muted:#93a39b; --line:#2b3732;
  --jade:#46c095; --jade-ink:#06231a; --jade-soft:#163a2d; --seal:#e0644d;
  --good:#4cc47e; --good-soft:#153826; --bad:#ef6c6c; --bad-soft:#3d1c1c; --gold:#e6ae47; --gold-soft:#3a2d12;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.han{font-family:var(--f-han);font-weight:500}
.pin{font-family:var(--f-ui);font-weight:500;color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.seal{width:38px;height:38px;border-radius:8px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--f-brush);font-size:27px;line-height:1;flex:none;transform:rotate(-3deg)}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-size:17px;letter-spacing:.01em}
.brand small{color:var(--muted);font-size:12px}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:16px;height:16px;flex:none}
.chip.fire{color:var(--gold)}
.chip.sync{font-weight:600;color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}

/* views */
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.view{padding-block:18px 24px}
h2{font-size:22px;margin:0 0 4px;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px}

/* goal card */
.goal{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:22px}
.ring{--p:0;width:52px;height:52px;border-radius:50%;flex:none;background:conic-gradient(var(--jade) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.goal p{margin:0}
.goal .t{font-weight:700}
.goal .m{color:var(--muted);font-size:13px}
.goal .btn{margin-left:auto}

/* path */
.sec{margin:28px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec:first-of-type{margin-top:4px}
.sec h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--jade)}
.sec span{color:var(--muted);font-size:13px}
.sec::after{content:"";flex:1;height:1px;background:var(--line);min-width:20px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;position:relative}
.node .c{width:78px;height:78px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-family:var(--f-han);font-size:26px;font-weight:700;box-shadow:0 5px 0 var(--line);transition:transform .12s}
.node .c.sm{font-size:21px}
.node:active .c{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.node.done .c{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--jade) 60%,#000)}
.node.next .c{border-color:var(--jade);border-width:4px;color:var(--jade)}
.node .lbl{font-weight:700;font-size:13.5px;text-align:center;line-height:1.25}
.node .meta{font-size:12px;color:var(--muted);margin-top:-4px}
.node .bubble{position:absolute;top:-30px;background:var(--jade);color:var(--jade-ink);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:8px;animation:bob 1.8s ease-in-out infinite}
.node .bubble::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--jade)}
.node.next{margin-top:22px}
@keyframes bob{50%{transform:translateY(-3px)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:800;letter-spacing:.02em;background:var(--jade);color:var(--jade-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--jade) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--jade) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--jade-soft);color:var(--jade)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.big{width:76px;height:76px;border-radius:20px}
.icon-btn.big svg{width:36px;height:36px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.tab .g{font-family:var(--f-han);font-size:21px;line-height:1.1}
.tab[aria-selected="true"]{color:var(--jade);background:var(--jade-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--seal);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* panels & lists */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px;margin:14px 0}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
.row .h{font-family:var(--f-han);font-size:24px;min-width:48px}
.row .h.long{font-size:17px;min-width:0}
.row .tx{min-width:0}
.row .tx b{display:block;font-weight:600}
.row .tx span{color:var(--muted);font-size:13px}
.row .due{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lvl{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--line)}
.lvl.l1{background:var(--gold)}.lvl.l2{background:var(--jade)}.lvl.l3{background:var(--good)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .han{font-size:48px;color:var(--line);display:block;margin-bottom:6px}

.radgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.rad{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.rad .han{font-size:34px;display:block;line-height:1.2}
.rad small{display:block;font-size:12px;color:var(--muted);line-height:1.25}
.rad .n{font-size:11px;color:var(--jade);font-weight:700;margin-top:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3{margin:0 0 2px;font-size:20px}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions .btn{flex:1}
.wl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wl span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.wl span .han{font-size:18px;margin-right:6px}

/* overlay (lesson & review) */
.overlay{position:fixed;inset:0;z-index:15;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ol-head{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:600px;width:100%;margin:0 auto}
.ol-head .x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ol-head .x svg{width:22px;height:22px}
.pbar{flex:1;height:14px;background:var(--sunk);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--jade);border-radius:8px;transition:width .3s}
.ol-head .cnt{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ol-body{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.ol-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--jade)}
.q{font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:center}
.stage .han{font-size:76px;line-height:1.15}
.stage .han.mid{font-size:52px}
.stage .han.long{font-size:30px;line-height:1.45}
.stage .pin{font-size:20px}
.stage .fr{font-size:18px;font-weight:600}
.stage .row2{display:flex;gap:10px;margin-top:4px}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.part .han{font-size:34px;line-height:1}
.part p{margin:0;font-size:14px}
.part .k{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;color:var(--jade);background:var(--jade-soft);border-radius:6px;padding:1px 7px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 12px;font-weight:600;font-size:16px;box-shadow:0 3px 0 var(--line);min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;position:relative;min-width:0;overflow-wrap:anywhere}
.opt .n{position:absolute;top:6px;left:8px;font-size:11px;color:var(--muted);font-weight:700}
.opt .han{font-size:30px}
.opt .han.long{font-size:19px}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.ol-foot{border-top:1px solid var(--line);background:var(--surface);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ol-foot .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ol-foot.good{background:var(--good-soft);border-color:var(--good)}
.ol-foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.ol-foot.good .btn{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.ol-foot.bad .btn{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.fb{display:flex;gap:12px;align-items:center}
.fb b{font-size:18px}
.ol-foot.good .fb b{color:var(--good)}
.ol-foot.bad .fb b{color:var(--bad)}
.fb .ans{font-size:14px}
.fb .ans .han{font-size:20px;margin-right:6px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border-radius:12px;padding:10px 4px;font-weight:800;font-size:13px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:1px}
.rate button small{font-weight:600;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.rate .r0{color:var(--bad)}.rate .r1{color:var(--gold)}.rate .r2{color:var(--jade)}.rate .r3{color:var(--good)}
.end{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:20px}
.end .seal{width:96px;height:96px;font-size:64px;border-radius:18px}
.end h2{font-size:26px}
.endk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:6px}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
.built{min-height:72px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 10px;align-items:center}
.built.right{border-color:var(--good)}.built.wrong{border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{display:flex;flex-direction:column;align-items:center;padding:7px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 3px 0 var(--line);min-width:48px}
.tile .han{font-size:24px;line-height:1.25}
.tile small{font-size:12px;color:var(--muted);line-height:1.2}
.tile.used{visibility:hidden}
.tile:disabled{cursor:default}
.pinbtn{font-size:13px;font-weight:700;color:var(--jade);padding:0 12px;border-radius:12px;background:var(--jade-soft);min-height:44px}
.warn{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink)}
.warn b{display:block;color:var(--gold);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.exbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.exbox .han{font-size:22px}
.exbox .pin{font-size:14px}
.partrow{border-top:1px solid var(--line);padding:10px 0}
.partrow .pl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.partrow.ok .pl{color:var(--good)}.partrow.cur .pl{color:var(--jade)}
.partrow .wl{margin-top:6px}
.ol-foot .warn{font-size:13px}
@media (max-width:380px){.opt{font-size:14.5px}.stage .han{font-size:64px}.chip.sync span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="seal" aria-hidden="true">路</div>
  <div class="brand"><b>Lù</b><small>Chinois pour ton stage</small></div>
  <div class="stats">
    <span class="chip fire" title="Série de jours"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5-1.5 5.2-1.5 7.6 0 1.4 1 2.4 2.3 2.4 1.5 0 2.4-1.2 2.2-3 2.2 1.6 3.5 4.1 3.5 6.6C18.5 19.4 15.6 22 12 22s-6.5-2.6-6.5-6.4C5.5 10 10.7 7.6 12 2z"/></svg><span id="streak">0</span></span>
    <button class="chip" id="soundBtn" title="Tester le son" aria-label="Tester le son"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z"/><path d="M15.5 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Son</button>
    <span class="chip sync" id="sync" title="Sauvegarde"><i class="dot" id="syncdot"></i><span id="synctx">Local</span></span>
  </div>
</div></header>

<main>
  <section class="view wrap" id="v-path"></section>
  <section class="view wrap" id="v-review" hidden></section>
  <section class="view wrap" id="v-deck" hidden></section>
  <section class="view wrap" id="v-keys" hidden></section>
</main>

<nav class="tabs" role="tablist"><div class="wrap">
  <button class="tab" role="tab" data-v="path" aria-selected="true"><span class="g">路</span>Parcours</button>
  <button class="tab" role="tab" data-v="review"><span class="g">记</span>Réviser<span class="badge" id="duebadge" hidden>0</span></button>
  <button class="tab" role="tab" data-v="deck"><span class="g">卡</span>Mes cartes</button>
  <button class="tab" role="tab" data-v="keys"><span class="g">部</span>Les clés</button>
</div></nav>

const PUNCT=/^[，。！？、：；]$/;
function parseSent(raw,p,f,alt){
  const ht=raw.trim().split(/\s+/);
  const pt=p.trim().split(/\s+/).map(x=>x.replace(/[.,!?;:…]/g,'')).filter(Boolean);
  let wi=0;
  const toks=ht.map(t=>PUNCT.test(t)?{h:t,punct:true}:{h:t,p:pt[wi++]||''});
  if(wi!==pt.length) console.warn('pinyin mal aligné :',raw);
  const key=ht.filter(t=>!PUNCT.test(t)).join('');
  const alts=alt?[alt.trim().split(/\s+/).filter(t=>!PUNCT.test(t)).join('')]:[];
  return {h:ht.join(''),p:p.trim(),f:f.trim(),toks,key,alts};
}
const UNITS = RAW.map(u=>{
  const kind=u.kind||'word';
  const items=u.lines.trim().split('\n').map(l=>{
    const [h,p,f,x]=l.trim().split('|');
    if(kind==='phrase'){const s=parseSent(h,p,f,x);return {...s,id:s.h,say:s.h,kind,unit:u.id}}
    return {id:(kind==='rad'?'r:':'')+h,h,p,f,say:x||h,kind,unit:u.id};
  });
  const sents=(SENTS[u.id]||'').trim().split('\n').filter(Boolean).map(l=>{
    const [h,p,f,a]=l.trim().split('|'); const s=parseSent(h,p,f,a);
    return {...s,id:'s:'+s.h,say:s.h,kind:'sent',unit:u.id};
  });
  const size=kind==='word'?4:3, n=items.length, k=Math.ceil(n/size), parts=[]; let i=0;
  for(let j=0;j<k;j++){const len=Math.floor(n/k)+(j<n%k?1:0);parts.push(items.slice(i,i+len));i+=len}
  return {...u,kind,items,sents,parts};
});
const ITEMS={}; UNITS.forEach(u=>u.items.forEach(it=>{ITEMS[it.id]=it}));
const ALLSENTS=UNITS.flatMap(u=>[...u.sents,...(u.kind==='phrase'?u.items:[])]);
const RADS = UNITS.filter(u=>u.kind==='rad').flatMap(u=>u.items);
const RADBY = Object.fromEntries(RADS.map(r=>[r.h,r]));
function exampleFor(it){
  if(it.kind!=='word') return null;
  const c=UNITS.flatMap(u=>u.sents).filter(s=>s.toks.some(t=>t.h===it.h));
  return c.length?c[0]:(UNITS.flatMap(u=>u.sents).find(s=>s.key.includes(it.h))||null);
}

function fmtIn(ms){

  if(ms<DAY) return Math.round(ms/HOUR)+' h';
  const d=Math.round(ms/DAY);
  return d<45? d+' j' : Math.round(d/30)+' mois';
}

let zhVoice=null, voiceWarned=false;
function pickVoice(){
  try{const vs=speechSynthesis.getVoices();
    zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang)&&!/HK|TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;}catch(e){}
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let curUtt=null, lastAudioErr='';
function speak(text,slow){
  if(!('speechSynthesis' in window)){ lastAudioErr='API absente'; if(!voiceWarned){toast('L’audio n’est pas disponible ici : touche le bouton Son en haut pour le diagnostic');voiceWarned=true} return; }
  try{
    const ss=window.speechSynthesis;
    if(!zhVoice) pickVoice();
    const go=()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='zh-CN'; if(zhVoice) u.voice=zhVoice; u.rate=slow?0.6:0.9; u.volume=1;
      u.onerror=e=>{lastAudioErr=e.error||'erreur'; if(e.error!=='interrupted'&&e.error!=='canceled') toast('Son impossible ('+lastAudioErr+') : touche Son en haut')};
      u.onstart=()=>{lastAudioErr=''};
      curUtt=u; /* keep a reference: Chrome drops unreferenced utterances */
      try{ss.resume()}catch(e){}
      ss.speak(u);
    };
    if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,80)} else go();
    if(!zhVoice&&!voiceWarned){voiceWarned=true;setTimeout(()=>{pickVoice();if(!zhVoice)toast('Aucune voix chinoise trouvée sur cet appareil : touche Son en haut')},900)}
  }catch(e){lastAudioErr=String(e&&e.message||e)}
}

async function pushCloud(){
  if(!dbRef) return;
  if(saving){again=true;return}
  saving=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)));setSync('cloud')}
  catch(e){ if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){dbRef=null;setSync('local')}
    else if(e&&e.code==='unavailable'){setTimeout(pushCloud,2500+Math.random()*1500)} }
  saving=false;
  if(again){again=false;pushCloud()}
}
async function initCloud(){
  setSync('wait');
  for(let k=0;k<20&&!(window.claude&&window.claude.use);k++) await sleep(150);
  if(!(window.claude&&window.claude.use)){setSync('local');return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  if(!db||!user){setSync('local');return}
  let id=null; try{id=await user.id()}catch(e){}
  if(!id){setSync('local');return}
  try{
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    dbRef=ref;
    if(snap.exists){
      const remote=Object.assign(fresh(),snap.data());
      if((remote.updated||0)>=(S.updated||0)){S=JSON.parse(JSON.stringify(remote));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};renderAll()}
      else pushCloud();
    } else if(S.updated) pushCloud();
    setSync('cloud');
  }catch(e){dbRef=null;setSync('local')}
}

function newCard(){return {due:Date.now()+20*HOUR,ivl:0,ease:2.5,reps:0,lapses:0,added:Date.now()}}
function schedule(c,q){
  const now=Date.now();
  if(q===0){c.lapses++;c.ease=Math.max(1.3,c.ease-0.2);c.ivl=0;c.due=now+10*MIN;return c}
  let ivl;
  if(c.ivl<1) ivl= q===3?4 : q===2?1 : 0.5;
  else if(q===1) ivl=Math.max(1,c.ivl*1.2);
  else if(q===2) ivl=c.ivl*c.ease;
  else ivl=c.ivl*c.ease*1.3;
  if(q===1)c.ease=Math.max(1.3,c.ease-0.15);
  if(q===3)c.ease=c.ease+0.15;
  c.ivl=Math.round(ivl*10)/10; c.reps++; c.due=now+c.ivl*DAY;
  return c;
}

const TONES={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
const MARK={}; for(const [b,s] of Object.entries(TONES))[...s].forEach((c,i)=>MARK[c]=[b,i]);
function toneVariants(p){
  const ch=[...p],out=new Set();
  ch.forEach((c,i)=>{if(!MARK[c])return;const[b,t]=MARK[c];for(let k=0;k<4;k++){if(k===t)continue;const cp=ch.slice();cp[i]=TONES[b][k];out.add(cp.join(''))}});
  out.delete(p); return [...out];
}
function radOf(it){
  const c=[...it.h].filter(ch=>CHARS[ch]&&CHARS[ch][1]&&RADBY[CHARS[ch][1]]);
  return c.length?pick(c):null;
}
function exTypes(it){
  if(it.kind==='rad') return ['meaning','reverse'];
  if(it.kind==='phrase'||it.kind==='sent') return ['smean','build','dict'];
  const t=['meaning','pinyin','listen','reverse'];
  if(toneVariants(it.p).length>=3) t.push('tone');
  if(radOf(it)) t.push('radical');
  return t;
}

function distract(it,n,key){
  const seen=new Set([key(it)]),out=[];
  const pool=(it.kind==='sent'||it.kind==='phrase')?ALLSENTS:Object.values(ITEMS).filter(x=>x.kind===it.kind);
  const kn=x=>KNOWN.has(x.id), same=pool.filter(x=>x.unit===it.unit);
  const order=[...shuffle(same.filter(kn)),...shuffle(pool.filter(kn)),...shuffle(same),...shuffle(pool)];
  for(const x of order){const k=key(x);if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length===n)break}
  return out;
}

function makeEx(it,type){
  const ex={type,it};
  if(type==='meaning'){
    ex.kicker=it.kind==='rad'?'Lire une clé':'Lecture';

    ex.opts=shuffle([{html:it.f,ok:true,x:it},...distract(it,3,x=>x.f).map(x=>({html:x.f,x}))]);

    ex.kicker='Lecture'; ex.q='Comment se lit ce mot ?';
    ex.stage=`<div class="han ${it.h.length>1?'mid':''}">${it.h}</div>`;
    const tv=shuffle(toneVariants(it.p)).slice(0,1);
    const others=distract(it,3-tv.length,x=>x.p.toLowerCase());
    ex.opts=shuffle([{html:it.p,ok:true,x:it},...tv.map(p=>({html:p})),...others.map(x=>({html:x.p,x}))]);
  } else if(type==='listen'){
    ex.kicker='Écoute'; ex.q='Quel mot entends-tu ?';
    ex.stage=`<div class="row2">${sayBtns(true)}</div>`;
    ex.opts=shuffle([{html:hanOpt(it),ok:true,x:it},...distract(it,3,x=>strip(x.p)).map(x=>({html:hanOpt(x),x}))]);
    ex.autoplay=true;
  } else if(type==='tone'){
    ex.kicker='Les tons'; ex.q='Écoute bien : quelle est la bonne prononciation ?';
    ex.stage=`<div class="han ${it.h.length>1?'mid':''}">${it.h}</div><div class="row2">${sayBtns()}</div>`;
    ex.opts=shuffle([{html:it.p,ok:true,x:it},...shuffle(toneVariants(it.p)).slice(0,3).map(p=>({html:p}))]);
    ex.autoplay=true;
  } else if(type==='reverse'){
    ex.kicker=it.kind==='rad'?'Les clés':'Écriture';
    ex.q=it.kind==='rad'?'Quelle clé signifie…':'Comment écrit-on…';
    ex.stage=`<div class="fr">« ${it.f} »</div>`;
    ex.opts=shuffle([{html:hanOpt(it),ok:true,x:it},...distract(it,3,x=>x.kind==='rad'?x.h:strip(x.p)+'|'+x.f).filter(x=>x.h!==it.h).map(x=>({html:hanOpt(x),x}))]);
  } else if(type==='radical'){
    const ch=radOf(it), r=CHARS[ch][1];
    ex.kicker='Décomposer'; ex.q=`Quelle clé trouve-t-on dans ${ch} ?`;
    ex.stage=`<div class="han">${ch}</div><div class="note">dans ${it.h} · ${it.p}</div>`;
    const others=shuffle(RADS.filter(x=>x.h!==r&&![...ch].includes(x.h))).slice(0,3);
    const lab=x=>`<span class="han">${x.h}</span> ${x.f.split(/[ ;(,]/)[0]}`;
    ex.opts=shuffle([{html:lab(RADBY[r]),ok:true},...others.map(x=>({html:lab(x)}))]);
    ex.explain=`${ch} : ${CHARS[ch][0]}`;
  } else if(type==='smean'){
    ex.kicker='Phrase'; ex.q='Que veut dire cette phrase ?'; ex.one=true;
    ex.stage=`<div class="han long">${it.h}</div><div class="pin" data-pin ${pinOn()?'':'hidden'}>${it.p}</div><div class="row2">${sayBtns()}${pinBtn()}</div>`;
    ex.opts=shuffle([{html:it.f,ok:true,x:it},...distract(it,3,x=>x.f).map(x=>({html:x.f,x}))]);
  } else if(type==='build'||type==='dict'){
    ex.kicker=type==='build'?'Construis la phrase':'Dictée';
    ex.q=type==='build'?'Traduis en chinois :':'Écoute, puis remets les mots dans l’ordre';
    ex.stage=type==='build'?`<div class="fr">« ${it.f} »</div><div class="row2">${pinBtn()}</div>`:`<div class="row2">${sayBtns(true)}${pinBtn()}</div>`;
    ex.build=true; ex.autoplay=type==='dict'; ex.sel=[];
    const words=it.toks.filter(t=>!t.punct);
    const inS=new Set(words.map(w=>w.h));
    let cand=Object.values(ITEMS).filter(x=>x.kind==='word'&&x.h.length<=3&&!inS.has(x.h)&&!NOEXTRA.has(x.h));
    const kc=cand.filter(x=>KNOWN.has(x.id)); if(kc.length>=2) cand=kc;
    const extra=shuffle(cand).slice(0,words.length>4?2:1).map(x=>({h:x.h,p:x.p}));
    ex.tiles=shuffle([...words,...extra]).map((t,i)=>({h:t.h,p:t.p,i}));
  }
  return ex;
}

function wireSay(it){body.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(audioOf(it),b.dataset.say==='slow'))}

function wirePin(){
  body.querySelectorAll('[data-pintoggle]').forEach(b=>b.onclick=()=>{

/* lesson: one part of a unit (3-4 new items), each practised right after it is introduced, then sentences */
function startLesson(u){
  const done=partsDone(u), isNew=done<u.parts.length;
  const part=isNew?u.parts[done]:shuffle(u.items).slice(0,u.kind==='word'?6:4);
  const q=[];
  refreshKnown();
  if(isNew){
    part.forEach((it,k)=>{
      q.push({intro:true,it});
      if(it.kind==='phrase') q.push({it,t:'smean'},{it,t:'build'});
      else if(it.kind==='rad') q.push({it,t:'meaning'},{it,t:'reverse'});
      else q.push({it,t:'meaning'},{it,t:pick(['listen','pinyin'])});
      if(k>=1){const pv=part[k-1];q.push({it:pv,t:pv.kind==='phrase'?'dict':pick(exTypes(pv))})}
    });
  }
  shuffle(part).forEach(it=>q.push({it,t:it.kind==='phrase'?pick(['build','dict']):pick(exTypes(it))}));
  if(u.sents.length){
    const ph=new Set(part.map(i=>i.h)), kh=knownH(); part.forEach(i=>kh.add(i.h));
    const unknown=s=>s.toks.filter(t=>!t.punct&&!kh.has(t.h)).length;
    let cands=shuffle(u.sents).sort((a,b)=>{
      const ua=a.toks.some(t=>ph.has(t.h))?0:1, ub=b.toks.some(t=>ph.has(t.h))?0:1;
      return ua-ub||unknown(a)-unknown(b);
    }).slice(0,2);
    if(cands[0]) q.push({it:cands[0],t:'smean'},{it:cands[0],t:'build'});
    if(cands[1]) q.push({it:cands[1],t:'smean'},{it:cands[1],t:isNew?'build':'dict'});
  }
  L={u,q,i:0,ok:0,tot:0,retried:new Set(),answered:false,finished:false,isNew,partIdx:done,part,practice:false};
  openOl(); renderStep();
}
function startPhrasePractice(){
  const pool=shuffle(phrasePool()).slice(0,8);
  if(!pool.length) return;
  refreshKnown();
  const q=pool.map(s=>({it:s,t:pick(['smean','build','build','dict'])}));
  L={u:null,q,i:0,ok:0,tot:0,retried:new Set(),answered:false,finished:false,practice:true};
  openOl(); renderStep();
}
const tileHtml=t=>`<button class="tile" data-i="${t.i}"><span class="han">${t.h}</span><small data-pin ${pinOn()?'':'hidden'}>${t.p}</small></button>`;
function drawBuild(ex){
  const built=$('#built'), bank=$('#bank');
  built.innerHTML=ex.sel.map(i=>tileHtml(ex.tiles[i])).join('')||'<span class="note">Touche les mots dans l’ordre</span>';
  bank.querySelectorAll('.tile').forEach(b=>b.classList.toggle('used',ex.sel.includes(+b.dataset.i)));
  built.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(L.answered)return;ex.sel=ex.sel.filter(i=>i!==+b.dataset.i);drawBuild(ex)});
  const c=$('#check'); if(c) c.disabled=!ex.sel.length;
}
function renderStep(){
  if(!L) return;
  if(L.i>=L.q.length) return finishLesson();
  bar(L.i,L.q.length);
  const st=L.q[L.i], it=st.it;
  if(st.intro){
    KNOWN.add(it.id);
    body.innerHTML=`<div class="kicker">${it.kind==='rad'?'Nouvelle clé':it.kind==='phrase'?'Nouvelle phrase':'Nouveau mot'}</div>
      <div class="stage"><div class="han ${isLong(it)?'long':it.h.length>2?'mid':''}">${it.h}</div><div class="pin">${it.p}</div><div class="fr">${it.f}</div>
      <div class="row2">${sayBtns()}</div></div>
      ${extraHtml(it)}${partsHtml(it)}`;
    wireSay(it); if(S.settings.auto) speak(audioOf(it));
    setFoot('',`<button class="btn wide" id="cont">J’ai compris</button>`);
    $('#cont').onclick=()=>{L.i++;renderStep()};
    return;
  }
  const ex=st.ex||(st.ex=makeEx(it,st.t));
  L.answered=false;
  const inner=ex.build
    ?`<div class="built" id="built" aria-label="Ta phrase"></div><div class="bank" id="bank">${ex.tiles.map(tileHtml).join('')}</div>`
    :`<div class="opts ${ex.one?'one':''}">${ex.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="n">${k+1}</span>${o.html}</button>`).join('')}</div>`;
  body.innerHTML=`<div class="kicker">${ex.kicker}${L.practice?' · entraînement':''}</div><p class="q">${ex.q}</p><div class="stage">${ex.stage}</div>${inner}`;
  wireSay(it); wirePin();
  if(ex.autoplay) setTimeout(()=>speak(audioOf(it)),150);
  if(ex.build){
    ex.sel=[];
    body.querySelectorAll('#bank .tile').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i; if(L.answered||ex.sel.includes(i)) return;
      ex.sel.push(i); if(S.settings.auto&&ex.type==='build') speak(ex.tiles[i].h); drawBuild(ex);
    });
    setFoot('',`<button class="btn wide" id="check" disabled>Vérifier</button>`);
    drawBuild(ex);
    $('#check').onclick=()=>{
      if(L.answered||!ex.sel.length) return;
      const ans=ex.sel.map(i=>ex.tiles[i].h).join('');
      const ok=ans===it.key||it.alts.includes(ans);
      $('#built').classList.add(ok?'right':'wrong');
      body.querySelectorAll('.tile').forEach(b=>b.disabled=true);
      resolve(ok,ok?null:ans);
    };
  } else {
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    setFoot('',`<div class="note" style="text-align:center">Choisis une réponse${matchMedia('(hover:hover)').matches?' (touches 1 à 4)':''}</div>`);
  }
}
function answer(k){
  if(!L||L.answered) return;
  const ex=L.q[L.i].ex, ok=!!ex.opts[k].ok;
  body.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(ex.opts[j].ok)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
  resolve(ok,ex.opts[k].x||null);
}
function resolve(ok,chosen){
  const st=L.q[L.i], ex=st.ex, it=st.it;
  L.answered=true; L.tot++; if(ok)L.ok++;
  if(!ok&&!L.retried.has(L.i)){L.retried.add(L.q.length);L.q.push({it,t:st.t})}
  if(S.settings.auto&&(!['listen','tone','dict'].includes(ex.type)||!ok)) speak(audioOf(it));
  let more='';
  if(!ok&&chosen&&typeof chosen==='object'&&chosen!==it) more+=`<div class="note">Tu as choisi : <span class="han">${chosen.h}</span> ${chosen.p} · ${chosen.f}</div>`;
  if(!ok&&typeof chosen==='string') more+=`<div class="note">Ta réponse : <span class="han">${chosen}</span></div>`;
  if(ex.explain) more+=`<div class="note">${ex.explain}</div>`;
  if(!ok&&CONFUSE[it.id]) more+=`<div class="warn"><b>À ne pas confondre</b>${CONFUSE[it.id]}</div>`;
  const ans=`<div class="ans"><span class="han">${it.h}</span>${it.p} · ${it.f}</div>`;
  setFoot(ok?'good':'bad',`<div class="fb"><div><b>${ok?pick(['Bravo !','Exact !','Parfait !','Très bien !']):'Pas tout à fait'}</b>${ans}${more}</div></div>
    <button class="btn wide" id="cont">Continuer</button>`);
  $('#cont').onclick=()=>{L.i++;renderStep()};
}
function finishLesson(){
  L.finished=true;
  const pct=L.tot?Math.round(L.ok/L.tot*100):100;
  bar(1,1); $('#olcnt').textContent='';
  if(L.practice){
    const xp=L.ok*2; addXP(xp); save();
    body.innerHTML=`<div class="end"><div class="seal">句</div><h2>Entraînement terminé</h2>
      <p class="sub">Phrases</p>
      <div class="endk"><div class="kpi"><b>+${xp}</b><span>XP</span></div><div class="kpi"><b>${pct} %</b><span>réussite</span></div><div class="kpi"><b>${L.q.length}</b><span>exercices</span></div></div></div>`;
    setFoot('',`<button class="btn wide" id="cont">Continuer</button>`);
    $('#cont').onclick=closeOl; return;
  }
  const u=L.u;
  let added=0; if(L.isNew) L.part.forEach(it=>{if(!S.cards[it.id]){S.cards[it.id]=newCard();added++}});
  const prev=S.units[u.id]||{best:0,count:0};
  const parts=L.isNew?L.partIdx+1:partsDone(u);
  const finished=parts>=u.parts.length;
  S.units[u.id]={best:finished?Math.max(pct,prev.best||0):pct,count:(prev.count||0)+1,last:Date.now(),parts};
  const xp=10+L.ok*2; addXP(xp); save();
  const more=L.isNew&&!finished;
  body.innerHTML=`<div class="end"><div class="seal">${pct>=90?'优':pct>=70?'好':'加'}</div>
    <h2>${pct>=90?'Excellent !':pct>=70?'Bien joué !':'Continue comme ça !'}</h2>
    <p class="sub">${u.name}${L.isNew?` · partie ${L.partIdx+1} sur ${u.parts.length}`:''}${pct<70?' · tu peux la refaire pour consolider':''}</p>
    <div class="endk"><div class="kpi"><b>+${xp}</b><span>XP</span></div><div class="kpi"><b>${pct} %</b><span>réussite</span></div><div class="kpi"><b>${added}</b><span>nouvelles cartes</span></div></div>
    <p class="note">${added?`${added} ${nounOf(u,added)} ajouté${u.kind==='rad'||u.kind==='phrase'?'e':''}${added>1?'s':''} à tes flashcards. Première révision demain.`:'Ces cartes étaient déjà dans ton paquet.'}</p></div>`;
  setFoot('',more?`<div style="display:flex;gap:10px"><button class="btn ghost" style="flex:1" id="cont">Pause</button><button class="btn" style="flex:1" id="nextp">Partie ${parts+1}</button></div>`:`<button class="btn wide" id="cont">Continuer</button>`);
  $('#cont').onclick=closeOl;
  const np=$('#nextp'); if(np) np.onclick=()=>startLesson(u);
}


/* review */
function startReview(ids,practice){
  if(!ids.length) return;
  R={ids,i:0,practice,flipped:false,n:0,dir:S.settings.dir||'h2f'};
  openOl(); renderCard();
}
function renderCard(){
  if(!R) return;
  if(R.i>=R.ids.length) return finishReview();
  bar(R.i,R.ids.length);
  const it=ITEMS[R.ids[R.i]], c=S.cards[it.id];
  const say=`<div class="row2"><button class="icon-btn${R.dir==='aud'&&!R.flipped?' big':''}" data-say="1" aria-label="Écouter">${ICON.play}</button><button class="icon-btn" data-say="slow" aria-label="Écouter lentement">${ICON.slow}</button></div>`;
  const hanCls=isLong(it)?'long':it.h.length>2?'mid':'';
  let front;
  if(R.dir==='h2f') front=`<div class="han ${hanCls}">${it.h}</div>`;
  else if(R.dir==='f2h') front=`<div class="fr">« ${it.f} »</div>`;
  else front=say;
  const back=`<div class="han ${hanCls}">${it.h}</div><div class="pin">${it.p}</div><div class="fr">${it.f}</div>${say}`;
  body.innerHTML=`<div class="kicker">${R.practice?'Entraînement libre':'Révision'}${it.kind==='rad'?' · clé':''}</div>
    <p class="q">${R.flipped?'Tu avais trouvé ?':R.dir==='h2f'?'Que veut dire ceci, et comment le lit-on ?':R.dir==='f2h'?'Comment l’écrit-on en chinois ?':'Qu’entends-tu ?'}</p>
    <div class="stage" style="min-height:220px;justify-content:center">${R.flipped?back:front}</div>${R.flipped?extraHtml(it)+partsHtml(it):''}`;
  wireSay(it);
  if(!R.flipped&&R.dir==='aud') setTimeout(()=>speak(audioOf(it)),150);
  if(R.flipped&&S.settings.auto&&R.dir!=='aud') speak(audioOf(it));
  if(!R.flipped){
    setFoot('',`<button class="btn wide" id="flip">Afficher la réponse</button>`);
    $('#flip').onclick=()=>{R.flipped=true;renderCard()};
  } else if(R.practice){
    setFoot('',`<button class="btn wide" id="cont">Suivante</button>`);
    $('#cont').onclick=()=>rate(-1);
  } else {
    const L4=['Encore','Difficile','Bien','Facile'];
    setFoot('',`<div class="rate">${L4.map((l,q)=>`<button class="r${q}" data-q="${q}">${l}<small>${preview(c,q)}</small></button>`).join('')}</div>`);
    footIn.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>rate(+b.dataset.q));
  }
}
function rate(q){
  if(!R||!R.flipped) return;
  const id=R.ids[R.i];
  if(q>=0){schedule(S.cards[id],q); if(q===0) R.ids.push(id); addXP(1); R.n++; save();}
  R.i++; R.flipped=false; renderCard();
}
function finishReview(){
  const n=R.n, practice=R.practice;
  bar(1,1); $('#olcnt').textContent='';
  body.innerHTML=`<div class="end"><div class="seal">记</div><h2>${practice?'Entraînement terminé':'Révision terminée'}</h2>
    <p class="sub">${practice?'Ça ne change pas tes dates de révision.':`${n} réponse${n>1?'s':''} · +${n} XP`}</p></div>`;
  setFoot('',`<button class="btn wide" id="cont">Continuer</button>`);
  $('#cont').onclick=closeOl; R.ids=[];
}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(ol.hidden||e.target.tagName==='INPUT') return;
  const ck=$('#check'); const cont=$('#cont')||$('#flip')||(ck&&!ck.disabled?ck:null);
  if(L&&!L.answered&&/^[1-4]$/.test(e.key)&&body.querySelector('.opt')){answer(+e.key-1);return}
  if(R&&R.flipped&&!R.practice&&/^[1-4]$/.test(e.key)){rate(+e.key-1);return}
  if((e.key==='Enter'||e.key===' ')&&cont&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();cont.click()}
});

$('#soundBtn').onclick=soundSheet;
renderAll();
initCloud();
setInterval(renderTop,60000);
</script>

</body></html>
