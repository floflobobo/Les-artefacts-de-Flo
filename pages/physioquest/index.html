      <span class="logo">Physio<b>Quest</b></span>
    </button>
    <div class="hud">
      <div class="lvl"><span class="lvlname">Niv. ${L.i+1} · ${esc(L.name)}</span>
        <span class="xpbar" role="progressbar" aria-valuenow="${Math.round(L.pct*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.round(L.pct*100)}%"></i></span>
        <span class="mono xp">${S.xp} XP${L.nxt?" / "+L.nxt:""}</span></div>
      <div class="streak mono" title="Missions du jour d'affilée">série ${S.streak} j</div>
    </div>
  </header>${examBar}`;
}

function render(){
  const v = view.name;
  let body = "";
  if (v==="hub") body = hub();
  else if (v==="donjon") body = donjon();
  else if (v==="room") body = roomView();
  else if (v==="chains") body = chainList();
  else if (v==="chain") body = chainView();
  else if (v==="arcade") body = arcadeView();
  else if (v==="carnet") body = carnet();
  else if (v==="qdone") body = queueDone();
  app.innerHTML = header() + `<main>${body}</main>`;
  after();
  if (queue && queue.limit){ tickers.push(setInterval(()=>{ const el=$("#qclock"); if(el){ const left=queue.limit-(Date.now()-queue.start)/1000; el.textContent=fmt(left); el.classList.toggle("late", left<300); } },1000)); }
}

// ---------- ACCUEIL ----------
function dueList(){
  const all = ROOMS.map(r=>({type:"room",id:r.id,w:(r.boss?2:1)})).concat(CHAINS.map(c=>({type:"chain",id:c.id,w:1})));
  return all.filter(x=>isDue(x.id)).map(x=>{ const it=S.items[x.id]; const score = it? (1-it.last)+ (dayNum()-it.due)*0.05 : 0.6; return {...x, s: score*x.w + Math.random()*0.3}; }).sort((a,b)=>b.s-a.s);
}

  return `
  <section class="mission ${doneToday?"done":""}">

      <p class="eyebrow">Mission du jour</p>

      <p class="lede">${doneToday ? "Tu peux continuer librement, ou refaire une mission pour gratter de l'XP." : "Choisie dans ce que tu as raté ou pas encore vu, et dans ce qui arrive à échéance (J+1, J+3, J+7…)."} <span class="mono">${due.length} élément${due.length>1?"s":""} à revoir.</span></p>
    </div>
    <div class="mission-actions">
      <button class="btn primary" data-act="mission">Lancer la mission</button>

    </div>
  </section>

  <section class="modes" aria-label="Modes de jeu">
    ${modeCard("donjon","Le Donjon","Copies rédigées sur les questions du cours et des annales. Correction au barème.",ROOMS.filter(r=>r.kind!=="case").length+" salles · "+ROOMS.filter(r=>r.boss&&r.kind!=="case").length+" boss")}
    ${modeCard("patients","Patients mystères","Cas cliniques : explique chaque signe par le mécanisme.",ROOMS.filter(r=>r.kind==="case").length+" patients")}
    ${modeCard("chains","Chaînes causales","Reconstruis chaque maillon, dans l'ordre, sans en sauter.",CHAINS.length+" chaînes")}
    ${modeCard("arcade","Arcade","Vrai ou faux chrono, construit sur tes pièges récurrents.","record "+(S.best.arcade||0)+" pts")}
  </section>

  <section class="realms">
    <div class="realm-head">
      <h2>Maîtrise par chapitre</h2>
      <div class="seg" role="tablist">
        <button role="tab" aria-selected="${realm==="cardio"}" class="seg-b ${realm==="cardio"?"on cardio":""}" data-act="realm" data-v="cardio">Cardio · 10 pts</button>
        <button role="tab" aria-selected="${realm==="neuro"}" class="seg-b ${realm==="neuro"?"on neuro":""}" data-act="realm" data-v="neuro">Neuro · 10 pts</button>

    </div>
    <ol class="chapters ${realm}">
      ${chs.map(([k,c])=>{ const m=mastery(k); const n=ROOMS.filter(r=>r.ch===k).length+CHAINS.filter(x=>x.ch===k).length; return `<li><button class="chap" data-act="chapter" data-v="${k}">
        <span class="chap-name">${esc(c.name)}</span><span class="mono chap-n">${n} épreuve${n>1?"s":""}</span>
        <span class="bar"><i style="width:${Math.round(m*100)}%"></i></span><span class="mono chap-pct">${Math.round(m*100)} %</span></button></li>`; }).join("")}
    </ol>
    <div class="gradeset"><span class="eyebrow">Correction des copies</span><div class="seg" role="group" aria-label="Mode de correction"><button class="seg-b ${S.gradeMode!=="self"?"on":""}" data-act="grade" data-v="claude">Par Claude</button><button class="seg-b ${S.gradeMode==="self"?"on":""}" data-act="grade" data-v="self">Barème seul</button></div><span class="muted gs-d">${S.gradeMode==="self"?"Tu notes toi-même chaque item, sans utiliser Claude.":"Claude note ta copie item par item (utilise ton compte Claude)."}</span></div>
    <p class="foot mono">${attempted}/${total} épreuves tentées · <button class="link" data-act="carnet">Carnet d'erreurs (${nErr})</button></p>

}
function modeCard(act, title, desc, meta){
  return `<button class="mode m-${act}" data-act="${act}"><span class="mode-t">${title}</span><span class="mode-d">${desc}</span><span class="mono mode-m">${meta}</span></button>`;
}

// ---------- LISTES ----------
function donjon(){
  const cases = view.cases, chFilter = view.ch;
  let list = ROOMS.filter(r => cases ? r.kind==="case" : r.kind!=="case");
  if (chFilter) list = ROOMS.filter(r=>r.ch===chFilter);
  const groups = {};
  list.forEach(r=>{ (groups[r.ch] ||= []).push(r); });
  const title = chFilter ? CHAPTERS[chFilter].name : cases ? "Patients mystères" : "Le Donjon";
  const sub = chFilter ? "Toutes les épreuves rédigées de ce chapitre." : cases ? "Chaque patient se résout en expliquant les mécanismes, pas en donnant un nom." : "Chaque salle est une question rédigée. Les boss sont tirés des annales. Écris sans notes, puis rends ta copie.";
  const chainsHere = chFilter ? CHAINS.filter(c=>c.ch===chFilter) : [];
  return `<div class="page-head"><button class="link back" data-act="home">← Accueil</button><h1>${esc(title)}</h1><p class="lede">${sub}</p></div>
  ${Object.entries(groups).map(([ch,rs])=>`<section class="group ${realmOf(ch)}"><h2 class="eyebrow">${realmOf(ch)==="cardio"?"Cardio":"Neuro"} · ${esc(CHAPTERS[ch].name)}</h2>
    <div class="tiles">${rs.map(roomTile).join("")}</div></section>`).join("")}
  ${chainsHere.length?`<section class="group ${realmOf(chFilter)}"><h2 class="eyebrow">Chaînes causales</h2><div class="tiles">${chainsHere.map(chainTile).join("")}</div></section>`:""}`;
}
function status(id){
  const it=S.items[id];
  if(!it) return `<span class="pill new">nouveau</span>`;
  const p=Math.round(it.best*100);
  const cls = p>=85?"ok":p>=50?"mid":"bad";
  return `<span class="pill ${cls}">${p} %</span>${isDue(id)?`<span class="pill due">à revoir</span>`:""}`;
}
function roomTile(r){
  return `<button class="tile ${r.boss?"boss":""}" data-act="open" data-v="${r.id}">
    <span class="tile-top">${r.boss?`<span class="pill boss-p">${esc(r.src||"Boss")}</span>`:""}${r.kind==="case"?`<span class="pill case-p">patient</span>`:""}<span class="mono">${pts(r.pts)} pts · ${r.min} min</span></span>
    <span class="tile-t">${esc(r.title)}</span>
    <span class="tile-s">${status(r.id)}</span></button>`;
}
function chainTile(c){
  return `<button class="tile" data-act="openchain" data-v="${c.id}">
    <span class="tile-top"><span class="mono">${c.steps.length} maillons</span></span>
    <span class="tile-t">${esc(c.title)}</span><span class="tile-s">${status(c.id)}</span></button>`;
}
function chainList(){
  const by = r => CHAINS.filter(c=>realmOf(c.ch)===r);
  return `<div class="page-head"><button class="link back" data-act="home">← Accueil</button><h1>Chaînes causales</h1><p class="lede">Tu connais le début et la fin. Écris chaque maillon intermédiaire, un par un, avec son mécanisme. Un maillon sauté, c'est des points perdus à l'examen.</p></div>
  <section class="group cardio"><h2 class="eyebrow">Cardio</h2><div class="tiles">${by("cardio").map(chainTile).join("")}</div></section>
  <section class="group neuro"><h2 class="eyebrow">Neuro</h2><div class="tiles">${by("neuro").map(chainTile).join("")}</div></section>`;
}

// ---------- SALLE (copie rédigée) ----------
let roomState = null; // {id, phase:"write"|"grading"|"result", t0, res, ctl}
function openRoom(id){ roomState = {id, phase:"write", t0:null}; go({name:"room"}); }
function roomView(){
  const r = ROOMS.find(x=>x.id===roomState.id);
  const realm = realmOf(r.ch);
  const head = `<div class="page-head room-head ${realm}">
    ${queue?"":`<button class="link back" data-act="${r.kind==="case"?"patients":"donjon"}">← ${r.kind==="case"?"Patients":"Donjon"}</button>`}
    <p class="eyebrow">${realm==="cardio"?"Cardio":"Neuro"} · ${esc(CHAPTERS[r.ch].name)}${r.boss?" · "+esc(r.src||"Boss"):""}</p>
    <h1>${esc(r.title)}</h1></div>`;
  const vign = r.v ? `<div class="vignette"><p class="eyebrow">Le patient</p><p>${esc(r.v)}</p></div>` : "";
  const q = `<div class="question"><div class="q-meta mono"><span>${pts(r.pts)} pts</span><span>~${r.min} min conseillées</span></div><p>${esc(r.q)}</p></div>`;
  if (roomState.phase === "write" || roomState.phase === "grading"){
    const draft = S.drafts[r.id] || "";
    const grading = roomState.phase==="grading";
    return head + vign + q + `
    <div class="writer">
      <div class="writer-bar mono"><span id="clock">${roomState.t0?fmt((Date.now()-roomState.t0)/1000):"0:00"} / ${r.min}:00</span><span id="wc">${draft.trim()?draft.trim().split(/\s+/).length:0} mots</span></div>
      <label class="sr" for="ans">Ta copie</label>
      <textarea id="ans" spellcheck="true" placeholder="Rédige comme à l'examen : phrases complètes, mots-clés exacts, chaque étape avec son mécanisme." ${grading?"disabled":""}>${esc(draft)}</textarea>
      <div class="writer-actions">
        ${grading ? `<span class="grading"><span class="dot"></span>Correction en cours au barème…</span><button class="btn" data-act="stopai">Corriger par mots-clés</button>`
          : `<button class="btn primary" data-act="submit">Rendre la copie</button><button class="btn ghost" data-act="hint">Indice (−10 XP)</button>`}
      </div>
      <div id="hintbox"></div>
    </div>`;
  }
  // résultat
  const res = roomState.res;
  const total = res.items.reduce((a,x)=>a+x.got,0);
  const ratio = total / r.pts;
  const grade = (total/r.pts*20);
  const verdict = ratio>=0.85 ? "Boss vaincu" : ratio>=0.6 ? "Bien entamé" : ratio>=0.35 ? "Il te manque des étapes" : "À reprendre";
  return head + vign + q + `
  <section class="result ${ratio>=0.85?"win":ratio>=0.5?"mid":"lose"}">
    <div class="score"><span class="big mono">${pts(total)}</span><span class="mono">/ ${pts(r.pts)}</span><span class="sur20 mono">≈ ${pts(Math.round(grade*4)/4)}/20</span></div>
    <div class="verdict"><p class="eyebrow">${res.mode==="ai"?"Corrigé par Claude au barème":"Auto-correction au barème"}</p><h2>${verdict}</h2>
      ${res.mode==="kw"?`<p class="note">${esc(res.note||"Note chaque item : Oui, En partie ou Non.")} Sois exigeant : une idée sans son mécanisme, c'est « En partie ».</p>`:""}
      ${res.conseil?`<p class="note"><b>Priorité :</b> ${esc(res.conseil)}</p>`:""}</div>
  </section>
  <ol class="rubric">
    ${r.r.map((it,i)=>{ const x=res.items[i]; const st = x.got>=it.p-1e-9?"full":x.got>0?"part":"miss"; return `<li class="${st}">
      <span class="mark mono">${pts(x.got)}/${pts(it.p)}</span>
      <div><p>${esc(it.t)}</p>${x.note?`<p class="ai-note">${esc(x.note)}</p>`:""}
      ${res.mode==="kw"?`<div class="rate" role="group" aria-label="Ma note pour cet item"><button class="rb ${st==="full"?"on ok":""}" data-act="selfrate" data-i="${i}" data-v="1">Oui</button><button class="rb ${st==="part"?"on mid":""}" data-act="selfrate" data-i="${i}" data-v="0.5">En partie</button><button class="rb ${st==="miss"?"on bad":""}" data-act="selfrate" data-i="${i}" data-v="0">Non</button></div>`:""}</div></li>`; }).join("")}
  </ol>
  ${res.erreurs&&res.erreurs.length?`<section class="errs"><h3>Erreurs relevées dans ta copie</h3><ul>${res.erreurs.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></section>`:""}
  <details class="mycopy"><summary>Relire ma copie</summary><pre>${esc(S.drafts[r.id]||"")}</pre></details>
  <div class="next">
    ${queue?`<button class="btn primary" data-act="qnext">Étape suivante</button>`:`<button class="btn primary" data-act="retry">Réécrire de tête</button><button class="btn" data-act="${r.kind==="case"?"patients":"donjon"}">Autre ${r.kind==="case"?"patient":"salle"}</button>`}
  </div>`;
}
function hintFor(r){
  const text = S.drafts[r.id]||"";
  const miss = r.r.filter(it=>!itemHit(text,it));
  if(!miss.length) return "Tous les items semblent présents. Vérifie maintenant que chaque étape a son mécanisme.";
  const it = miss[0];
  const g = it.k[0].split("|")[0];
  return `Il te manque au moins ${miss.length} idée${miss.length>1?"s":""} du barème. Piste pour la première : pense à « ${g} ».`;
}
async function submitRoom(){
  const r = ROOMS.find(x=>x.id===roomState.id);
  const text = ($("#ans")?.value || "").trim();
  if (text.split(/\s+/).length < 8){ toast("Écris au moins quelques phrases avant de rendre."); return; }
  S.drafts[r.id] = text; save();
  const kw = () => ({mode:"kw", items: r.r.map(it=>({got: itemHit(text,it)?it.p:0, note:""}))});
  if (S.gradeMode === "self"){ const res = kw(); res.note = "Barème seul : relis ta copie et note chaque item. Les idées repérées par mots-clés sont pré-notées, corrige si besoin."; finishRoom(r, res); return; }
  const sample = aiOff ? null : await getSample();
  if (!sample){ const res = kw(); res.note = "La correction par Claude n'est pas disponible ici : note chaque item toi-même (pré-noté par mots-clés)."; finishRoom(r, res); return; }
  roomState.phase = "grading"; roomState.ctl = new AbortController(); render();
  try {
    const out = await sample.json(aiPrompt(r, text), {signal: roomState.ctl.signal, modelTier:"default", cache:false});
    const items = r.r.map((it,i)=>{ const o = (out.items||[]).find(x=>Number(x.n)===i+1) || (out.items||[])[i] || {}; let g = Number(o.pts); if(!isFinite(g)) g=0; g=Math.max(0,Math.min(it.p, Math.round(g*4)/4)); return {got:g, note: String(o.note||"")}; });
    finishRoom(r, {mode:"ai", items, erreurs: Array.isArray(out.erreurs)?out.erreurs.map(String).filter(Boolean):[], conseil: out.conseil?String(out.conseil):""});
  } catch(e){
    const code = e && e.code;
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) aiOff = true;
    const res = kw();
    res.note = code==="cancelled" ? "Correction par mots-clés à ta demande. Coche les idées que tu as exprimées autrement." :
      code==="rate_limited" ? "Claude est momentanément indisponible (limite atteinte) : correction par mots-clés. Coche les idées exprimées autrement." :
      "La correction par Claude n'a pas abouti : correction par mots-clés. Coche les idées exprimées autrement.";
    finishRoom(r, res);
  }
}
function finishRoom(r, res){
  roomState.phase = "result"; roomState.res = res;
  applyRoomScore(r, true);
  render();
}
function applyRoomScore(r, first){
  const res = roomState.res;
  const total = res.items.reduce((a,x)=>a+x.got,0);
  const ratio = total/r.pts;
  if (first){
    record(r.id, ratio);
    gainXP(total/r.pts*100*(r.boss?1.5:1));
    r.r.forEach((it,i)=>{ if(res.items[i].got < it.p*0.5){ const e = S.err[it.t] || {n:0, src:r.id}; e.n++; e.last=todayKey(); S.err[it.t]=e; } });
    if (queue) queue.scores.push({id:r.id, got:total, max:r.pts});
    save();
  } else {
    const itm = S.items[r.id]; if(itm){ itm.last = ratio; itm.best = Math.max(itm.best, ratio); }
    if (queue && queue.scores.length){ const s=queue.scores[queue.scores.length-1]; if(s.id===r.id) s.got=total; }
    r.r.forEach((it,i)=>{ if(res.items[i].got >= it.p*0.5 && S.err[it.t] && S.err[it.t].src===r.id && S.err[it.t].last===todayKey()){ S.err[it.t].n--; if(S.err[it.t].n<=0) delete S.err[it.t]; } });
    save();
  }
}

// ---------- CHAÎNE ----------
let chainState = null; // {id, i, res:[{ok,ans}], input}
function openChain(id){ chainState = {id, i:0, res:[]}; go({name:"chain"}); }
function chainView(){
  const c = CHAINS.find(x=>x.id===chainState.id);
  const realm = realmOf(c.ch);
  const done = chainState.i >= c.steps.length;
  const rows = c.steps.map((s,i)=>{
    const r = chainState.res[i];
    if (r) return `<li class="link-step ${r.ok?"ok":"ko"}"><span class="n mono">${i+1}</span><div>${r.ans?`<p class="your">${esc(r.ans)}</p>`:""}<p class="truth">${esc(s.t)}</p>${!r.ok?`<button class="link small" data-act="chainok" data-i="${i}">J'avais juste</button>`:""}</div></li>`;
    if (i===chainState.i) return `<li class="link-step cur"><span class="n mono">${i+1}</span><div><label class="sr" for="step">Maillon ${i+1}</label><input id="step" autocomplete="off" placeholder="Maillon ${i+1} : quoi, et par quel mécanisme ?"><div class="row"><button class="btn primary small" data-act="stepgo">Valider</button><button class="btn ghost small" data-act="stepskip">Je sèche</button></div></div></li>`;
    return `<li class="link-step hidden"><span class="n mono">${i+1}</span><div><p>? ? ?</p></div></li>`;
  }).join("");
  const ok = chainState.res.filter(r=>r&&r.ok).length;
  return `<div class="page-head ${realm}">${queue?"":`<button class="link back" data-act="chains">← Chaînes</button>`}<p class="eyebrow">${realm==="cardio"?"Cardio":"Neuro"} · chaîne causale</p><h1>${esc(c.title)}</h1></div>
  <ol class="chain ${realm}">
    <li class="end start"><span class="n mono">début</span><p>${esc(c.start)}</p></li>
    ${rows}
    <li class="end"><span class="n mono">fin</span><p>${esc(c.end)}</p></li>
  </ol>
  ${done?`<section class="result ${ok/c.steps.length>=0.85?"win":ok/c.steps.length>=0.5?"mid":"lose"}"><div class="score"><span class="big mono">${ok}</span><span class="mono">/ ${c.steps.length} maillons</span></div><div class="verdict"><h2>${ok===c.steps.length?"Chaîne complète":"Des maillons ont sauté"}</h2><p class="note">Relis la chaîne complète à voix haute, puis refais-la de tête plus tard.</p></div></section>
  <div class="next">${queue?`<button class="btn primary" data-act="qnext">Étape suivante</button>`:`<button class="btn primary" data-act="openchain" data-v="${c.id}">Recommencer</button><button class="btn" data-act="chains">Autre chaîne</button>`}</div>`:""}`;
}
function stepAnswer(skip){
  const c = CHAINS.find(x=>x.id===chainState.id);
  const s = c.steps[chainState.i];
  const ans = skip ? "" : ($("#step")?.value||"").trim();
  if (!skip && !ans){ toast("Écris le maillon, ou clique sur « Je sèche »."); return; }
  const ok = !skip && s.k.every(g=>groupHit(norm(ans),g));
  chainState.res[chainState.i] = {ok, ans};
  if (!ok){ const e=S.err[s.t]||{n:0,src:c.id}; e.n++; e.last=todayKey(); S.err[s.t]=e; }
  chainState.i++;
  if (chainState.i >= c.steps.length) finishChain(c);
  render(); const inp=$("#step"); if(inp) inp.focus();
}
function finishChain(c){
  const ok = chainState.res.filter(r=>r.ok).length;
  record(c.id, ok/c.steps.length); gainXP(ok*10);
  if (queue) queue.scores.push({id:c.id, got:ok, max:c.steps.length, chain:true});
  save();
}

// ---------- ARCADE ----------
let arc = null;
function startArcade(seconds=90, n=25){
  const idx = ARCADE.map((_,i)=>i);
  const w = i => 1 + 2*(S.arcMiss[i]||0) + Math.random()*1.5;
  idx.sort((a,b)=>w(b)-w(a));
  arc = {deck: idx.slice(0,n).sort(()=>Math.random()-0.5), i:0, score:0, combo:0, left:seconds, paused:false, wrong:[], over:false, lastT:Date.now()};
  go({name:"arcade"});
}
function arcadeView(){
  if (!arc) return "";
  if (arc.over) {
    const best = arc.score > (S.best.arcade||0);
    return `<div class="page-head">${queue?"":`<button class="link back" data-act="home">← Accueil</button>`}<p class="eyebrow">Arcade</p><h1>${best?"Nouveau record":"Fin du sprint"}</h1></div>
    <section class="result ${arc.wrong.length<=2?"win":arc.wrong.length<=6?"mid":"lose"}"><div class="score"><span class="big mono">${arc.score}</span><span class="mono">pts</span></div><div class="verdict"><h2>${arc.i} réponses, ${arc.wrong.length} erreur${arc.wrong.length>1?"s":""}</h2><p class="note">Les affirmations ratées reviendront plus souvent dans tes prochains sprints.</p></div></section>
    ${arc.wrong.length?`<section class="errs"><h3>À retenir</h3><ul>${arc.wrong.map(i=>`<li><b>${ARCADE[i][1]?"Vrai":"Faux"} :</b> ${esc(ARCADE[i][0])}<br><span class="muted">${esc(ARCADE[i][2])}</span></li>`).join("")}</ul></section>`:""}
    <div class="next">${queue?`<button class="btn primary" data-act="qnext">Terminer la mission</button>`:`<button class="btn primary" data-act="arcade">Rejouer</button><button class="btn" data-act="home">Accueil</button>`}</div>`;
  }
  const card = ARCADE[arc.deck[arc.i]];
  const mult = 1 + Math.min(4, Math.floor(arc.combo/3));
  return `<div class="arcade">
    <div class="arc-hud mono"><span>${arc.score} pts</span><span class="combo">${arc.combo>=3?"×"+mult+" combo":""}</span><span id="arcclock" class="${arc.left<15?"late":""}">${fmt(arc.left)}</span></div>
    <div class="arc-progress"><i style="width:${Math.round(arc.i/arc.deck.length*100)}%"></i></div>
    <div class="arc-card ${realmOf(card[3])} ${arc.paused?"wrong":""}">
      <p class="eyebrow">${realmOf(card[3])==="cardio"?"Cardio":"Neuro"} · ${esc(CHAPTERS[card[3]].name)}</p>
      <p class="stmt">${esc(card[0])}</p>
      ${arc.paused?`<div class="explain"><p><b>C'était ${card[1]?"VRAI":"FAUX"}.</b> ${esc(card[2])}</p><button class="btn primary" data-act="arcok" id="arcok">Compris (Entrée)</button></div>`:
      `<div class="vf"><button class="btn vf-b v" data-act="arcans" data-v="1">Vrai <kbd>V</kbd></button><button class="btn vf-b f" data-act="arcans" data-v="0">Faux <kbd>F</kbd></button></div>`}
    </div>
    <p class="muted mono center">Une erreur met le chrono en pause le temps de lire l'explication.</p>
  </div>`;
}
function arcAnswer(v){
  if (!arc || arc.paused || arc.over) return;
  const i = arc.deck[arc.i], card = ARCADE[i];
  if (v === card[1]){ arc.combo++; const mult = 1 + Math.min(4, Math.floor(arc.combo/3)); arc.score += 10*mult; if(S.arcMiss[i]) S.arcMiss[i]=Math.max(0,S.arcMiss[i]-1); arc.i++; if(arc.i>=arc.deck.length) endArcade(); }
  else { arc.combo=0; arc.paused=true; arc.wrong.push(i); S.arcMiss[i]=(S.arcMiss[i]||0)+1; }
  save(); render(); if(arc.paused) $("#arcok")?.focus();
}
function arcContinue(){ arc.paused=false; arc.i++; arc.lastT=Date.now(); if(arc.i>=arc.deck.length) endArcade(); render(); }
function endArcade(){
  if (arc.over) return;
  arc.over = true; clearTickers();
  if (arc.score > (S.best.arcade||0)) S.best.arcade = arc.score;
  gainXP(arc.score/10);
  if (queue) queue.scores.push({id:"arcade", got:arc.i-arc.wrong.length, max:arc.i, arcade:true});
  save();
}

// ---------- CARNET ----------
function carnet(){
  const list = Object.entries(S.err).sort((a,b)=>b[1].n-a[1].n);
  const srcName = id => (ROOMS.find(r=>r.id===id)||CHAINS.find(c=>c.id===id)||{title:"?"}).title;
  return `<div class="page-head"><button class="link back" data-act="home">← Accueil</button><h1>Carnet d'erreurs</h1><p class="lede">Les idées du barème que tu as oubliées ou ratées, de la plus fréquente à la plus rare. Elles disparaissent quand tu les réussis.</p></div>
  ${list.length?`<ol class="carnet">${list.map(([t,e])=>`<li><span class="pill bad mono">×${e.n}</span><div><p>${esc(t)}</p><button class="link small" data-act="${CHAINS.find(c=>c.id===e.src)?"openchain":"open"}" data-v="${e.src}">${esc(srcName(e.src))}</button></div><button class="link small" data-act="delerr" data-v="${esc(t)}">Acquis</button></li>`).join("")}</ol>`:`<p class="empty">Rien pour l'instant. Rends une copie ou fais une chaîne : les idées ratées s'inscriront ici.</p>`}`;
}

// ---------- MISSION / EXAMEN ----------
function startMission(){
  const due = dueList();
  const rooms = due.filter(x=>x.type==="room").slice(0,2);
  const chain = due.find(x=>x.type==="chain") || {type:"chain", id: CHAINS[Math.floor(Math.random()*CHAINS.length)].id};
  while (rooms.length<2){ const r = ROOMS[Math.floor(Math.random()*ROOMS.length)]; if(!rooms.find(x=>x.id===r.id)) rooms.push({type:"room",id:r.id}); }
  queue = {kind:"mission", items:[rooms[0], chain, rooms[1], {type:"arcade"}], i:0, scores:[], start:Date.now()};
  runQueue();
}
function startExam(){
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const cardioSets = [["c-dcsna"],["c-coro","c-ves"],["p-vaso","c-ecg"],["c-ves","p-vaso"]];
  const neuroSets = [["n-cbh"],["n-dig","n-noci"],["n-chol","n-cochlee"],["n-noci","n-dig"]];
  const ids = pick(cardioSets).concat(pick(neuroSets));
  queue = {kind:"exam", items: ids.map(id=>({type:"room",id})), i:0, scores:[], start:Date.now(), limit:3600};
  runQueue();
}
function runQueue(){
  const it = queue.items[queue.i];
  if (!it){ go({name:"qdone"}); return; }
  if (it.type==="room") openRoom(it.id);
  else if (it.type==="chain") openChain(it.id);
  else startArcade(60, 15);
}
function queueDone(){
  const q = queue; if(!q) return "";
  let html = `<div class="page-head"><p class="eyebrow">${q.kind==="exam"?"Examen blanc":"Mission du jour"}</p><h1>${q.kind==="exam"?"Copie rendue":"Mission accomplie"}</h1></div>`;
  if (q.kind==="exam"){
    const got = q.scores.reduce((a,s)=>a+s.got,0), max = q.scores.reduce((a,s)=>a+s.max,0);
    const mins = Math.round((Date.now()-q.start)/60000);
    html += `<section class="result ${got/max>=0.75?"win":got/max>=0.5?"mid":"lose"}"><div class="score"><span class="big mono">${pts(Math.round(got/max*20*4)/4)}</span><span class="mono">/ 20</span></div><div class="verdict"><h2>${pts(got)} / ${pts(max)} points en ${mins} min</h2><p class="note">${mins>60?"Tu as dépassé l'heure : à l'examen, une copie inachevée perd ses derniers points.":"Dans le temps."}</p></div></section>`;
  } else {
    if (S.lastMission !== todayKey()){ const y = dayNum()-1; const last = S.lastMission? dayNum(S.lastMission):null; S.streak = (last===y)? S.streak+1 : 1; S.lastMission = todayKey(); gainXP(50); save(); }
    html += `<p class="lede">+50 XP de bonus. Série : ${S.streak} jour${S.streak>1?"s":""}.</p>`;
  }
  html += `<ol class="rubric">${q.scores.map(s=>{ const name = s.arcade?"Sprint arcade":(ROOMS.find(r=>r.id===s.id)||CHAINS.find(c=>c.id===s.id)).title; const r=s.max?s.got/s.max:0; return `<li class="${r>=0.85?"full":r>0.3?"part":"miss"}"><span class="mark mono">${pts(s.got)}/${pts(s.max)}</span><div><p>${esc(name)}</p></div></li>`; }).join("")}</ol>
  <div class="next"><button class="btn primary" data-act="endq">Retour à l'accueil</button></div>`;
  return html;
}

// ---------- Événements ----------
function after(){
  const ta = $("#ans");
  if (ta){
    ta.addEventListener("input", ()=>{
      if(!roomState.t0) roomState.t0 = Date.now();
      S.drafts[roomState.id] = ta.value; save();
      const wc=$("#wc"); if(wc) wc.textContent=(ta.value.trim()?ta.value.trim().split(/\s+/).length:0)+" mots";
    });
    if (roomState.phase==="write"){
      if (S.drafts[roomState.id] && !roomState.t0) roomState.t0 = Date.now();
      tickers.push(setInterval(()=>{ const c=$("#clock"); const r=ROOMS.find(x=>x.id===roomState.id); if(c&&roomState.t0){ const s=(Date.now()-roomState.t0)/1000; c.textContent=fmt(s)+" / "+r.min+":00"; c.classList.toggle("late", s>r.min*60); } },1000));
      ta.focus();
    }
  }
  const st = $("#step");
  if (st) st.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); stepAnswer(false); } });
  if (view.name==="arcade" && arc && !arc.over){
    arc.lastT = Date.now();
    tickers.push(setInterval(()=>{
      if (!arc || arc.over) return;
      const now=Date.now(); if(!arc.paused) arc.left -= (now-arc.lastT)/1000; arc.lastT=now;
      const c=$("#arcclock"); if(c){ c.textContent=fmt(arc.left); c.classList.toggle("late",arc.left<15); }
      if (arc.left<=0){ endArcade(); render(); }
    },250));
  }
}
document.addEventListener("keydown", e=>{
  if (view.name==="arcade" && arc && !arc.over){
    if (arc.paused && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); arcContinue(); }
    else if (!arc.paused && (e.key==="v"||e.key==="V"||e.key==="ArrowLeft")) arcAnswer(true);
    else if (!arc.paused && (e.key==="f"||e.key==="F"||e.key==="ArrowRight")) arcAnswer(false);
  }
  if (view.name==="room" && roomState?.phase==="write" && (e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); submitRoom(); }
});
app.addEventListener("change", e=>{
  const t = e.target;
  if (false){
    const r = ROOMS.find(x=>x.id===roomState.id); const i=+t.dataset.i;
    roomState.res.items[i].got = t.checked ? r.r[i].p : 0;
    applyRoomScore(r, false); render();
  }
});
app.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.tagName==="INPUT") return;
  const a = b.dataset.act, v = b.dataset.v;
  switch(a){
    case "home": if(queue && !confirmQuit()) return; queue=null; go({name:"hub", realm:lastRealm}); break;
    case "realm": view.realm=v; lastRealm=v; render(); break;
    case "donjon": go({name:"donjon"}); break;
    case "patients": go({name:"donjon", cases:true}); break;
    case "chapter": go({name:"donjon", ch:v}); break;
    case "chains": go({name:"chains"}); break;
    case "arcade": startArcade(); break;
    case "carnet": go({name:"carnet"}); break;
    case "open": openRoom(v); break;
    case "openchain": openChain(v); break;
    case "submit": submitRoom(); break;
    case "stopai": roomState.ctl?.abort(); break;
    case "hint": { const r=ROOMS.find(x=>x.id===roomState.id); S.drafts[r.id]=$("#ans")?.value||""; S.xp=Math.max(0,S.xp-10); save(); $("#hintbox").innerHTML=`<p class="hint">${esc(hintFor(r))}</p>`; break; }
    case "retry": { const id=roomState.id; S.drafts[id]=""; save(); openRoom(id); break; }
    case "stepgo": stepAnswer(false); break;
    case "stepskip": stepAnswer(true); break;
    case "chainok": { const i=+b.dataset.i; const c=CHAINS.find(x=>x.id===chainState.id); chainState.res[i].ok=true; const t=c.steps[i].t; if(S.err[t]){ S.err[t].n--; if(S.err[t].n<=0) delete S.err[t]; } if(chainState.i>=c.steps.length){ const ok=chainState.res.filter(r=>r.ok).length; const it=S.items[c.id]; if(it){ it.last=ok/c.steps.length; it.best=Math.max(it.best,it.last);} gainXP(10); if(queue){ const s=queue.scores[queue.scores.length-1]; if(s&&s.id===c.id) s.got=ok; } } save(); render(); break; }
    case "selfrate": { const r=ROOMS.find(x=>x.id===roomState.id); const i=+b.dataset.i; roomState.res.items[i].got = Math.round(r.r[i].p*parseFloat(v)*4)/4; applyRoomScore(r,false); render(); break; }
    case "grade": S.gradeMode=v; save(); render(); break;
    case "arcans": arcAnswer(v==="1"); break;
    case "arcok": arcContinue(); break;
    case "delerr": delete S.err[v]; save(); render(); break;
    case "mission": startMission(); break;
    case "exam": startExam(); break;
    case "qnext": queue.i++; runQueue(); break;
    case "quitq": if(confirmQuit()){ queue=null; go({name:"hub", realm:lastRealm}); } break;
    case "endq": queue=null; go({name:"hub", realm:lastRealm}); break;
  }
});
let quitArmed = 0;
function confirmQuit(){
  if (Date.now()-quitArmed < 4000) return true;
  quitArmed = Date.now(); toast("Clique encore une fois pour quitter (la progression de cette étape sera perdue).");
  return false;
}

render();
getSample(); // prépare la correction par Claude sans rien demander

</script>
