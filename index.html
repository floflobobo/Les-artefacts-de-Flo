<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les artéfacts de Flo</title>
<meta name="description" content="Mes fiches, cartes et jeux de révision de pharmacie, rangés par matière.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf8; --ink:#1f2a24; --muted:#5f6b63; --line:#e3ddd0;
  --accent:#1f6b52; --accent-soft:#e2efe8; --ext:#8a5a12; --ext-soft:#f6ead3;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121614; --paper:#1a201d; --ink:#e8ece9; --muted:#9aa69f; --line:#2c3531;
  --accent:#6fcfa8; --accent-soft:#1f3229; --ext:#e3b468; --ext-soft:#352b1a; color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:40px 16px 72px}
header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:20px}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(2.1rem,6vw,3.4rem);line-height:1.05;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:8px 0 0;max-width:46ch}
.search{flex:1 1 260px;max-width:360px}
.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
nav.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 8px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 .9rem Inter,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-top:36px}
section h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:1.45rem;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
section h2 small{font:500 .85rem Inter,sans-serif;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:8px;min-height:120px;padding:16px 18px;background:var(--paper);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card h3{margin:0;font-size:1.05rem;font-weight:600;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.tag{font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.ext{background:var(--ext-soft);color:var(--ext)}
.empty{color:var(--muted);margin-top:32px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
footer .tag{margin-right:4px}
@media (prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Les artéfacts de Flo</h1>
      <p class="sub">Fiches, cartes et jeux de révision de pharmacie, rangés par matière.</p>
    </div>
    <label class="search"><input id="q" type="search" placeholder="Rechercher un artéfact…" aria-label="Rechercher"></label>
  </header>
  <nav class="chips" id="chips" aria-label="Filtrer par matière"></nav>
  <main id="list"></main>
  <p class="empty" id="empty" hidden>Aucun artéfact ne correspond.</p>
  <footer>
    <span class="tag">Page</span> hébergée ici &nbsp;·&nbsp;
    <span class="tag ext">claude.ai</span> s'ouvre sur claude.ai (connexion requise).
  </footer>
</div>
<script>
const CATS = [
  ["meta", "Métabolisme & biochimie"],
  ["physio", "Physiologie & neurologie"],
  ["chimie", "Chimie"],
  ["gen", "Génétique"],
  ["myco", "Mycologie"],
  ["maths", "Maths"],
  ["autres", "Autres"],
];
const CA = "https://claude.ai/code/artifact/";
const ITEMS = [
  {t:"Metabolix", c:"meta", d:"2026-10-19", u:"pages/metabolix/"},
  {t:"Métabo Puzzle", c:"meta", d:"2026-10-14", u:"pages/metabo-puzzle/"},
  {t:"Métabolisme des nucléotides", c:"meta", d:"2026-10-14", u:"pages/nucleotides/"},
  {t:"Carte du glucose", c:"meta", d:"2026-10-06", u:CA+"2656aefa-905f-43d9-b99b-ca3b8240763b", ext:1},
  {t:"Carte du métabolisme des lipides", c:"meta", d:"2026-10-04", u:CA+"6c1d7904-d1f5-44c5-a77e-a76055130ba5", ext:1},
  {t:"Atlas Neuro UE 3.5", c:"physio", d:"2026-10-16", u:"pages/atlas-neuro/"},
  {t:"PhysioQuest UE 3.5", c:"physio", d:"2026-10-09", u:"pages/physioquest/"},
  {t:"Fiche — Les forces de Starling", c:"physio", d:"2026-10-17", u:CA+"04110ead-5a9f-4c89-987b-6e340ee25e5b", ext:1},
  {t:"Correction QCM — Bilan hydrique, œdèmes & acide-base", c:"physio", d:"2026-10-17", u:CA+"423b9b0d-f65a-4930-b337-dcad1e8d709e", ext:1},
  {t:"Paillasse Orga", c:"chimie", d:"2026-10-14", u:"pages/paillasse-orga/"},
  {t:"Fiches chimie générale", c:"chimie", d:"2026-10-02", u:CA+"158bab1f-67c7-4846-9676-67e4171ef961", ext:1},
  {t:"Fiches formulaire — Chimie générale", c:"chimie", d:"2026-10-02", u:CA+"7fce2489-988b-4e8f-b3f6-8a492c202161", ext:1},
  {t:"Génétique Fernandez-Vidal", c:"gen", d:"2026-10-20", u:"pages/genetique/"},
  {t:"Fiche d'identification des genres de champignons", c:"myco", d:"2026-09-17", u:CA+"bd12c80c-8be5-434f-80f4-c23fe0723fe2", ext:1},
  {t:"Séries génératrices kawaii", c:"maths", d:"2026-10-19", u:"pages/series-kawaii/"},
  {t:"Séries génératrices — séries entières", c:"maths", d:"2026-10-19", u:CA+"74bdc30b-d68d-46f2-a1a3-165c824e20c0", ext:1},
  {t:"GAPDP2 Ligne G", c:"autres", d:"2026-10-19", u:"pages/gapdp2/"},
  {t:"Dōjō Gungi", c:"autres", d:"2026-10-19", u:"pages/dojo-gungi/"},
  {t:"Masse Nilson", c:"autres", d:"2026-10-16", u:"pages/masse-nilson/"},
  {t:"Chinois Lù", c:"autres", d:"2026-10-16", u:"pages/chinois-lu/"},
];
const fmt = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
let cat = "all";
const chips = document.getElementById("chips");
[["all","Tout"], ...CATS].forEach(([k,label]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = label; b.dataset.k = k;
  b.setAttribute("aria-pressed", k === cat);
  b.onclick = () => { cat = k; chips.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.k === k)); render(); };
  chips.appendChild(b);
});
function render(){
  const q = norm(document.getElementById("q").value.trim());
  let html = "", shown = 0;
  for (const [k,label] of CATS){
    if (cat !== "all" && cat !== k) continue;
    const items = ITEMS.filter(i => i.c === k && (!q || norm(i.t).includes(q))).sort((a,b) => b.d.localeCompare(a.d));
    if (!items.length) continue;
    shown += items.length;
    html += `<section><h2>${label} <small>${items.length}</small></h2><div class="grid">` +
      items.map(i => `<a class="card" href="${i.u}"${i.ext ? ' target="_blank" rel="noopener"' : ''}>
        <h3>${esc(i.t)}</h3>
        <div class="meta"><span>${fmt(i.d)}</span><span class="tag${i.ext ? ' ext' : ''}">${i.ext ? 'claude.ai ↗' : 'Page'}</span></div>
      </a>`).join("") + `</div></section>`;
  }
  document.getElementById("list").innerHTML = html;
  document.getElementById("empty").hidden = shown > 0;
}
document.getElementById("q").addEventListener("input", render);
render();
</script>
</body>
</html>
